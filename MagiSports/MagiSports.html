<meta name="description" content="FIFA・サッカー各国リーグ・MLB・NBA・NFL・NHLの結果・今後の予定・順位表・試合内容・フォーメーションをまとめてチェック。MagiOneシリーズ。">

<style>
:root{
  --bg:#070b18; --bg2:#0d1226; --surf:#141a30; --surf2:#1b2240; --line:rgba(255,255,255,.10);
  --tx:#eaf0ff; --tx2:#94a0c4; --tx3:#5f6c92;
  --gold:#ffcc4d; --gold2:#ff9d2e; --blue:#3f7dff; --cyan:#33d6ff; --violet:#8b6bff; --green:#3fe08a; --red:#ff5b6b; --pink:#ff5b9e;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; background:radial-gradient(1100px 700px at 80% -8%,#1a2350 0%,var(--bg2) 42%,var(--bg) 100%); color:var(--tx); min-height:100%;}
img{-webkit-user-drag:none;}
a{color:inherit;}

/* splash */
#splash{position:fixed; inset:0; z-index:9000; background:#05070f; display:flex; align-items:center; justify-content:center; transition:opacity .55s ease;}
#splash.out{opacity:0; pointer-events:none;}
.sp-phase{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none;}
.sp-intro{justify-content:space-between; gap:18px; padding:11vh 24px;}
.sp-intro.in{opacity:1;}
.sp-intro.out{opacity:0; transition:opacity .5s ease;}
.sp-logo{width:min(540px,86vw); border-radius:22px; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:22px 30px;}
.sp-logo img{max-width:100%; max-height:20vh; object-fit:contain; display:block;}
.sp-ngx{background:#000;} .sp-mf{background:#fff;}
.sp-intro.in .sp-ngx{animation:spUp .8s cubic-bezier(.2,.7,.3,1) both;}
.sp-intro.in .sp-mf{animation:spDown .8s cubic-bezier(.2,.7,.3,1) .12s both;}
.sp-amp{color:#6b76a8; font-weight:800; font-size:30px; opacity:.7;}
.sp-main{gap:24px;}
.sp-main.in{opacity:1; animation:spIn .6s ease;}
.sp-app{width:min(200px,52vw); border-radius:30px; object-fit:contain; box-shadow:0 18px 60px rgba(63,125,255,.5),0 0 0 1px rgba(255,255,255,.08);}
.sp-name{font-weight:900; font-size:30px; letter-spacing:.08em; text-align:center;}
.sp-name span{background:linear-gradient(90deg,var(--cyan),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sp-name small{display:block; font-size:12px; font-weight:600; letter-spacing:.26em; color:#8e9ac0; margin-top:8px;}
.sp-bar{width:min(320px,72vw); height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden;}
.sp-fill{height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--blue),var(--gold));}
.sp-cap{color:#8e9ac0; font-size:12px; letter-spacing:.22em;}
@keyframes spUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes spDown{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes spIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* header */
.appbar{position:sticky; top:0; z-index:50; background:rgba(8,12,26,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
.appbar-in{max-width:1080px; margin:0 auto; padding:11px 16px; display:flex; align-items:center; gap:12px;}
.appbar img.logo{width:40px; height:40px; border-radius:11px; object-fit:contain; background:#0a0f1f; padding:3px; box-shadow:0 6px 18px rgba(63,125,255,.4);}
.appbar h1{font-size:19px; font-weight:900; letter-spacing:.02em;}
.appbar h1 span{background:linear-gradient(90deg,var(--cyan),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.appbar .sub{font-size:10px; color:var(--tx2); letter-spacing:.18em;}
.appbar .sp-right{margin-left:auto; display:flex; gap:8px; align-items:center;}
.btn{border:none; cursor:pointer; font-family:inherit; font-weight:800; border-radius:11px; color:#fff; transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn-ghost{background:var(--surf); border:1px solid var(--line); color:var(--tx); padding:8px 12px; font-size:13px;}

.wrap{max-width:1080px; margin:0 auto; padding:16px;}

/* sport chips */
.sports{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; -webkit-overflow-scrolling:touch;}
.sports::-webkit-scrollbar{height:0;}
.schip{flex-shrink:0; background:var(--surf); border:1px solid var(--line); color:var(--tx2); border-radius:999px; padding:8px 15px; font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:.15s;}
.schip .em{font-size:15px;}
.schip.on{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(63,125,255,.35);}

/* league select */
.controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.lg-select{flex:1; min-width:200px; background:var(--surf); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:11px 12px; font-family:inherit; font-weight:700; font-size:14px;}
.refresh{background:var(--surf); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:11px 14px; font-weight:800; font-size:13px; cursor:pointer; display:flex; gap:6px; align-items:center;}
.refresh.spin svg{animation:rot 1s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}

/* tabs */
.tabs{display:flex; gap:6px; background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:5px; margin-bottom:16px;}
.tab{flex:1; text-align:center; padding:10px 6px; border-radius:10px; font-weight:800; font-size:13px; color:var(--tx2); cursor:pointer; transition:.15s;}
.tab.on{background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#fff;}

/* status */
.status{text-align:center; padding:40px 20px; color:var(--tx2);}
.status .orb{width:64px; height:64px; margin:0 auto 16px; border-radius:50%; background:conic-gradient(from 0deg,var(--cyan),var(--blue),var(--violet),var(--cyan)); animation:rot 2.4s linear infinite; opacity:.85; -webkit-mask:radial-gradient(circle 22px at center,transparent 96%,#000 0); mask:radial-gradient(circle 22px at center,transparent 96%,#000 0);}
.status .msg{font-size:14px; margin-top:4px;}
.status .retry{margin-top:14px; background:linear-gradient(135deg,var(--blue),var(--violet)); padding:10px 20px; font-size:14px;}

/* date group */
.daygroup{font-size:12px; font-weight:800; color:var(--tx2); margin:14px 4px 8px; letter-spacing:.04em;}
.daygroup:first-child{margin-top:2px;}

/* event list */
.match{background:linear-gradient(180deg,var(--surf2),var(--surf)); border:1px solid var(--line); border-radius:16px; padding:13px 15px; margin-bottom:11px; cursor:pointer; transition:.15s; display:block;}
.match:hover{border-color:rgba(63,125,255,.45); transform:translateY(-1px);}
.match .mtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;}
.match .lg{font-size:11px; color:var(--tx2); font-weight:700; letter-spacing:.04em; display:flex; align-items:center; gap:6px;}
.match .dt{font-size:11px; color:var(--tx3); font-weight:700;}
.teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;}
.team{display:flex; align-items:center; gap:9px; min-width:0;}
.team.away{flex-direction:row-reverse; text-align:right;}
.team .badge{width:34px; height:34px; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.team .tn{font-weight:800; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.team.win .tn{color:#fff;} .team.lose .tn{color:var(--tx2);}
.score{font-weight:900; font-size:22px; letter-spacing:.04em; min-width:70px; text-align:center; font-variant-numeric:tabular-nums;}
.score .vs{color:var(--tx3); font-size:13px; font-weight:800;}
.score .live{display:block; font-size:9px; color:var(--red); font-weight:800; letter-spacing:.1em;}
.score .tm{display:block; font-size:10px; color:var(--tx3); font-weight:700;}
.score .st{display:block; font-size:9px; color:var(--tx3); font-weight:700; letter-spacing:.06em; margin-top:1px;}
.badge-fallback{width:34px; height:34px; border-radius:8px; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; color:var(--tx2); flex-shrink:0;}

/* standings table */
.grp-title{font-size:13px; font-weight:800; color:var(--cyan); margin:18px 4px 8px;}
.grp-title:first-child{margin-top:0;}
.tablewrap{background:var(--surf); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:6px;}
table.stand{width:100%; border-collapse:collapse; font-size:13px;}
.stand th{background:var(--surf2); color:var(--tx2); font-weight:800; padding:10px 6px; text-align:center; font-size:11px; letter-spacing:.03em;}
.stand th.tl,.stand td.tl{text-align:left;}
.stand td{padding:10px 6px; text-align:center; border-top:1px solid var(--line); font-variant-numeric:tabular-nums;}
.stand td.rank{font-weight:900; color:var(--tx2); width:30px;}
.stand tr td.rank .pos{display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; border-radius:6px; background:var(--bg2);}
.stand .teamcell{display:flex; align-items:center; gap:8px;}
.stand .teamcell img{width:22px; height:22px; object-fit:contain;}
.stand .teamcell b{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.stand td.pts{font-weight:900; color:var(--gold);}
.stand tr.hl-g td.rank .pos{background:rgba(63,224,138,.2); color:var(--green);}
.stand tr.hl-r td.rank .pos{background:rgba(255,91,107,.2); color:var(--red);}

/* detail */
.detail-hero{background:linear-gradient(180deg,var(--surf2),var(--surf)); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px;}
.dh-lg{text-align:center; font-size:12px; color:var(--tx2); font-weight:700; margin-bottom:4px;}
.dh-dt{text-align:center; font-size:12px; color:var(--tx3); margin-bottom:14px;}
.dh-teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;}
.dh-team{display:flex; flex-direction:column; align-items:center; gap:8px;}
.dh-team img{width:62px; height:62px; object-fit:contain;}
.dh-team .nm{font-weight:800; font-size:14px; text-align:center;}
.dh-score{font-weight:900; font-size:34px; font-variant-numeric:tabular-nums; text-align:center;}
.dh-score small{display:block; font-size:11px; color:var(--tx3); font-weight:800; letter-spacing:.1em; margin-top:2px;}
.dh-score .lv{color:var(--red);}
.dh-meta{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px;}
.dh-meta span{background:var(--bg2); border-radius:8px; padding:5px 11px; font-size:11px; color:var(--tx2); font-weight:700;}

.sec{background:linear-gradient(180deg,var(--surf2),var(--surf)); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
.sec h3{font-size:13px; letter-spacing:.06em; color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.sec h3::before{content:""; width:5px; height:15px; border-radius:3px; background:linear-gradient(var(--gold),var(--gold2));}
.sec p.desc{color:var(--tx2); font-size:13px; line-height:1.85;}

/* events (goals/cards) */
.kev{display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
.kev:last-child{border-bottom:none;}
.kev .clock{color:var(--tx3); font-weight:800; min-width:34px;}
.kev .ic{font-size:14px;}
.kev .who{font-weight:700;}
.kev .tm{color:var(--tx3); font-size:11px; margin-left:auto;}

/* pitch / formation */
.pitch{position:relative; width:100%; aspect-ratio:68/96; max-width:440px; margin:0 auto; background:linear-gradient(180deg,#0f2a18,#13361f 50%,#0f2a18); border-radius:14px; border:1px solid rgba(255,255,255,.12); overflow:hidden;}
.pitch .ln{position:absolute; background:rgba(255,255,255,.16);}
.pitch .midline{left:0; right:0; top:50%; height:2px;}
.pitch .circle{position:absolute; left:50%; top:50%; width:88px; height:88px; transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.16); border-radius:50%;}
.pitch .box{position:absolute; left:50%; transform:translateX(-50%); width:55%; height:12%; border:2px solid rgba(255,255,255,.14);}
.pitch .box.top{top:0; border-top:none;} .pitch .box.bot{bottom:0; border-bottom:none;}
.dot-p{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; width:58px;}
.dot-p .pp{width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.5); border:1.5px solid rgba(255,255,255,.55);}
.dot-p .pn{font-size:9px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000,0 0 4px #000; max-width:62px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.1;}
.home-c{background:var(--cyan); color:#06222c;} .away-c{background:var(--red);}
.form-tags{display:flex; gap:14px; justify-content:space-between; margin-top:10px; font-size:12px; font-weight:800;}
.form-tags .ft-a{color:var(--red);} .form-tags .ft-h{color:var(--cyan);}

.lineup-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.lineup-cols h4{font-size:12px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.lineup-cols .cdot{width:10px; height:10px; border-radius:50%;}
.lineup-cols ul{list-style:none;}
.lineup-cols li{font-size:12px; padding:5px 0; border-bottom:1px solid var(--line); color:var(--tx2); display:flex; gap:7px; align-items:center;}
.lineup-cols li .num{color:var(--tx3); font-weight:800; min-width:20px; text-align:right;}
.lineup-cols li b{color:var(--tx); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lineup-cols li .pos{color:var(--tx3); margin-left:auto; font-size:10px; flex-shrink:0;}
.subs-h{font-size:11px; color:var(--tx3); margin:8px 0 2px; font-weight:800;}

/* leaders / boxscore */
.lead-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
.lead-row:last-child{border-bottom:none;}
.lead-row .lname{font-weight:800;} .lead-row .lteam{color:var(--tx3); font-size:11px;}
.lead-row .lval{margin-left:auto; font-weight:900; color:var(--cyan);}
.lead-cat{font-size:11px; color:var(--tx2); font-weight:800; margin:6px 0 2px;}

.backbtn{background:var(--surf); border:1px solid var(--line); color:var(--tx); border-radius:11px; padding:9px 14px; font-weight:800; font-size:13px; cursor:pointer; margin-bottom:14px; display:inline-flex; gap:6px; align-items:center;}
.muted{color:var(--tx3); font-size:12px; text-align:center; padding:16px;}
.foot{text-align:center; color:var(--tx3); font-size:11px; margin:26px 0 10px;}
.foot a{color:var(--cyan); text-decoration:none;}
.src{text-align:center; color:var(--tx3); font-size:10px; margin-top:4px;}

@media(max-width:560px){
  .dh-team img{width:48px;height:48px;}
  .dh-score{font-size:28px;}
  .lineup-cols{grid-template-columns:1fr;}
  .team .tn{font-size:13px;}
  .stand th,.stand td{padding:9px 4px; font-size:12px;}
}
</style>
</head>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-phase sp-intro" id="spIntro">
    <div class="sp-logo sp-ngx"><img src="../brand/NGX.png" alt="NGX" onerror="this.outerHTML='<span style=&quot;color:#e9b13c;font-weight:900;font-size:44px&quot;>NGX</span>'"></div>

      <h1>Magi<span>Sports</span></h1>

    </div>
    <div class="sp-right">
      <button class="btn btn-ghost" onclick="location.href='../index.html'">← ポータル</button>

</div>

<div class="wrap">

  <div class="controls">
    <select class="lg-select" id="leagueSel"></select>
    <button class="refresh" id="refreshBtn" onclick="reload(true)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    </button>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ---------- catalog ---------- */
const SPORT_PATH={soccer:"soccer",baseball:"baseball",basketball:"basketball",americanfootball:"football",icehockey:"hockey"};
const SPORTS=[
  {id:"soccer", label:"サッカー", em:"⚽"},
  {id:"baseball", label:"野球", em:"⚾"},
  {id:"basketball", label:"バスケ", em:"🏀"},
  {id:"americanfootball", label:"アメフト", em:"🏈"},
  {id:"icehockey", label:"アイスホッケー", em:"🏒"},
];
const LEAGUES=[
  {sport:"soccer", slug:"eng.1", name:"プレミアリーグ (イングランド)", soccer:true, weekly:true},
  {sport:"soccer", slug:"esp.1", name:"ラ・リーガ (スペイン)", soccer:true, weekly:true},
  {sport:"soccer", slug:"ita.1", name:"セリエA (イタリア)", soccer:true, weekly:true},
  {sport:"soccer", slug:"ger.1", name:"ブンデスリーガ (ドイツ)", soccer:true, weekly:true},
  {sport:"soccer", slug:"fra.1", name:"リーグ・アン (フランス)", soccer:true, weekly:true},
  {sport:"soccer", slug:"uefa.champions", name:"UEFA チャンピオンズリーグ", soccer:true, weekly:true},
  {sport:"soccer", slug:"usa.1", name:"MLS (アメリカ)", soccer:true, weekly:true},
  {sport:"soccer", slug:"jpn.1", name:"J1リーグ (日本)", soccer:true, weekly:true},
  {sport:"soccer", slug:"fifa.world", name:"FIFA ワールドカップ", soccer:true, weekly:true},
  {sport:"baseball", slug:"mlb", name:"MLB (メジャーリーグ)"},
  {sport:"baseball", slug:"college-baseball", name:"NCAA 大学野球 (アメリカ)"},
  {sport:"baseball", slug:"llb", name:"リトルリーグ・ワールドシリーズ", weekly:true, noStand:true},
  {sport:"baseball", slug:"world-baseball-classic", name:"WBC ワールド・ベースボール・クラシック", weekly:true},
  {sport:"basketball", slug:"nba", name:"NBA"},
  {sport:"basketball", slug:"wnba", name:"WNBA"},
  {sport:"americanfootball", slug:"nfl", name:"NFL", weekly:true},
  {sport:"americanfootball", slug:"college-football", name:"カレッジフットボール (NCAA)", weekly:true},
  {sport:"icehockey", slug:"nhl", name:"NHL"},
];
function pathOf(l){ return SPORT_PATH[l.sport]+"/"+l.slug; }
function curLeague(){ return LEAGUES.find(l=>l.slug===State.leagueId&&l.sport===State.sport)||LEAGUES.find(l=>l.sport===State.sport)||LEAGUES[0]; }

/* ---------- state ---------- */
const State={ sport:"soccer", leagueId:"eng.1", tab:"results" };
const Cache={};

/* ---------- fetch ---------- */
const PROXIES=[ u=>u, u=>"https://corsproxy.io/?url="+encodeURIComponent(u), u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u) ];
function withTimeout(ms){ const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal; }
async function espnGet(url){
  let lastErr;
  for(const wrap of PROXIES){
    try{
      const r=await fetch(wrap(url),{signal:withTimeout(11000)});
      if(!r.ok){ lastErr=new Error("HTTP "+r.status); continue; }
      const j=await r.json();
      return j;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("fetch failed");
}
const BASE="https://site.api.espn.com/apis/site/v2/sports/";
const BASE2="https://site.api.espn.com/apis/v2/sports/";

/* ---------- date helpers ---------- */
function ymd(d){ return ""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function rangeFor(l, future){
  const now=new Date(); const a=new Date(now), b=new Date(now);
  const wk=!!l.weekly;
  if(future){ a.setDate(a.getDate()-1); b.setDate(b.getDate()+(wk?28:5)); }
  else { a.setDate(a.getDate()-(wk?16:4)); b.setDate(b.getDate()+1); }
  return ymd(a)+"-"+ymd(b);
}

/* ---------- render: sports + leagues ---------- */
function renderSports(){
  const row=$("#sportRow"); row.innerHTML="";
  SPORTS.forEach(s=>{
    const d=document.createElement("div"); d.className="schip"+(s.id===State.sport?" on":"");
    d.innerHTML=`<span class="em">${s.em}</span>${s.label}`;
    d.onclick=()=>{ State.sport=s.id; const first=LEAGUES.find(l=>l.sport===s.id); if(first) State.leagueId=first.slug; renderSports(); renderLeagues(); reload(); };
    row.appendChild(d);
  });
}
function renderLeagues(){
  const sel=$("#leagueSel"); sel.innerHTML="";
  LEAGUES.filter(l=>l.sport===State.sport).forEach(l=>{
    const o=document.createElement("option"); o.value=l.slug; o.textContent=l.name; if(l.slug===State.leagueId) o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange=()=>{ State.leagueId=sel.value; reload(); };
}

/* ---------- tabs ---------- */
$$("#tabs .tab").forEach(t=>t.onclick=()=>{ State.tab=t.dataset.tab; $$("#tabs .tab").forEach(x=>x.classList.toggle("on",x===t)); render(); });

/* ---------- status ---------- */
function statusHTML(kind,msg){
  if(kind==="loading") return `<div class="status"><div class="orb"></div><div class="msg">${msg||"読み込み中..."}</div></div>`;
  if(kind==="error") return `<div class="status"><div style="font-size:40px">📡</div><div class="msg">${msg||"データを取得できませんでした"}</div><button class="btn retry" onclick="reload(true)">再取得</button></div>`;
  if(kind==="empty") return `<div class="status"><div style="font-size:40px">🗓️</div><div class="msg">${msg||"データがありません"}</div></div>`;
  return "";
}

/* ---------- main flow ---------- */
function showList(){ $("#detailView").style.display="none"; $("#listView").style.display="block"; }
function reload(force){
  if(force){ for(const k of Object.keys(Cache)) delete Cache[k]; const b=$("#refreshBtn"); b.classList.add("spin"); setTimeout(()=>b.classList.remove("spin"),900); }
  showList(); render();
}
async function render(){
  const c=$("#content"); const l=curLeague();
  if(State.tab==="standings") return renderStandings(c,l);
  const future=State.tab==="upcoming";
  c.innerHTML=statusHTML("loading",(future?"今後の予定":"最近の試合結果")+"を取得中...");
  const range=rangeFor(l,future);
  const url=BASE+pathOf(l)+"/scoreboard?dates="+range;
  const ck="sb:"+url;
  try{
    let events=Cache[ck];
    if(!events){ const j=await espnGet(url); events=j.events||[]; Cache[ck]=events; }
    let list=events.map(toEvent).filter(Boolean);
    if(future) list=list.filter(e=>e.state==="pre").sort((a,b)=>a.ts-b.ts);
    else list=list.filter(e=>e.state==="post"||e.state==="in").sort((a,b)=>b.ts-a.ts);
    list=list.slice(0,60);
    if(!list.length){ c.innerHTML=statusHTML("empty", future?"この期間に予定されている試合はありません":"この期間に終了した試合が見つかりませんでした"); return; }
    c.innerHTML=renderEventGroups(list,l,future);
    $$("#content .match").forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  }catch(e){ c.innerHTML=statusHTML("error","ネットワークまたは提供元の都合でデータを取得できませんでした。時間をおいて再取得してください。"); }
}

/* ---------- event model ---------- */
function toEvent(e){
  try{
    const comp=e.competitions[0];
    const cs=comp.competitors;
    const home=cs.find(x=>x.homeAway==="home")||cs[0];
    const away=cs.find(x=>x.homeAway==="away")||cs[1];
    const st=e.status||comp.status||{};
    const t=st.type||{};
    return {
      id:e.id, ts:new Date(e.date).getTime(), date:new Date(e.date),
      state:t.state||"pre", completed:!!t.completed, detail:t.shortDetail||t.detail||"",
      venue:comp.venue&&comp.venue.fullName,
      home:teamOf(home), away:teamOf(away),
      hs:scoreNum(home&&home.score), as:scoreNum(away&&away.score),
      hWin:home&&home.winner, aWin:away&&away.winner,
      note:(comp.notes&&comp.notes[0]&&comp.notes[0].headline)||""
    };
  }catch(err){ return null; }
}
function teamOf(c){ if(!c||!c.team) return {name:"?",abbr:"?",logo:null}; const t=c.team; return {name:t.displayName||t.name, short:t.shortDisplayName||t.displayName, abbr:t.abbreviation||"", logo:t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||null}; }
function scoreNum(s){ if(s==null||s==="") return null; const n=parseInt(s,10); return isNaN(n)?s:n; }

/* ---------- list render ---------- */
function renderEventGroups(list,l,future){
  let html=""; let lastDay=null;
  for(const e of list){
    const day=dayLabel(e.date);
    if(day!==lastDay){ html+=`<div class="daygroup">${day}</div>`; lastDay=day; }
    html+=matchCard(e,l,future);
  }
  return html;
}
function dayLabel(d){
  const days=["日","月","火","水","木","金","土"];
  const t=new Date(); const y=new Date(); y.setDate(y.getDate()-1); const tm=new Date(); tm.setDate(tm.getDate()+1);
  const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  let pre=""; if(sameDay(d,t))pre="今日 · "; else if(sameDay(d,y))pre="昨日 · "; else if(sameDay(d,tm))pre="明日 · ";
  return `${pre}${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}
function badge(t){ if(t.logo) return `<img class="badge" src="${t.logo}" alt="" onerror="this.outerHTML='<div class=&quot;badge-fallback&quot;>${initials(t)}</div>'">`; return `<div class="badge-fallback">${initials(t)}</div>`; }
function initials(t){ return esc((t.abbr||t.name||"?").slice(0,3).toUpperCase()); }
function matchCard(e,l,future){
  let mid;
  if(e.state==="post"){
    mid=`<div class="score">${e.hs}<span class="vs"> - </span>${e.as}<span class="st">${esc(e.detail||"終了")}</span></div>`;
  } else if(e.state==="in"){
    mid=`<div class="score"><span class="live">● LIVE</span>${e.hs??0}<span class="vs"> - </span>${e.as??0}<span class="st">${esc(e.detail||"")}</span></div>`;
  } else {
    mid=`<div class="score"><span class="vs">VS</span><span class="tm">${fmtTime(e.date)}</span></div>`;
  }
  const hc=e.state==="post"?(e.hWin?"win":(e.aWin?"lose":"")):"";
  const ac=e.state==="post"?(e.aWin?"win":(e.hWin?"lose":"")):"";
  return `<div class="match" data-id="${e.id}">
    <div class="mtop"><div class="lg">${esc(l.name.split(" (")[0])}${e.note?` · ${esc(e.note)}`:""}</div><div class="dt">${fmtTime(e.date)}</div></div>
    <div class="teams">
      <div class="team home ${hc}">${badge(e.home)}<span class="tn">${esc(e.home.name)}</span></div>
      ${mid}
      <div class="team away ${ac}">${badge(e.away)}<span class="tn">${esc(e.away.name)}</span></div>
    </div>
  </div>`;
}
function fmtTime(d){ return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

/* ---------- standings ---------- */
async function renderStandings(c,l){
  if(l.noStand){ c.innerHTML=statusHTML("empty","このカテゴリは順位表がありません（トーナメント形式）"); return; }
  c.innerHTML=statusHTML("loading","順位表を取得中...");
  const now=new Date(); const yr=now.getFullYear();
  const baseY = now.getMonth()+1>=7?yr:yr-1;
  // 欧州リーグはシーズン基準年(baseY)を優先、W杯等の単年トーナメントはカレンダー年(yr)で取得
  const seasons = l.soccer ? [...new Set([baseY, baseY-1, yr, yr+1])] : [yr, yr-1];
  // soccer: groups come naturally (FIFA=Group A〜L, domestic=single). others: level=3 で地区/カンファレンス別を取得
  const lvlParams = l.soccer ? [""] : ["&level=3",""];
  try{
    let data=null, used=null;
    outer:
    for(const s of seasons){
      for(const lvl of lvlParams){
        const url=BASE2+pathOf(l)+"/standings?season="+s+lvl;
        const ck="st:"+url;
        let j=Cache[ck];
        if(j===undefined){ try{ j=await espnGet(url); }catch(e){ j=null; } Cache[ck]=j; }
        const groups=extractGroups(j);
        if(groups && groups.some(g=>g.entries.length)){ data=groups; used=s; break outer; }
      }
    }
    if(!data){ c.innerHTML=statusHTML("empty","順位表が取得できませんでした（シーズン開幕前の可能性があります）"); return; }
    let html="";
    const multi=data.length>1;
    for(const g of data){
      if(!g.entries.length) continue;
      if(multi) html+=`<div class="grp-title">${esc(groupLabel(g.name))}</div>`;
      html+=standTable(g.entries,l);
    }
    const seasonLabel = l.soccer ? (data.length>1 ? `${used}` : `${used}-${used+1}`) : `${used}`;
    html+=`<div class="muted">${seasonLabel} シーズン${multi?" · グループ/地区別":""}</div>`;
    c.innerHTML=html;
  }catch(e){ c.innerHTML=statusHTML("error","順位表を取得できませんでした。再取得してください。"); }
}
function collectLeaves(node,acc){
  if(!node) return;
  if(node.standings&&node.standings.entries&&node.standings.entries.length) acc.push({name:node.name||node.abbreviation||"",entries:node.standings.entries});
  if(node.children&&node.children.length) node.children.forEach(ch=>collectLeaves(ch,acc));
}
function extractGroups(j){
  if(!j) return null;
  const acc=[];
  if(j.children&&j.children.length) j.children.forEach(ch=>collectLeaves(ch,acc));
  else if(j.standings&&j.standings.entries) acc.push({name:j.name||"",entries:j.standings.entries});
  return acc.length?acc:null;
}
function groupLabel(name){
  if(!name) return "";
  let s=String(name);
  s=s.replace(/^Group /,"グループ");
  s=s.replace("American League","アメリカンリーグ").replace("National League","ナショナルリーグ");
  s=s.replace("Eastern Conference","東カンファレンス").replace("Western Conference","西カンファレンス");
  s=s.replace("American Football Conference","AFC").replace("National Football Conference","NFC");
  s=s.replace(/ East$/,"・東地区").replace(/ Central$/,"・中地区").replace(/ West$/,"・西地区").replace(/ North$/,"・北地区").replace(/ South$/,"・南地区");
  return s;
}
function statVal(entry,type){ const s=(entry.stats||[]).find(x=>x.type===type||x.name===type); return s?(s.displayValue!=null?s.displayValue:s.value):null; }
function standTable(entries,l){
  entries=entries.slice().sort((a,b)=>{
    const ra=+statVal(a,"rank")||999, rb=+statVal(b,"rank")||999; return ra-rb;
  });
  const n=entries.length;
  const soccer=l.soccer;
  const head = soccer
    ? `<th>#</th><th class="tl">チーム</th><th>試</th><th>勝</th><th>分</th><th>負</th><th>得失</th><th>点</th>`
    : `<th>#</th><th class="tl">チーム</th><th>勝</th><th>負</th><th>勝率</th><th>差</th>`;
  const rows=entries.map((en,i)=>{
    const team=en.team||{};
    const logo=team.logos&&team.logos[0]&&team.logos[0].href;
    const rank=+statVal(en,"rank")||i+1;
    let cls=""; if(soccer){ if(rank<=4)cls="hl-g"; else if(rank>n-3)cls="hl-r"; }
    const tcell=`<div class="teamcell">${logo?`<img src="${logo}" onerror="this.style.display='none'">`:""}<b>${esc(team.displayName||team.name||statVal(en,"team")||"?")}</b></div>`;
    if(soccer){
      return `<tr class="${cls}"><td class="rank"><span class="pos">${rank}</span></td><td class="tl">${tcell}</td>
        <td>${statVal(en,"gamesplayed")??"-"}</td><td>${statVal(en,"wins")??"-"}</td><td>${statVal(en,"ties")??"-"}</td><td>${statVal(en,"losses")??"-"}</td>
        <td>${statVal(en,"pointdifferential")??"-"}</td><td class="pts">${statVal(en,"points")??"-"}</td></tr>`;
    } else {
      const wp=statVal(en,"winpercent"); const wps= wp!=null? (typeof wp==="string"?wp:(+wp).toFixed(3).replace(/^0/,"")) : "-";
      return `<tr><td class="rank"><span class="pos">${rank}</span></td><td class="tl">${tcell}</td>
        <td>${statVal(en,"wins")??"-"}</td><td>${statVal(en,"losses")??"-"}</td><td>${wps}</td><td>${statVal(en,"gamesbehind")??statVal(en,"playoffseed")??"-"}</td></tr>`;
    }
  }).join("");
  return `<div class="tablewrap"><table class="stand"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- detail ---------- */
async function openDetail(id){
  const l=curLeague();
  const dv=$("#detailView"); $("#listView").style.display="none"; dv.style.display="block"; window.scrollTo(0,0);
  dv.innerHTML=`<button class="backbtn" onclick="showList()">← 一覧へ戻る</button>`+statusHTML("loading","試合の詳細を取得中...");
  const url=BASE+pathOf(l)+"/summary?event="+id;
  try{
    const j=await espnGet(url);
    renderDetail(dv,j,l,id);
  }catch(e){ dv.innerHTML=`<button class="backbtn" onclick="showList()">← 一覧へ戻る</button>`+statusHTML("error","試合の詳細を取得できませんでした"); }
}
function renderDetail(dv,j,l,id){
  const hdr=j.header||{}; const comp=(hdr.competitions&&hdr.competitions[0])||{};
  const cs=comp.competitors||[];
  const home=cs.find(x=>x.homeAway==="home")||cs[0]||{};
  const away=cs.find(x=>x.homeAway==="away")||cs[1]||{};
  const ht=teamFromHeader(home), at=teamFromHeader(away);
  const st=(comp.status&&comp.status.type)||{};
  const state=st.state||"post";
  const hs=scoreNum(home.score), as=scoreNum(away.score);
  const dt=comp.date?new Date(comp.date):null;
  const gi=j.gameInfo||{};
  let html=`<button class="backbtn" onclick="showList()">← 一覧へ戻る</button>`;
  html+=`<div class="detail-hero">
    <div class="dh-lg">${esc((hdr.league&&hdr.league.name)||l.name)}</div>
    <div class="dh-dt">${dt?fmtFullDate(dt):""}</div>
    <div class="dh-teams">
      <div class="dh-team">${imgBig(ht)}<div class="nm">${esc(ht.name)}</div></div>
      <div class="dh-score">${state!=="pre"?`${hs??0} - ${as??0}`:`<span style="color:var(--tx3)">VS</span>`}<small class="${state==='in'?'lv':''}">${esc(state==="pre"?(dt?fmtTime(dt):""):(st.shortDetail||st.detail||"終了"))}</small></div>
      <div class="dh-team">${imgBig(at)}<div class="nm">${esc(at.name)}</div></div>
    </div>
    <div class="dh-meta">
      ${(gi.venue&&gi.venue.fullName)?`<span>🏟 ${esc(gi.venue.fullName)}</span>`:""}
      ${(gi.venue&&gi.venue.address&&gi.venue.address.city)?`<span>📍 ${esc(gi.venue.address.city)}</span>`:""}
      ${gi.attendance?`<span>👥 ${Number(gi.attendance).toLocaleString()}</span>`:""}
    </div>
  </div>`;

  // formation (soccer)
  const rosters=j.rosters||[];
  const hr=rosters.find(r=>r.homeAway==="home"), ar=rosters.find(r=>r.homeAway==="away");
  if(l.soccer && rosters.length && (hasStarters(hr)||hasStarters(ar))){
    html+=`<div class="sec"><h3>フォーメーション</h3>${pitchHTML(hr,ar)}
      <div class="form-tags"><div class="ft-h">▲ ${esc(ht.name)}　${(hr&&hr.formation)||"—"}</div><div class="ft-a">▼ ${esc(at.name)}　${(ar&&ar.formation)||"—"}</div></div></div>`;
  }

  // key events (goals / cards) for soccer
  const kev=(j.keyEvents||[]).filter(k=>k.type&&/goal|penalty|card|own/i.test((k.type.id?k.type.text:k.type.text)||k.type.text||""));
  if(l.soccer && j.keyEvents && j.keyEvents.length){
    const items=j.keyEvents.filter(k=>k.clock).slice(0,40).map(kevHTML).join("");
    if(items) html+=`<div class="sec"><h3>試合の流れ</h3>${items}</div>`;
  }

  // lineups list
  if(rosters.length && (hasStarters(hr)||hasStarters(ar))){
    html+=`<div class="sec"><h3>メンバー</h3><div class="lineup-cols">
      <div><h4><span class="cdot" style="background:var(--cyan)"></span>${esc(ht.name)}</h4>${luBlock(hr)}</div>
      <div><h4><span class="cdot" style="background:var(--red)"></span>${esc(at.name)}</h4>${luBlock(ar)}</div>
    </div></div>`;
  }

  // leaders (non-soccer or general)
  const leaders=j.leaders||[];
  if(leaders.length){
    html+=`<div class="sec"><h3>注目の選手</h3>${leadersHTML(leaders)}</div>`;
  }

  // article / report
  const story=(j.article&&(j.article.story||j.article.description))||(j.news&&j.news.articles&&j.news.articles[0]&&j.news.articles[0].description);
  if(story){
    const txt=String(story).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    if(txt) html+=`<div class="sec"><h3>試合内容・レポート</h3><p class="desc">${esc(txt).slice(0,1600)}</p></div>`;
  }

  if(rosters.length===0 && !leaders.length && !story && !(j.keyEvents&&j.keyEvents.length)){
    html+=`<div class="muted">この試合の詳細な内容・メンバー・フォーメーションは提供元に登録がありませんでした。${state==="pre"?"試合開始が近づくと情報が追加されます。":""}</div>`;
  }
  dv.innerHTML=html;
}
function teamFromHeader(c){ const t=(c&&c.team)||{}; return {name:t.displayName||t.name||"?", abbr:t.abbreviation||"", logo:t.logos&&t.logos[0]&&t.logos[0].href}; }
function imgBig(t){ if(t.logo) return `<img src="${t.logo}" alt="" onerror="this.outerHTML='<div class=&quot;badge-fallback&quot; style=&quot;width:62px;height:62px;font-size:20px&quot;>${initials(t)}</div>'">`; return `<div class="badge-fallback" style="width:62px;height:62px;font-size:20px">${initials(t)}</div>`; }
function hasStarters(r){ return r&&r.roster&&r.roster.some(p=>p.starter); }
function kevHTML(k){
  const txt=(k.type&&k.type.text)||"";
  let ic="•"; if(/goal/i.test(txt)&&!/own/i.test(txt))ic="⚽"; else if(/own/i.test(txt))ic="🥅"; else if(/yellow/i.test(txt))ic="🟨"; else if(/red/i.test(txt))ic="🟥"; else if(/penalty/i.test(txt))ic="🎯"; else if(/substitut/i.test(txt))ic="🔁";
  const who=(k.athletesInvolved&&k.athletesInvolved[0]&&k.athletesInvolved[0].displayName)||k.text||txt;
  const tm=(k.team&&(k.team.abbreviation||k.team.displayName))||"";
  return `<div class="kev"><span class="clock">${esc(k.clock&&k.clock.displayValue||"")}</span><span class="ic">${ic}</span><span class="who">${esc(who)}</span><span class="tm">${esc(tm)}</span></div>`;
}
function luBlock(r){
  if(!r||!r.roster) return `<ul><li style="color:var(--tx3)">登録なし</li></ul>`;
  const starters=r.roster.filter(p=>p.starter);
  const subs=r.roster.filter(p=>!p.starter);
  let h=`<ul>${starters.map(liPlayer).join("")||'<li style="color:var(--tx3)">登録なし</li>'}</ul>`;
  if(subs.length) h+=`<div class="subs-h">控え</div><ul>${subs.slice(0,12).map(liPlayer).join("")}</ul>`;
  return h;
}
function liPlayer(p){
  const a=p.athlete||{};
  return `<li><span class="num">${esc(p.jersey||"")}</span><b>${esc(a.displayName||a.shortName||"")}</b><span class="pos">${esc((p.position&&p.position.abbreviation)||"")}</span></li>`;
}
function leadersHTML(leaders){
  let h="";
  leaders.slice(0,4).forEach(cat=>{
    const ld=cat.leaders&&cat.leaders[0]; if(!ld) return;
    const a=ld.athlete||{};
    h+=`<div class="lead-cat">${esc(cat.displayName||cat.name||"")}</div>
      <div class="lead-row"><div><span class="lname">${esc(a.displayName||"")}</span> <span class="lteam">${esc((ld.team&&ld.team.abbreviation)||"")}</span></div><span class="lval">${esc(ld.displayValue||"")}</span></div>`;
  });
  return h||`<div class="muted">データなし</div>`;
}
function fmtFullDate(d){ const days=["日","月","火","水","木","金","土"]; return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]}) ${fmtTime(d)}`; }

/* ---------- formation pitch (home bottom, away top) ---------- */
function pitchHTML(hr,ar){
  let dots="";
  // home defends the bottom goal: GK at bottom (0.95), attackers toward midline (0.54)
  dots+=placeFormation(hr,"home",0.95,0.54);
  // away defends the top goal: GK at top (0.05), attackers toward midline (0.46)
  dots+=placeFormation(ar,"away",0.05,0.46);
  return `<div class="pitch"><div class="ln midline"></div><div class="circle"></div><div class="box top"></div><div class="box bot"></div>${dots}</div>`;
}
function placeFormation(r,side,yStart,yEnd){
  if(!r||!r.roster) return "";
  const starters=r.roster.filter(p=>p.starter).slice();
  if(!starters.length) return "";
  // rows from formation string; fallback split by formationPlace
  let counts=null;
  if(r.formation && /^\d+(-\d+)+$/.test(r.formation.trim())) counts=[1].concat(r.formation.trim().split("-").map(Number));
  // sort by formationPlace ascending (1 = GK)
  starters.sort((a,b)=>(+a.formationPlace||99)-(+b.formationPlace||99));
  if(!counts){ counts=[1, starters.length-1]; } // generic fallback
  const rows=[]; let idx=0;
  for(const cnt of counts){ const row=[]; for(let i=0;i<cnt&&idx<starters.length;i++){ row.push(starters[idx++]); } if(row.length) rows.push(row); }
  while(idx<starters.length){ rows[rows.length-1].push(starters[idx++]); } // overflow safety
  const lines=rows.length; let out="";
  rows.forEach((row,ri)=>{
    const t=lines>1? ri/(lines-1):0;
    const y=yStart+(yEnd-yStart)*t;
    row.forEach((p,ci)=>{
      const x=(ci+1)/(row.length+1);
      const a=p.athlete||{};
      out+=`<div class="dot-p" style="left:${x*100}%; top:${y*100}%">
        <div class="pp ${side==='home'?'home-c':'away-c'}">${esc(p.jersey||(ri===0?'GK':''))}</div>
        <div class="pn">${esc(shortName(a.displayName||a.shortName||""))}</div></div>`;
    });
  });
  return out;
}
function shortName(n){ if(!n) return ""; const parts=n.trim().split(/\s+/); return parts.length>1? parts[parts.length-1]:n; }

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- init ---------- */
renderSports(); renderLeagues(); render();

/* ---------- splash ---------- */
(function(){
  const sp=$("#splash"); if(!sp) return;
  const intro=$("#spIntro"),main=$("#spMain"),fill=$("#spFill");
  const P1_IN=120,P1_HOLD=1450,P1_OUT=540,P2_BAR=1850,P2_END=320, p2=P1_IN+P1_HOLD+P1_OUT;
  setTimeout(()=>intro.classList.add("in"),P1_IN);
  setTimeout(()=>intro.classList.add("out"),P1_IN+P1_HOLD);
  setTimeout(()=>{ main.classList.add("in"); fill.style.transition="width "+P2_BAR+"ms ease"; setTimeout(()=>fill.style.width="100%",60); },p2);
  setTimeout(()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(),600); },p2+P2_BAR+P2_END);
})();
</script>
