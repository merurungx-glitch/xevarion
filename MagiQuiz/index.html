<!-- ══════════════════════════════════════════════════════════════
     ★★ 2026-11-05 MagiQuiz 全面作り直し（ご指定「デザインから仕組みまで全てを1から構想しなおし、もはや新作レベルで」）
     ・アイコン（紫・黄・白・ブザー）を全体の軸に。答えを決めるのも次へ進むのも黄色いブザー。
     ・遊び方は3つ：見えない爆弾／クイズタワー／スコアアタック（どれも1問ごとに交互）。
     ・問題は MagiChemLex の基礎セット1〜4 の改題すべて（図・解説の図も出す）。メモ・電卓・公式つき。
     ・答えたあとは時間が止まり、解説を確認してから次へ。
     ・画面の中身はぜんぶ JS で描く：quiz-ui.js（タイトル・準備・記録）／quiz-play.js（試合）／quiz-result.js（結果）。
     ══════════════════════════════════════════════════════════════ -->
