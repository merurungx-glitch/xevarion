<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../maintenance-gate.js?v=5"></script>
<script src="../xeva-splash.js?v=3" data-app="MagiEmpire" data-logo="../thumbs/MagiEmpire.jpg"></script>
<meta charset="UTF-8">
<script>(function(){try{var a=JSON.parse(localStorage.getItem('xeva_account_v1'));if(!a||!a.setupDone)location.replace('../index.html');}catch(e){}})();</script>
<script type="module" src="../xevarion-fb.js?v=22"></script>
<script type="module" src="../xeva-cloud.js?v=16"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MagiEmpire — 国盗りゲーム</title>
<link rel="icon" href="../thumbs/MagiEmpire.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
:root{
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  --tx:#1d1c1a; --tx2:#5f5e5a; --tx3:#8a8980;
  --bg:#f4f2ec; --surf:#ffffff; --surf2:#eceae2; --line:rgba(0,0,0,.10);
  --p1:#ffd23f; --p2:#46c8ff; --p3:#ff5d8f; --p4:#7CFF9B;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --tx:#ececec; --tx2:#b4b2a9; --tx3:#8a8980; --bg:#15151a; --surf:#23232a; --surf2:#1c1c22; --line:rgba(255,255,255,.12); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ★ iPhone をホーム画面から起動すると画面のすみずみまで描画される。
   カメラ／時計の帯とホームバーに中身がかからないよう、
   各画面の padding でセーフエリアを見込む（--sat/--sab/--sal/--sar）。 */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
      --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
/* ══ 画面いっぱいの土台の高さ（--app-vh） ══
   ★ iPhone でホーム画面から「アプリとして」開くと、下に空白の帯ができて
     画面の下部が詰まって見える不具合の対策。
     height:100% / 100dvh はブラウザが決める「箱」に従うが、standalone（アプリ表示）
     ＋ viewport-fit=cover ではその箱が実際に見えている画面より短くなることがあり、
     余ったぶんが下の空白として残る。共通の ../xeva-splash.js が実測値
     （innerHeight）をここへ流し込む。JS が動く前は dvh（無ければ vh）に落ちる。 */
:root{ --app-vh:100vh }
@supports (height:100dvh){ :root{ --app-vh:100dvh } }
html,body{height:var(--app-vh);margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
/* ★ 2026-08-03: 土台は height ではなく top:0/bottom:0 で画面の上下に留める。
   こうすると --app-vh の値がどうであれ下端にぴったり付くので、
   iPhone のアプリ表示で下にできていた空白の帯が原理的に起きなくなる。 */
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;font-family:var(--font-sans);color:var(--tx)}
.screen{display:none;height:100%;width:100%;flex-direction:column;position:relative}
.screen.active{display:flex}
.iconbtn{cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--tx);width:40px;height:40px;border-radius:var(--r);font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{transform:scale(.95)}
.iconbtn[disabled]{opacity:.35}

.home{align-items:center;justify-content:center}
.home-inner{width:100%;max-width:470px;
  padding:calc(24px + var(--sat)) calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal));display:flex;flex-direction:column;gap:14px;text-align:center}
.home h1{font-size:30px;font-weight:600;margin:0 0 2px}
.home-sub{color:var(--tx2);font-size:14px;margin:0 0 8px;line-height:1.6}
.mode-card{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:18px;display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px;align-items:center;color:var(--tx)}
.mode-card:active{transform:scale(.99)}
.mode-card i{font-size:30px;grid-row:1/3;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.mode-card[data-mode=action] i{color:#c98a00;background:rgba(255,210,63,.18)}
.mode-card[data-mode=board] i{color:#1f7fb8;background:rgba(70,200,255,.16)}
.mode-name{font-size:18px;font-weight:600}
.mode-desc{font-size:13px;color:var(--tx2);line-height:1.55}
.home-foot{font-size:12px;color:var(--tx3);margin-top:6px}

.menu{position:absolute;inset:0;display:none;justify-content:center;background:rgba(8,10,22,.92);
  padding:calc(20px + var(--sat)) calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal));
  z-index:10;overflow:auto;-webkit-overflow-scrolling:touch}
.menu .card{max-width:440px;width:100%;color:#fff;text-align:center;margin:auto}
.menu h2{font-size:23px;font-weight:700;margin:0 0 8px}
.menu p{font-size:13px;color:rgba(255,255,255,.82);line-height:1.7;margin:0 0 14px}
/* 設定グループカード（1項目=1パネル） */
.setrow{display:block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:13px 14px;margin:10px 0;text-align:left}
.setrow .lab{display:flex;align-items:center;gap:7px;font-size:13px;color:rgba(255,255,255,.9);
  font-weight:800;min-width:0;text-align:left;margin-bottom:10px}
.seg{display:flex;width:100%;background:rgba(255,255,255,.08);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;color:#fff;font-family:var(--font-sans);
  font-size:14px;font-weight:700;padding:11px 4px;border-radius:10px;cursor:pointer;min-height:46px}
.seg button.on{background:#ffd23f;color:#222;box-shadow:0 4px 12px rgba(255,210,63,.3)}
.seat-toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0}
.seatt{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:12px;font-weight:800;color:rgba(255,255,255,.85);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 6px}
.seatt button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;
  border-radius:10px;padding:9px 8px;font-size:13px;font-weight:800;cursor:pointer;width:100%;min-height:40px}
.seatt button.cpu{background:rgba(70,200,255,.28);border-color:rgba(70,200,255,.5)}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.cbtns button{cursor:pointer;border:none;border-radius:var(--r);padding:15px 22px;font-weight:800;
  font-size:17px;font-family:var(--font-sans);background:#ffd23f;color:#222;flex:1;min-width:130px}
.cbtns button.ghost{background:rgba(255,255,255,.16);color:#fff;flex:none;min-width:0;padding:15px 18px;font-size:15px}
.cbtns button:active{transform:scale(.97)}
.reslist{margin:10px 0 6px}
.resrow{display:flex;align-items:center;gap:10px;justify-content:center;font-size:17px;font-weight:700;margin:7px 0}
.resrow b{margin-left:2px;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.toast-wrap{position:absolute;top:calc(60px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8}
.toast{background:rgba(0,0,0,.8);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;animation:toastIn .25s ease, toastOut .4s ease 1.15s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}

.act{padding:calc(6px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal))}
.act-hud{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.act-title{font-size:16px;font-weight:600;flex:1}
.pcl-timer{font-size:15px;color:var(--tx2);background:var(--surf2);padding:6px 12px;border-radius:var(--r);display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.pcl-timer b{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:700}
.pcl-timer.danger{background:#e24b4a;color:#fff;animation:tpulse .6s ease infinite}
.pcl-timer.danger b{color:#fff}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pcl-bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--surf2);margin-bottom:6px}
.pcl-seg{height:100%;transition:width .25s ease}
.pcl-scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.pcl-chip{background:var(--surf2);padding:4px 10px;border-radius:8px;display:flex;align-items:center;gap:6px}
.pcl-chip b{font-variant-numeric:tabular-nums;font-weight:700}
.act-arena{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:". top ." "left board right" ". bottom .";align-items:center;justify-items:center;gap:4px}
.board-cell{grid-area:board;width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.board-wrap{position:relative}
#pcl-cv{display:block;width:100%;height:100%;border-radius:var(--r);background:#0c1330}
.pad{touch-action:none;user-select:none}
.pad-top{grid-area:top;transform:rotate(180deg)}
.pad-bottom{grid-area:bottom}
.pad-left{grid-area:left;transform:rotate(90deg)}
.pad-right{grid-area:right;transform:rotate(-90deg)}
.pad[hidden]{display:none}
.pad-grid{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);grid-template-areas:". u ." "l c r" ". d .";gap:5px}
.pbtn{touch-action:none;cursor:pointer;border:1px solid var(--line);border-radius:11px;background:var(--surf2);color:var(--tx);font-size:22px;display:flex;align-items:center;justify-content:center}
.pbtn:active{transform:scale(.92)}
.pbtn[data-dir=U]{grid-area:u}.pbtn[data-dir=D]{grid-area:d}.pbtn[data-dir=L]{grid-area:l}.pbtn[data-dir=R]{grid-area:r}
.pcenter{grid-area:c;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#222;border-radius:11px}

.bd{padding:calc(8px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal))}
.bd-hud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bd-turn{flex:1;text-align:center;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.bd-turn .pulse{animation:tpulse .8s ease infinite}
.bd-scores{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;font-size:14px}
.bd-chip{background:var(--surf2);padding:5px 12px;border-radius:8px;display:flex;align-items:center;gap:7px}
.bd-chip b{font-variant-numeric:tabular-nums;font-weight:700}
.bd-chip.turn{outline:2px solid var(--tx);outline-offset:1px}
.bd-board-cell{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.bd-wrap{position:relative;touch-action:manipulation}
.bd-grid{width:100%;height:100%;display:grid;gap:3px;background:var(--surf2);padding:8px;border-radius:var(--r)}
.bd-cell{border:none;padding:0;margin:0;border-radius:7px;background:var(--surf);cursor:pointer;position:relative;transition:background .22s ease;aspect-ratio:1}
.bd-cell.owned{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bd-cell.legal::after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;border-radius:50%;background:var(--cur);transform:translate(-50%,-50%);opacity:.5}
.bd-cell.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

/* スプラッシュは ../xeva-splash.js（全アプリ共通）に統一 */

/* ===== HOME extra actions (rules / continue) ===== */
.home-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.home-actions button{cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:var(--r);padding:10px 18px;font-family:var(--font-sans);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.home-actions button:active{transform:scale(.97)}
.home-actions button.accent{background:#ffd23f;color:#222;border-color:transparent}
.home-actions button i{font-size:17px}

/* ===== Rules view inside menu ===== */
.rules{text-align:left;color:rgba(255,255,255,.9)}
.rules h3{font-size:15px;font-weight:700;margin:16px 0 6px;color:#ffd23f;display:flex;align-items:center;gap:7px}
.rules h3:first-child{margin-top:4px}
.rules p,.rules li{font-size:13px;line-height:1.75;color:rgba(255,255,255,.82)}
.rules ul{margin:4px 0 0;padding-left:20px}
.rules li{margin:3px 0}
.menu .menu-scroll{max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;width:100%;display:flex;justify-content:center}
.savedtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#7CFF9B;margin:2px 0 4px;justify-content:center}
#rules-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,22,.95);
  padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));z-index:300}
#rules-modal.open{display:flex}
#rules-modal .card{max-width:470px;width:100%;color:#fff;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
#rules-modal h2{font-size:22px;font-weight:700;margin:0 0 4px;text-align:center}
#rules-modal .rsub,#pregame-modal .rsub{text-align:center;color:rgba(255,255,255,.6);font-size:12px;margin:0 0 6px;letter-spacing:.08em}
#pregame-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,22,.95);
  padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));z-index:300}
#pregame-modal.open{display:flex}
#pregame-modal .card{max-width:420px;width:100%;color:#fff;max-height:100%;overflow:auto}
/* 対戦中は共通の「もどる」ボタンを隠す（各画面の ← と重なるため） */
body.ingame #xevaBackBtn{display:none!important}
#pregame-modal h2{font-size:22px;font-weight:700;margin:0 0 4px;text-align:center}
#pregame-modal .nf{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;margin:10px 0}
#pregame-modal .nf .dot{width:16px;height:16px;border-radius:50%;flex:none}
#pregame-modal .nf input{flex:1;border:none;background:transparent;color:#fff;font-size:16px;font-weight:700;outline:none;min-width:0;font-family:var(--font-sans)}
.pg-dice{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pg-dpl{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:70px}
.pg-nm{font-size:13px;font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-die{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff}
.pg-rank{font-size:11px;font-weight:800;color:#7CFF9B}
</style>
</head>
<body>

<div id="app">

  <div class="screen home active" id="screen-home">
    <div class="home-inner">
      <h1>MagiEmpire</h1>
      <p class="home-sub">国盗りゲーム — 1台のiPadで2〜4人。今日の気分で選んでください。</p>
      <button class="mode-card" data-mode="action">
        <i class="ti ti-device-gamepad-2" aria-hidden="true"></i>
        <span class="mode-name">アクション版 ・ 国盗りパックマン</span>
        <span class="mode-desc">スティックで動かしてマスを塗る早取り対戦。ドット食べ・パワーエサ・ボーナス・ゴーストありの本格パックマン。にぎやかに。</span>
      </button>
      <button class="mode-card" data-mode="board">
        <i class="ti ti-grid-dots" aria-hidden="true"></i>
        <span class="mode-name">じっくり版 ・ ぐんぐん国盗り</span>
        <span class="mode-desc">順番にマスを置いて領地を広げるボード対戦。挟むと相手を奪える。CPU対戦・盤の大きさ・ルールも選べます。</span>
      </button>
      <div class="home-actions">
        <button id="home-continue" style="display:none" class="accent"><i class="ti ti-player-play"></i>つづきから（保存データ）</button>
        <button id="home-rules"><i class="ti ti-book"></i>ルール説明</button>
      </div>
      <p class="home-foot">iPadを机に置いて、4辺に座って遊べます</p>
    </div>
  </div>

  <div class="screen act" id="screen-action">
    <div class="act-hud">
      <button class="iconbtn" id="act-home" aria-label="ホームへ"><i class="ti ti-arrow-left"></i></button>
      <div class="act-title">国盗りパックマン</div>
      <button class="iconbtn" id="act-mute" aria-label="音"><i class="ti ti-volume"></i></button>
      <div class="pcl-timer" id="pcl-timer"><i class="ti ti-clock" aria-hidden="true"></i><b id="pcl-time">90</b></div>
    </div>
    <div class="pcl-bar" id="pcl-bar"></div>
    <div class="pcl-scores" id="pcl-scores"></div>
    <div class="act-arena">
      <div class="pad pad-top" data-player="2" hidden></div>
      <div class="pad pad-left" data-player="3" hidden></div>
      <div class="board-cell">
        <div class="board-wrap" id="boardWrap">
          <canvas id="pcl-cv" width="462" height="462"></canvas>
        </div>
      </div>
      <div class="pad pad-right" data-player="4" hidden></div>
      <div class="pad pad-bottom" data-player="1" hidden></div>
    </div>
    <div class="toast-wrap" id="act-toast"></div>
    <div class="menu" id="act-menu"></div>
  </div>

  <div class="screen bd" id="screen-board">
    <div class="bd-hud">
      <button class="iconbtn" id="bd-home" aria-label="ホームへ"><i class="ti ti-arrow-left"></i></button>
      <div class="bd-turn" id="bd-turn"></div>
      <button class="iconbtn" id="bd-mute2" aria-label="音"><i class="ti ti-volume"></i></button>
      <button class="iconbtn" id="bd-save" aria-label="途中保存"><i class="ti ti-device-floppy"></i></button>
      <button class="iconbtn" id="bd-undo" aria-label="一手戻す"><i class="ti ti-arrow-back-up"></i></button>
    </div>
    <div class="bd-scores" id="bd-scores"></div>
    <div class="bd-board-cell">
      <div class="bd-wrap" id="bdWrap">
        <div class="bd-grid" id="bd-grid"></div>
      </div>
    </div>
    <div class="toast-wrap" id="bd-toast"></div>
    <div class="menu" id="bd-menu"></div>
  </div>

</div>

<!-- ===== RULES ===== -->
<div id="rules-modal"><div class="card" id="rules-card"></div></div>

<!-- ===== PRE-GAME SETUP (names + dice order) ===== -->
<div id="pregame-modal"><div class="card"></div></div>

<script>
var active="home";
/* ===== shared player names ===== */
var MAGI_E_NAMES=(function(){ try{var n=JSON.parse(localStorage.getItem('magiempire_names')); if(n&&n.length>=5) return n;}catch(e){} return [null,'P1','P2','P3','P4']; })();
function applyMagiNames(arr){ for(var i=1;i<=4;i++) arr[i]=MAGI_E_NAMES[i]||('P'+i); }
function saveMagiNames(){ try{localStorage.setItem('magiempire_names',JSON.stringify(MAGI_E_NAMES));}catch(e){} }
function show(name){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('active');
  document.getElementById('screen-'+name).classList.add('active');
  active=name;
  /* ★ 対戦中は「XEVARIONへもどる」の浮きボタンを隠す。
     画面左上には各画面の「←（ホームへ）」があり、そこに重なって押せなくなるため。
     ホームに戻ればまた出る。 */
  document.body.classList.toggle('ingame', name!=='home');
  if(name==='action')requestAnimationFrame(function(){Action.onShow();});
  if(name==='board')requestAnimationFrame(function(){Board.onShow();});
}
window.addEventListener('resize',function(){ if(active==='action')Action.fit(); if(active==='board')Board.fit(); });

function toast(msg,color){
  var w=document.getElementById(active==='action'?'act-toast':'bd-toast');
  if(!w)return;

  function buildMaze(){

  }
  function protectedCell(r,c,mid){

  function decide(ent,isP){

  function nearest(g){var t=null,bd=1e9;for(var i=0;i<players.length;i++){var p=players[i];var dd=Math.abs(p.tr-g.tr)+Math.abs(p.tc-g.tc);if(dd<bd){bd=dd;t=p;}}return t;}
  function ghostDecide(g){

  function placeFruit(){

  function rr(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();}

/* =================== BOARD GAME =================== */
var Board=(function(){

  var gridEl=$('bd-grid');

  function dirs(){return cap==='orth'?D4:D8;}
  function corner(id){return [[0,0],[N-1,N-1],[0,N-1],[N-1,0]][id-1];}
  function inb(r,c){return r>=0&&r<N&&c>=0&&c<N;}

  function buildDom(){
    gridEl.innerHTML='';cellEls=[];builtN=N;

    for(var r=0;r<N;r++){cellEls[r]=[];for(var c=0;c<N;c++){var b=document.createElement('button');b.className='bd-cell';b.dataset.r=r;b.dataset.c=c;gridEl.appendChild(b);cellEls[r][c]=b;}}

  function legalList(p){
    var res=[],ds=dirs();
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      if(cells[r][c]!==0)continue;var ok=false;
      for(var i=0;i<ds.length;i++){var nr=r+ds[i][0],nc=c+ds[i][1];if(inb(nr,nc)&&cells[nr][nc]===p){ok=true;break;}}
      if(ok)res.push([r,c]);

    return res;

  function flipsFor(r,c,p){

    for(var i=0;i<ds.length;i++){var d=ds[i],line=[],nr=r+d[0],nc=c+d[1];
      while(inb(nr,nc)&&cells[nr][nc]!==0&&cells[nr][nc]!==p){line.push([nr,nc]);nr+=d[0];nc+=d[1];}
      if(line.length&&inb(nr,nc)&&cells[nr][nc]===p)out=out.concat(line);

    history.push({cells:cells.map(function(row){return row.slice();}),cur:cur});
    if(history.length>60)history.shift();
    cells[r][c]=cur;
    var fl=flipsFor(r,c,cur);
    for(var i=0;i<fl.length;i++)cells[fl[i][0]][fl[i][1]]=cur;
    SFX.place();
    var me=cur;
    for(var k=0;k<fl.length;k++){(function(cell,idx){setTimeout(function(){cell.classList.add('pop');SFX.flip(idx);setTimeout(function(){cell.classList.remove('pop');},320);},idx*55);})(cellEls[fl[k][0]][fl[k][1]],k);}
    if(fl.length>=3)toast(PNAMES[me]+'  '+fl.length+'マス奪取!',PCOLORS[me]);
    advance();render();scheduleAI();
  }
  function advance(){for(var i=0;i<bnum;i++){cur=cur%bnum+1;if(legalList(cur).length)return;}over=true;}

  function onCellClick(r,c){

    if(cells[r][c]!==0)return;
    var legal=legalList(cur);var ok=false;for(var i=0;i<legal.length;i++)if(legal[i][0]===r&&legal[i][1]===c){ok=true;break;}
    if(!ok)return;applyMove(r,c);
  }
  function chooseAI(p){

    for(var i=0;i<moves.length;i++){var r=moves[i][0],c=moves[i][1];
      var f=flipsFor(r,c,p).length;

  /* ---- 途中保存 / つづきから ---- */
  var SAVE_KEY='magiempire_board_save_v1';
  function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
  function saveMeta(){try{var d=JSON.parse(localStorage.getItem(SAVE_KEY));return d;}catch(e){return null;}}
  function saveGame(){
    if(!cells){toast('保存できる対局がありません');return false;}
    var data={N:N,cap:cap,bnum:bnum,seats:seats,cells:cells,cur:cur,over:over,
      history:history.map(function(h){return {cells:h.cells,cur:h.cur};}),ts:Date.now()};
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){toast('保存に失敗しました');return false;}
    toast('途中まで保存しました','#7CFF9B');
    if(window.refreshContinue)window.refreshContinue();
    return true;
  }
  function loadGame(){
    var raw;try{raw=localStorage.getItem(SAVE_KEY);}catch(e){return false;}
    if(!raw)return false;
    var d;try{d=JSON.parse(raw);}catch(e){return false;}
    N=d.N;cap=d.cap;bnum=d.bnum;seats=d.seats;builtN=0;
    cells=d.cells;cur=d.cur;over=!!d.over;history=d.history||[];lock=false;
    mSize=N;mCap=cap;mTotal=bnum;
    buildDom();
    $('bd-menu').style.display='none';
    fit();render();scheduleAI();
    toast('保存データを読み込みました','#7CFF9B');
    return true;
  }
  var pendingResume=false;
  function requestResume(){pendingResume=true;}
  function onShow(){fit();if(pendingResume){pendingResume=false;if(loadGame())return;}showMenu();}

  gridEl.addEventListener('click',function(e){var t=e.target.closest('.bd-cell');if(!t)return;onCellClick(+t.dataset.r,+t.dataset.c);});
  $('bd-undo').addEventListener('click',undo);
  $('bd-save').addEventListener('click',saveGame);
  return {onShow:onShow,fit:fit,hasSave:hasSave,requestResume:requestResume,loadGame:loadGame,showMenu:showMenu};
})();

/* =================== PRE-GAME SETUP (names + dice order, MagiArena方式) =================== */
function magiPregame(mode,count,onConfirm){
  var COLS=[null,'#ffd23f','#46c8ff','#ff5d8f','#7CFF9B'];
  var modal=document.getElementById('pregame-modal');
  var rolled=false, results=[], order=[];
  function render(){
    var html='<h2>'+(mode==='board'?'順番決め・プレイヤー設定':'プレイヤー設定')+'</h2>'
      +'<div class="rsub">名前を編集できます（次回も保存されます）</div><div id="pg-names"></div>';
    if(mode==='board'){ html+='<div class="rsub" style="margin-top:12px">サイコロの目が大きい人が先手です</div><div id="pg-dice" class="pg-dice"></div>'; }
    html+='<div class="cbtns">'
      +((mode==='board'&&!rolled)?'<button id="pg-roll">🎲 サイコロをふる</button>':'<button id="pg-start">はじめる</button>')
      +'<button id="pg-close" class="ghost">とじる</button></div>';
    modal.querySelector('.card').innerHTML=html;
    var nf=modal.querySelector('#pg-names');
    for(var i=1;i<=count;i++){(function(i){
      var f=document.createElement('div');f.className='nf';
      var d=document.createElement('span');d.className='dot';d.style.background=COLS[i];f.appendChild(d);
      var inp=document.createElement('input');inp.type='text';inp.maxLength=8;inp.value=MAGI_E_NAMES[i]||('P'+i);inp.dataset.i=i;
      inp.addEventListener('input',function(){MAGI_E_NAMES[i]=inp.value;if(mode==='board')renderDiceNames();});
      f.appendChild(inp);nf.appendChild(f);
    })(i);}
    if(mode==='board') renderDice();
    var rb=modal.querySelector('#pg-roll'); if(rb) rb.onclick=roll;
    var sb=modal.querySelector('#pg-start'); if(sb) sb.onclick=start;
    modal.querySelector('#pg-close').onclick=close;
  }
  function renderDice(){
    var box=modal.querySelector('#pg-dice'); if(!box)return; box.innerHTML='';
    for(var i=1;i<=count;i++){ var d=document.createElement('div'); d.className='pg-dpl';
      d.innerHTML='<div class="pg-nm" style="color:'+COLS[i]+'">'+escE(MAGI_E_NAMES[i]||('P'+i))+'</div>'
        +'<div class="pg-die" id="pg-die-'+i+'">'+(rolled?results[i]:'?')+'</div><div class="pg-rank" id="pg-rank-'+i+'"></div>'; box.appendChild(d); }
    if(rolled) showRanks();
  }
  function renderDiceNames(){ for(var i=1;i<=count;i++){ var el=modal.querySelector('#pg-die-'+i); if(el){ var nm=el.parentNode.querySelector('.pg-nm'); if(nm) nm.textContent=MAGI_E_NAMES[i]||('P'+i); } } }
  function roll(){ rolled=true; results=[null]; for(var i=1;i<=count;i++)results[i]=0; render();
    var ticks=0, iv=setInterval(function(){ ticks++; for(var i=1;i<=count;i++){ results[i]=1+Math.floor(Math.random()*6); var el=document.getElementById('pg-die-'+i); if(el)el.textContent=results[i]; }
      if(ticks>=8){ clearInterval(iv); computeOrder(); render(); } },110);
  }
  function computeOrder(){ var ids=[]; for(var i=1;i<=count;i++)ids.push(i); ids.sort(function(a,b){return results[b]-results[a]||Math.random()-0.5;}); order=ids; }
  function showRanks(){ for(var r=0;r<order.length;r++){ var el=document.getElementById('pg-rank-'+order[r]); if(el)el.textContent=(r===0?'1番手 ▶':(r+1)+'番手'); } }
  function start(){ for(var i=1;i<=count;i++){ if(!(MAGI_E_NAMES[i]||'').trim()) MAGI_E_NAMES[i]='P'+i; } saveMagiNames(); close(); onConfirm(mode==='board'?(order.length?order[0]:1):undefined); }
  function close(){ modal.classList.remove('open'); }
  modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
  modal.classList.add('open'); render();
}
function escE(s){ return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
