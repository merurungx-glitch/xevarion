<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../maintenance-gate.js?v=5"></script>
<meta charset="UTF-8" />
<script>(function(){try{var a=JSON.parse(localStorage.getItem('xeva_account_v1'));if(!a||!a.setupDone)location.replace('../index.html');}catch(e){}})();</script>
<script type="module" src="../xevarion-fb.js?v=18"></script>
<script type="module" src="../xeva-cloud.js?v=14"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MagiFinance — 投資判断ターミナル</title>
<link rel="icon" type="image/png" href="../thumbs/MagiFinance.jpg">
<link rel="apple-touch-icon" href="../thumbs/MagiFinance.jpg">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- フォントは本体スクリプト実行後に動的読込（オフライン/低速回線でも起動を止めない） -->
<style>

:root{
  --ink:#0B0E14;
  --ink-2:#0F131C;
  --panel:#141925;
  --panel-2:#1A2030;
  --panel-3:#202739;
  --line:#252D40;
  --line-soft:#1C2333;
  --txt:#E7EBF3;
  --txt-2:#A7B0C2;
  --txt-3:#6B7589;
  --gold:#F2B84B;
  --gold-dim:#9a7530;
  --up:#2BD980;
  --up-glow:rgba(43,217,128,.14);
  --down:#FF5C72;
  --down-glow:rgba(255,92,114,.14);
  --cyan:#52D6E8;
  --violet:#9A8CFF;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.8);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --display:"Space Grotesk","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(82,214,232,.06), transparent 60%),
    radial-gradient(900px 500px at -5% 110%, rgba(242,184,75,.05), transparent 55%),
    var(--ink);
  color:var(--txt);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line)}
::selection{background:rgba(242,184,75,.28)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{
  grid-column:1/3;display:flex;align-items:center;gap:20px;
  padding:0 22px;height:64px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--ink-2),var(--ink-2));
  backdrop-filter:blur(8px);z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;user-select:none}
.brand .glyph{
  width:34px;height:34px;border-radius:9px;position:relative;flex:0 0 auto;
  background:conic-gradient(from 210deg, #1d2433, #2a3346 120deg, #1d2433 240deg);
  border:1px solid var(--line);display:grid;place-items:center;
}
.brand .glyph::before,.brand .glyph::after{content:"";position:absolute;border-radius:50%}
.brand .glyph::before{inset:7px;border:1.5px solid var(--gold);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.brand .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.brand h1{font-family:var(--display);font-size:18px;letter-spacing:.3px;margin:0;font-weight:600}
.brand h1 span{color:var(--gold)}
.brand .tag{font-size:9.5px;letter-spacing:2.5px;color:var(--txt-3);text-transform:uppercase;margin-top:-2px}

.search{margin-left:8px;position:relative;flex:1;max-width:430px}
.search input{
  width:100%;height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);padding:0 14px 0 38px;font-size:13.5px;font-family:var(--sans);
  transition:border-color .15s,background .15s;
}
.search input:focus{outline:none;border-color:var(--gold-dim);background:var(--panel-2)}
.search input::placeholder{color:var(--txt-3)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt-3);pointer-events:none}
.search-results{
  position:absolute;top:46px;left:0;right:0;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);overflow:hidden;z-index:60;display:none;max-height:340px;overflow-y:auto;
}
.search-results.open{display:block}
.sr-row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.sr-row:last-child{border-bottom:none}
.sr-row:hover,.sr-row.active{background:var(--panel-3)}
.sr-row .tk{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--gold);min-width:52px}
.sr-row .nm{flex:1;font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-row .px{font-family:var(--mono);font-size:12.5px;color:var(--txt-2)}
.sr-empty{padding:18px 14px;color:var(--txt-3);font-size:13px;text-align:center}

.clock{margin-left:auto;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:12.5px}
.clock .mkt{display:flex;align-items:center;gap:7px;color:var(--txt-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up-glow);animation:pulse 2.4s infinite}
.pulse.closed{background:var(--txt-3);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,217,128,.5)}70%{box-shadow:0 0 0 9px rgba(43,217,128,0)}100%{box-shadow:0 0 0 0 rgba(43,217,128,0)}}
.clock .time{color:var(--txt);letter-spacing:.5px}
.clock .date{color:var(--txt-3);font-size:11px}

/* ---------- Sidebar ---------- */
.sidebar{
  grid-row:2;background:var(--ink-2);border-right:1px solid var(--line);
  padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.nav-label{font-size:10px;letter-spacing:1.8px;color:var(--txt-3);text-transform:uppercase;padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--txt-2);
  font-size:13.5px;font-weight:500;transition:.14s;position:relative;width:100%;text-align:left;
}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(242,184,75,.13),rgba(242,184,75,.02));color:var(--txt)}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;background:var(--gold);border-radius:0 3px 3px 0;box-shadow:0 0 12px var(--gold)}
.nav-item .ni-ico{width:18px;height:18px;flex:0 0 auto;color:currentColor}
.nav-item.active .ni-ico{color:var(--gold)}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--panel-3);color:var(--txt-2);padding:2px 7px;border-radius:20px}

.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--txt-3);line-height:1.6}
.side-foot b{color:var(--txt-2);font-weight:600}
.src-pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--gold);background:rgba(242,184,75,.08);border:1px solid var(--gold-dim);padding:3px 8px;border-radius:20px}

/* ---------- Main ---------- */
.main{grid-row:2;overflow-y:auto;overflow-x:hidden;padding:24px 28px 60px;scroll-behavior:smooth}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.view-head h2{font-family:var(--display);font-size:23px;margin:0 0 3px;font-weight:600;letter-spacing:.2px}
.view-head p{margin:0;color:var(--txt-3);font-size:13px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--txt-3);transition:.13s}
.seg button.on{background:var(--panel-3);color:var(--txt)}

/* cards */
.grid{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.card-h h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--txt)}
.card-h .sub{font-size:11px;color:var(--txt-3)}

/* index strip */
.index-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.idx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.idx:hover{border-color:var(--line);transform:translateY(-2px);box-shadow:var(--shadow)}
.idx .nm{font-size:11.5px;color:var(--txt-2);font-weight:500;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.idx .val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.4px}
.idx .chg{font-family:var(--mono);font-size:12px;margin-top:3px;font-weight:500}
.idx .spark{position:absolute;right:0;bottom:0;left:0;height:34px;opacity:.55}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--txt-2)}
.chip-up{background:var(--up-glow);color:var(--up)} .chip-down{background:var(--down-glow);color:var(--down)}

/* dashboard layout */
.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--txt-3);font-weight:600;text-align:right;padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.tbl th:first-child{text-align:left}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;text-align:right;vertical-align:middle}
.tbl td:first-child{text-align:left}
.tbl tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tr:last-child td{border-bottom:none}
.tk-cell{display:flex;align-items:center;gap:11px}
.tk-cell .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11px;flex:0 0 auto;color:#0B0E14}
.tk-cell .meta .t{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--txt)}
.tk-cell .meta .n{font-size:11px;color:var(--txt-3);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px-cell{font-family:var(--mono);font-weight:600;font-size:13px}
.chg-cell{font-family:var(--mono);font-weight:600;font-size:12.5px}
.badge-sig{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:4px 9px;border-radius:7px;display:inline-block;white-space:nowrap}
.row-spark{width:74px;height:26px;vertical-align:middle}
.wl-x{opacity:0;color:var(--txt-3);font-size:15px;transition:.12s;padding:2px 4px}
.tbl tr:hover .wl-x{opacity:1}
.wl-x:hover{color:var(--down)}

/* signal verdict gauge (signature) */
.verdict-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:230px;height:140px;flex:0 0 auto}
.gauge .verdict-txt{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge .vt-main{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.5px;line-height:1}
.gauge .vt-sub{font-family:var(--mono);font-size:11px;color:var(--txt-3);margin-top:4px}
.verdict-meta{flex:1;min-width:200px;display:flex;flex-direction:column;gap:9px}
.factor{display:flex;align-items:center;gap:10px;font-size:12.5px}
.factor .fl{width:118px;color:var(--txt-2);flex:0 0 auto}
.factor .fbar{flex:1;height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden;position:relative}
.factor .fbar i{position:absolute;top:0;bottom:0;border-radius:6px}
.factor .fv{font-family:var(--mono);font-size:11.5px;width:64px;text-align:right;color:var(--txt)}

/* stock detail */
.detail-top{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:16px}
@media(max-width:1100px){.detail-top{grid-template-columns:1fr}}
.price-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.price-head .big{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:.5px;line-height:1}
.price-head .chg-big{font-family:var(--mono);font-size:16px;font-weight:600;padding-bottom:5px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);border-radius:10px;overflow:hidden;border:1px solid var(--line-soft)}
.stat{background:var(--panel);padding:12px 14px}
.stat .k{font-size:10.5px;color:var(--txt-3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.stat .v{font-family:var(--mono);font-size:14px;font-weight:600}
.chart-box{padding:14px 8px 8px}
.chart-canvas-wrap{position:relative;width:100%}
canvas{display:block;width:100%}
.chart-legend{display:flex;gap:16px;padding:4px 12px 8px;font-size:11px;color:var(--txt-3);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px}
.lg i{width:14px;height:3px;border-radius:3px;display:inline-block}

/* news */
.news-list{display:flex;flex-direction:column}
.news-item{display:flex;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line-soft);transition:background .12s;cursor:default}
.news-item:hover{background:var(--panel-2)}
.news-item:last-child{border-bottom:none}
.news-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:54px}
.news-side .src{font-family:var(--mono);font-size:9.5px;color:var(--txt-3);text-align:center;line-height:1.3}
.senti{width:9px;height:9px;border-radius:50%}
.news-body{flex:1}
.news-body .ti{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:4px;line-height:1.45}
.news-body .ex{font-size:12.5px;color:var(--txt-2);line-height:1.55}
.news-body .mt{margin-top:7px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--txt-3)}
.tk-tag{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--gold);background:rgba(242,184,75,.08);padding:2px 7px;border-radius:5px}

/* signals view */
.sig-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.sig-cols{grid-template-columns:1fr}.index-strip{grid-template-columns:repeat(2,1fr)}.detail-top{grid-template-columns:1fr}}
.sig-col-h{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:2px}
.dotmark{width:10px;height:10px;border-radius:50%}

/* empty state */
.empty{text-align:center;padding:54px 20px;color:var(--txt-3)}
.empty .ei{font-size:34px;margin-bottom:12px;opacity:.5}
.empty h4{color:var(--txt-2);margin:0 0 6px;font-size:15px;font-weight:600}
.empty p{margin:0 0 16px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#0B0E14;font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;transition:.14s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:var(--panel-2);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-3);filter:none}

.add-wl{font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);transition:.13s;display:inline-flex;align-items:center;gap:6px}
.add-wl:hover{border-color:var(--gold-dim);color:var(--gold)}
.add-wl.added{background:rgba(242,184,75,.1);border-color:var(--gold-dim);color:var(--gold)}

/* data source guide */
.guide{max-width:860px}
.guide pre{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.65;color:#c8d0e0}
.guide pre .c{color:#6b7589}.guide pre .s{color:#9ad48a}.guide pre .k{color:#e2a0ff}.guide pre .f{color:#7fc7ff}
.guide h4{font-size:14px;margin:22px 0 8px;color:var(--txt)}
.guide p,.guide li{font-size:13px;color:var(--txt-2);line-height:1.7}
.step{display:flex;gap:13px;margin-bottom:14px}
.step .num{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--panel-3);color:var(--gold);font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:13px}

.notice{display:flex;gap:11px;background:rgba(82,214,232,.05);border:1px solid rgba(82,214,232,.2);border-radius:11px;padding:13px 15px;font-size:12.5px;color:var(--txt-2);line-height:1.6;margin-bottom:18px}
.notice b{color:var(--cyan)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-3);border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:100;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mini-tag{font-family:var(--mono);font-size:10px;color:var(--txt-3);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{grid-column:1}
  .main{grid-row:2;padding:16px}
  .index-strip{grid-template-columns:repeat(2,1fr)}
  .search{max-width:none}
  .clock .date{display:none}
}

/* ============ v2 additions ============ */
/* segmented toggles in topbar */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--txt-3);white-space:nowrap;transition:.12s}
.seg button.on{background:var(--panel-3);color:var(--txt)}
.seg button.on.gold{color:var(--gold)}
.topbar .ttools{display:flex;align-items:center;gap:12px;margin-left:auto}
.livebtn{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--txt-2);transition:.15s}
.livebtn .ld{width:8px;height:8px;border-radius:50%;background:var(--txt-3)}
.livebtn.on{border-color:var(--up);color:var(--up);background:var(--up-glow)}
.livebtn.on .ld{background:var(--up);box-shadow:0 0 8px var(--up);animation:pulse 2s infinite}
.livebtn.sim{border-color:var(--gold-dim);color:var(--gold)}
.livebtn.sim .ld{background:var(--gold)}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--txt-2);position:relative;transition:.15s}
.iconbtn:hover{border-color:var(--gold-dim);color:var(--txt)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--down);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}

/* watchlist tabs */
.wltabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.wltab{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--txt-2);display:flex;align-items:center;gap:8px;transition:.12s}
.wltab.on{border-color:var(--gold-dim);background:var(--panel-2);color:var(--txt)}
.wltab .ct{font-family:var(--mono);font-size:11px;color:var(--txt-3);background:var(--ink);padding:1px 6px;border-radius:6px}
.wltab.add{color:var(--gold);border-style:dashed}

/* notification center */
.notif-list{display:flex;flex-direction:column;gap:10px}
.notif{display:flex;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);align-items:flex-start}
.notif.unseen{border-color:var(--gold-dim);background:var(--panel-2)}
.notif .nico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.notif .nico.up{background:var(--up-glow);color:var(--up)}
.notif .nico.down{background:var(--down-glow);color:var(--down)}
.notif .nbody{flex:1;min-width:0}
.notif .nmsg{font-size:13.5px;color:var(--txt);font-weight:500}
.notif .nmeta{font-size:11.5px;color:var(--txt-3);margin-top:3px;font-family:var(--mono)}

/* news cards */
.news-card{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:var(--panel);text-decoration:none;color:inherit;transition:.13s;margin-bottom:11px}
.news-card:hover{border-color:var(--gold-dim);background:var(--panel-2);transform:translateY(-1px)}
.news-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.news-senti{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.4px}
.news-senti.pos{background:var(--up-glow);color:var(--up)}
.news-senti.neg{background:var(--down-glow);color:var(--down)}
.news-senti.neutral{background:var(--panel-3);color:var(--txt-2)}
.news-src{font-size:11.5px;color:var(--gold);font-weight:600}
.news-tk{font-family:var(--mono);font-size:11px;color:var(--txt-3)}
.news-time{font-size:11px;color:var(--txt-3);margin-left:auto;font-family:var(--mono)}
.news-title{font-size:14.5px;font-weight:600;line-height:1.45;color:var(--txt);margin-bottom:5px}
.news-ex{font-size:12.5px;color:var(--txt-2);line-height:1.55}
.news-link{font-size:11.5px;color:var(--cyan);margin-top:8px;display:inline-flex;align-items:center;gap:5px}

/* analyst / expert opinion bars */
.analyst{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:17px 18px}
.an-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 10px;background:var(--ink)}
.an-seg{height:100%}
.an-seg.sb{background:var(--up)}
.an-seg.b{background:#3fae6e}
.an-seg.h{background:var(--txt-3)}
.an-seg.s{background:#c0556a}
.an-seg.ss{background:var(--down)}
.an-leg{display:flex;flex-wrap:wrap;gap:13px;font-size:11.5px;color:var(--txt-2)}
.an-leg span{display:flex;align-items:center;gap:6px}
.an-dot{width:9px;height:9px;border-radius:3px}
.an-consensus{font-family:var(--display);font-size:18px;font-weight:600;margin-top:4px}

/* mark / since-marked chip */
.markchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-family:var(--mono)}
.markchip .lbl{color:var(--txt-3);font-family:var(--sans)}

/* target price rows */
.target-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:9px}
.target-row.hit{border-color:var(--up);background:var(--up-glow)}
.target-row .tdir{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.target-row .tdir.up{background:var(--up-glow);color:var(--up)}
.target-row .tdir.down{background:var(--down-glow);color:var(--down)}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(6,8,13,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.open{display:flex}
.modal{width:100%;max-width:460px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:between;gap:12px}
.modal-head h3{margin:0;font-family:var(--display);font-size:17px;font-weight:600;flex:1}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:7px;font-weight:600}
.field input,.field select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:0 13px;font-size:13.5px;font-family:var(--sans)}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold-dim)}
.field .hint{font-size:11.5px;color:var(--txt-3);margin-top:6px;line-height:1.5}
.field .hint a{color:var(--cyan)}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;transition:.13s}
.btn.primary{background:var(--gold);color:#1a1407}
.btn.primary:hover{background:#ffca5e}
.btn.ghost{border:1px solid var(--line);color:var(--txt-2)}
.btn.ghost:hover{border-color:var(--gold-dim);color:var(--txt)}
.btn.danger{color:var(--down);border:1px solid var(--down-glow)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}

/* settings rows */
.set-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border-bottom:none}
.set-row .si{flex:1}
.set-row .st{font-size:13.5px;font-weight:600;color:var(--txt)}
.set-row .sd{font-size:12px;color:var(--txt-3);margin-top:3px;line-height:1.5}
.statebadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px}
.statebadge.ok{background:var(--up-glow);color:var(--up)}
.statebadge.off{background:var(--panel-3);color:var(--txt-3)}
.add-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--gold-dim);color:var(--gold);font-size:12.5px;font-weight:600;background:rgba(242,184,75,.06);transition:.13s}
.add-btn:hover{background:rgba(242,184,75,.12)}
.loading-row{padding:30px;text-align:center;color:var(--txt-3);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:11px 15px;border-radius:11px;font-size:12.5px;margin-bottom:16px;display:flex;align-items:center;gap:9px;line-height:1.5}
.banner.warn{background:rgba(242,184,75,.08);border:1px solid var(--gold-dim);color:var(--gold)}
.banner.info{background:var(--panel);border:1px solid var(--line);color:var(--txt-2)}
.del-x{color:var(--txt-3);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.del-x:hover{background:var(--down-glow);color:var(--down)}
.nav-section{display:contents}
.side-foot .disc{color:var(--txt-3);line-height:1.6}

/* ============ v2 view styles ============ */
.view{display:none;padding:24px 28px 60px;max-width:1280px;margin:0 auto;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-head h1{font-family:var(--display);font-size:23px;font-weight:600;margin:0}
.vh-sub{font-size:13px;color:var(--txt-3);line-height:1.6;flex-basis:100%;margin-top:2px}
.vh-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.muted{color:var(--txt-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.card-head .sub{color:var(--txt-3);font-weight:400;font-size:12.5px}
.link-btn{margin-left:auto;color:var(--gold);font-size:12px;font-weight:600}
.empty-mini{padding:22px;text-align:center;color:var(--txt-3);font-size:13px}

/* index strip */
.ix-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.ix-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden}
.ix-name{font-size:12px;color:var(--txt-2);font-weight:600}
.ix-val{font-size:19px;margin-top:4px;letter-spacing:.3px}
.ix-chg{font-size:12.5px;margin-top:1px}
.ix-spark{position:absolute;right:8px;bottom:8px;opacity:.85}

/* dashboard grid */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dash-grid .span2{grid-column:1/3}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}.dash-grid .span2{grid-column:1}}

/* asset rows */
.asset-list{display:flex;flex-direction:column}
.asset-row{display:grid;grid-template-columns:1.6fr auto auto auto auto;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:8px;transition:.1s}
.asset-row:hover{background:var(--panel-2)}
.asset-list.big .asset-row{padding:15px 10px}
.ar-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.ar-tk{font-size:12px;color:var(--gold);font-weight:600}
.ar-nm{font-size:13.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-spark{opacity:.9}
.ar-since{font-size:11px}
.ar-px{text-align:right}.ar-px .mono{font-size:14px}
.ar-chg{font-size:12px;margin-top:1px}
.ar-act{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:42px}
.star.on{color:var(--gold)}
.verdict-pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap}
.verdict-pill.up{background:var(--up-glow);color:var(--up)}
.verdict-pill.down{background:var(--down-glow);color:var(--down)}
.verdict-pill.flat{background:var(--panel-3);color:var(--txt-2)}

/* mini lists */
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:7px}
.mini-row:hover{background:var(--panel-2)}
.mini-tk{font-size:11.5px;color:var(--gold);min-width:48px}
.mini-nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-score{font-size:13px;font-weight:600;min-width:42px;text-align:right}

/* signals board */
.sig-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.sig-board{grid-template-columns:1fr}}
.sig-col-head{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14px;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.sig-col-head.up{background:var(--up-glow);color:var(--up)}
.sig-col-head.down{background:var(--down-glow);color:var(--down)}
.sig-col-head.flat{background:var(--panel-3);color:var(--txt-2)}
.sig-col-head .ct{margin-left:auto;font-size:12px;opacity:.8}
.sig-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.12s}
.sig-card:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.sc-top{display:flex;align-items:center;gap:9px}
.sc-tk{font-size:12px;color:var(--gold);font-weight:600}
.sc-nm{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-score{font-size:15px;font-weight:700}
.sc-mid{display:flex;align-items:center;gap:10px;margin:9px 0 7px}
.sc-conf{font-size:11.5px;color:var(--txt-3)}
.sc-px{margin-left:auto;font-size:13px;color:var(--txt-2)}
.sc-note{font-size:11.5px;color:var(--txt-3);line-height:1.5}

/* empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--txt-3)}
.empty-state .es-ico{font-size:42px;margin-bottom:14px;opacity:.5}
.empty-state .es-t{font-size:16px;color:var(--txt-2);font-weight:600;margin-bottom:8px}
.empty-state .es-d{font-size:13px;max-width:420px;margin:0 auto;line-height:1.6}

/* stock detail */
.stock-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sh-id{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-btn{color:var(--txt-3);font-size:13px;font-weight:600}
.back-btn:hover{color:var(--txt)}
.sh-tk{font-size:15px;color:var(--gold);font-weight:600}
.sh-nm{font-family:var(--display);font-size:20px;font-weight:600}
.sh-mkt{font-size:12px;color:var(--txt-3);background:var(--panel);padding:3px 10px;border-radius:7px}
.live-dot{font-size:11px;color:var(--up);font-weight:700;letter-spacing:.5px}
.sh-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stock-price{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sp-now{font-size:34px;font-weight:700;letter-spacing:.5px}
.sp-chg{font-size:16px;font-weight:600}
.stock-grid{display:grid;grid-template-columns:380px 1fr;gap:18px}
@media(max-width:900px){.stock-grid{grid-template-columns:1fr}}
.verdict-note{font-size:12.5px;color:var(--txt-2);line-height:1.6;margin-top:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.factor{margin-bottom:14px}
.f-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.f-lbl{font-size:12.5px;color:var(--txt-2)}
.f-val{font-size:12.5px;font-weight:600}
.f-bar{height:6px;background:var(--ink);border-radius:4px;overflow:hidden;position:relative}
.f-fill{height:100%;border-radius:4px}
.f-fill.up{background:var(--up)}.f-fill.down{background:var(--down)}
.f-note{font-size:11px;color:var(--txt-3);margin-top:4px}
.chart-card canvas{width:100%;display:block}
.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--txt-3)}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.rng-seg{margin-left:auto;display:inline-flex;flex-wrap:wrap;justify-content:flex-end;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.rng{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--txt-3)}
.rng-select{display:none;margin-left:auto;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);padding:0 12px;font-size:14px;font-weight:600;font-family:var(--sans)}
.ds-body pre{background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;color:#c8d0e0;white-space:pre-wrap;margin:8px 0}
.ds-body code{background:var(--panel-3);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--gold)}
.rng.on{background:var(--panel-3);color:var(--gold)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border-radius:10px;overflow:hidden}
.metric{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--panel)}
.m-k{font-size:12px;color:var(--txt-3)}
.m-v{font-size:13px;color:var(--txt)}

/* news company groups */
.news-company{margin-bottom:18px}
.nc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
.nc-tk{font-size:13px;color:var(--gold);font-weight:600}
.nc-nm{font-family:var(--display);font-size:15px;font-weight:600}

/* modal results */
.modal-results{display:flex;flex-direction:column;max-height:240px;overflow-y:auto}
.mr-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:7px}
.mr-row:hover{background:var(--panel-3)}
.mr-tk{font-size:12px;color:var(--gold);min-width:50px}
.mr-nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-mkt{font-size:11px;color:var(--txt-3)}
.mr-px{font-size:12px;color:var(--txt-2)}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.ds-grid{grid-template-columns:1fr}}
.ds-body{font-size:13px;color:var(--txt-2);line-height:1.7}
.ds-body ol{margin:10px 0;padding-left:20px}.ds-body li{margin:5px 0}
.ds-body a{color:var(--cyan)}
.empty-state.small{padding:30px}

/* ============ 狭い画面でトップバーが横はみ出ししないように ============ */
@media(max-width:760px){
  html,body{overflow-x:hidden}
  .topbar{flex-wrap:wrap;height:auto;min-height:56px;padding:8px 12px;gap:8px}
  .topbar .clock{display:none}
  .topbar .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .topbar .ttools{margin-left:auto;gap:8px;flex-wrap:wrap}
  .seg button{padding:6px 9px}
  .livebtn{padding:6px 10px}
}

/* ============ モバイル下部ナビ + レスポンシブ ============ */
.mobnav{display:none}
@media(max-width:760px){
  .app{grid-template-rows:auto 1fr}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;
    background:rgba(15,19,28,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
    border:none;color:var(--txt-3);font-size:10px;font-weight:600;padding:6px 2px;border-radius:10px}
  .mobnav button.on{color:var(--gold)}
  .main{padding-bottom:80px}
  .view{padding:16px 14px 90px}
  .view-head h1{font-size:20px}
  .stock-price .sp-now{font-size:30px}
  .stat-grid,.metrics{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  .ix-strip{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .heat-grid{grid-template-columns:1fr}
  .sig-board{grid-template-columns:1fr}
  .brand .tag{display:none}
}
/* タブレット(iPad)向け: サイドバーは保持しつつ詰める */
@media(min-width:761px) and (max-width:1024px){
  .app{grid-template-columns:210px 1fr}
  .sidebar{padding:14px 10px}
  .view{padding:20px 18px 60px}
}

/* ============ 和むローディング演出＋進捗 ============ */
#loadBar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s}
#loadBar.on{opacity:1}
#loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#52D6E8,#9A8CFF,#F2B84B);box-shadow:0 0 10px rgba(154,140,255,.6);transition:width .5s ease}
.calm-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:54px 20px;text-align:center}
.calm-orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#52D6E8,#9A8CFF 55%,#F2B84B);animation:calmBreathe 3.4s ease-in-out infinite;box-shadow:0 0 55px rgba(154,140,255,.5)}
@keyframes calmBreathe{0%,100%{transform:scale(.82);opacity:.72}50%{transform:scale(1.06);opacity:1}}
.calm-title{font-family:var(--display);font-size:17px;font-weight:600;color:var(--txt)}
.calm-num{font-family:var(--mono);font-size:15px;color:var(--txt-2)} .calm-num b{color:var(--gold);font-size:21px}
.calm-pct{color:var(--cyan);font-weight:700}
.calm-track{width:min(420px,82%);height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.calm-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#52D6E8,#9A8CFF,#F2B84B);transition:width .5s ease;box-shadow:0 0 12px rgba(82,214,232,.5)}
.calm-msg{font-size:12.5px;color:var(--txt-3);min-height:18px;animation:calmFade 3s ease-in-out infinite}
.calm-hint{font-size:11.5px;color:var(--txt-3);max-width:440px;line-height:1.6;opacity:.8}
@keyframes calmFade{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.calm-orb,.calm-msg{animation:none}}

/* ============ iPhone 最適化（追加） ============ */
@media(max-width:600px){
  .view-head{gap:10px}
  .vh-actions{margin-left:0;flex-wrap:wrap;gap:8px;width:100%}
  .vh-actions .seg{flex-wrap:wrap}
  .seg button{padding:6px 10px;font-size:11.5px}
  .chart-card .card-head{flex-wrap:wrap;gap:8px}
  .rng-seg{display:none}              /* スマホはボタン群を隠し… */
  .rng-select{display:inline-block}    /* …ドロップダウンで期間選択 */
  .chart-wrap{margin:0 -4px}
  canvas#mainChart{min-height:300px}
  .calm-orb{width:68px;height:68px}
  .buy-row{grid-template-columns:22px minmax(0,1fr) auto;column-gap:8px}
  .buy-row .verdict-pill{display:none}
  .ix-strip{gap:8px}
  .ix-card{padding:11px 12px}
  .ix-val{font-size:17px}
  .heat-grid{grid-template-columns:1fr}
  .stock-grid{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .sp-now{font-size:28px!important}
  .news-card{padding:13px 14px}
  .card{padding:14px 14px}
}

/* ============ チャート クロスヘア（カーソルの日付・株価） ============ */
.chart-wrap{position:relative}
.cross-line{position:absolute;top:0;width:1px;background:rgba(231,235,243,.4);pointer-events:none;display:none;z-index:4}
.cross-tip{position:absolute;pointer-events:none;display:none;background:var(--panel-3);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;font-size:11.5px;font-family:var(--mono);color:var(--txt);
  box-shadow:var(--shadow);white-space:nowrap;z-index:5;line-height:1.6}
.cross-tip .d{color:var(--txt-3);margin-bottom:3px;font-family:var(--sans)}
.cross-tip .c.up{color:var(--up)} .cross-tip .c.down{color:var(--down)}

/* ============ hot sectors / buy list ============ */
.heat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.heat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;position:relative;overflow:hidden;transition:.15s}
.heat-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:var(--shadow)}
.heat-card .rank{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:11px;color:var(--txt-3)}
.heat-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.heat-flame{font-size:18px}
.heat-name{font-family:var(--display);font-size:16px;font-weight:600}
.heat-score{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:16px}
.heat-meter{height:8px;border-radius:6px;background:var(--ink);overflow:hidden;margin:10px 0 12px}
.heat-meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3fae6e,var(--up))}
.heat-meter i.cold{background:linear-gradient(90deg,#c0556a,var(--down))}
.heat-stats{display:flex;gap:14px;font-size:11.5px;color:var(--txt-3);margin-bottom:10px;flex-wrap:wrap}
.heat-stats b{color:var(--txt);font-family:var(--mono)}
.heat-stocks{display:flex;flex-direction:column;gap:1px}
.heat-stock{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
.heat-stock:hover{background:var(--panel-2)}
.heat-stock .ht-tk{font-family:var(--mono);color:var(--gold);min-width:46px;font-size:11.5px}
.heat-stock .ht-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.heat-badge.hot{background:var(--up-glow);color:var(--up)}
.heat-badge.cold{background:var(--down-glow);color:var(--down)}
.heat-badge.warm{background:rgba(242,184,75,.1);color:var(--gold)}
.buylist-card{background:linear-gradient(180deg,rgba(43,217,128,.06),transparent)}
.buy-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:8px}
.buy-row:hover{background:var(--panel-2)}
.buy-rank{font-family:var(--mono);font-weight:700;color:var(--gold);text-align:center}
.buy-row>div{min-width:0}
.buy-row .ar-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-reason{font-size:11px;color:var(--txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-row .ar-px{text-align:right;white-space:nowrap}
@media(max-width:620px){.buy-row{grid-template-columns:24px minmax(0,1fr) auto}.buy-row .verdict-pill{display:none}}

   1) シード付き乱数で再現性のある相場シミュレーション

"use strict";

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function fmtNum(n,d){return Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtPrice(n,cur){
  if(n==null||isNaN(n))return '—';
  if(cur==='JPY')return '¥'+fmtNum(n, n<10?2:0);
  if(cur==='USD')return '$'+fmtNum(n,2);
  return fmtNum(n,2); // index points
}
function fmtBig(n){
  if(n>=1e12)return (n/1e12).toFixed(2)+'兆';
  if(n>=1e8)return (n/1e8).toFixed(1)+'億';
  if(n>=1e4)return (n/1e4).toFixed(1)+'万';
  return fmtNum(n,0);
}
function fmtCap(cap,cur){
  if(cur==='USD'){
    if(cap>=1e12)return '$'+(cap/1e12).toFixed(2)+'T';
    if(cap>=1e9)return '$'+(cap/1e9).toFixed(1)+'B';
    return '$'+(cap/1e6).toFixed(0)+'M';
  }
  return '¥'+fmtBig(cap);
}
function pct(n){return (n>=0?'+':'')+n.toFixed(2)+'%';}
function signCls(n){return n>0?'up':n<0?'down':'flat';}
function avColor(seed){const h=(seed*47)%360;return `hsl(${h} 55% 58%)`;}
function timeAgo(min){if(min<60)return min+'分前';const h=Math.floor(min/60);if(h<24)return h+'時間前';return Math.floor(h/24)+'日前';}

/* ---------- 東証プライム“全銘柄”一覧（サーバー無し・クライアント取得） ----------
   JPX 公表の上場銘柄一覧(data_j.xls)を CORSプロキシ + SheetJS で取得し、
   「市場・商品区分」が プライム の銘柄を抽出。localStorage に1日キャッシュ。
   取得できない場合は同梱 PRIME_JP（主要銘柄）にフォールバック。 */
const PRIME_CACHE_KEY='magifinance_prime_list_v2';
function loadSheetJS(){
  return new Promise((res,rej)=>{
    if(window.XLSX)return res();
    const s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    const to=setTimeout(()=>rej(new Error('SheetJS読み込みタイムアウト')),12000);
    s.onload=()=>{clearTimeout(to);res();}; s.onerror=()=>{clearTimeout(to);rej(new Error('SheetJS読み込み失敗'));};
    document.head.appendChild(s);
  });
}
async function fetchJPXPrime(){
  await loadSheetJS();
  const url='https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls';
  let buf=null;
  for(const p of YH_PROXIES){
    try{ const r=await fetchTO(p(url),15000); if(!r.ok)continue;
      const b=await r.arrayBuffer(); if(b&&b.byteLength>20000){buf=b;break;} }catch(e){}
  }
  if(!buf)throw new Error('JPX一覧を取得できませんでした');
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  const list=[];
  rows.forEach(r=>{
    const keys=Object.keys(r);
    const kMkt=keys.find(k=>k.indexOf('市場')>=0), kCode=keys.find(k=>k.indexOf('コード')>=0),
      kName=keys.find(k=>k.indexOf('銘柄名')>=0), kSec=keys.find(k=>k.indexOf('業種')>=0);
    if(!kMkt||!kCode)return;
    if(String(r[kMkt]).indexOf('プライム')<0)return;
    const code=String(r[kCode]).trim(); if(!/^\d{4,5}$/.test(code))return;
    list.push([code, kName?String(r[kName]).trim():code, kSec?String(r[kSec]).trim():'']);
  });
  return list;
}
async function loadPrimeList(){
  // キャッシュ（1日）
  try{ const c=JSON.parse(localStorage.getItem(PRIME_CACHE_KEY));
    if(c&&c.list&&c.list.length>500&&Date.now()-c.ts<86400000)return c.list; }catch(e){}
  try{
    const list=await fetchJPXPrime();
    if(list.length>500){ try{localStorage.setItem(PRIME_CACHE_KEY,JSON.stringify({ts:Date.now(),list}));}catch(e){} return list; }
  }catch(e){ console.warn('プライム一覧取得失敗→主要銘柄で継続:',e.message); }
  return null;
}

/* ---------- technical indicators (real math) ---------- */
function SMA(arr,p){const o=[];for(let i=0;i<arr.length;i++){if(i<p-1){o.push(null);continue;}let s=0;for(let j=i-p+1;j<=i;j++)s+=arr[j];o.push(s/p);}return o;}
function EMA(arr,p){const k=2/(p+1),o=[];let prev;for(let i=0;i<arr.length;i++){if(i===0){prev=arr[0];o.push(prev);}else{prev=arr[i]*k+prev*(1-k);o.push(prev);}}return o;}
function RSI(arr,p=14){
  const o=new Array(arr.length).fill(null);let g=0,l=0;
  for(let i=1;i<arr.length;i++){const d=arr[i]-arr[i-1];const up=Math.max(d,0),dn=Math.max(-d,0);
    if(i<=p){g+=up;l+=dn;if(i===p){g/=p;l/=p;o[i]=100-100/(1+(l===0?100:g/l));}}
    else{g=(g*(p-1)+up)/p;l=(l*(p-1)+dn)/p;o[i]=100-100/(1+(l===0?100:g/l));}}
  return o;
}
function MACD(arr,f=12,s=26,sig=9){
  const ef=EMA(arr,f),es=EMA(arr,s);const macd=arr.map((_,i)=>ef[i]-es[i]);
  const signal=EMA(macd,sig);const hist=macd.map((m,i)=>m-signal[i]);
  return {macd,signal,hist};
}
function Bollinger(arr,p=20,k=2){
  const mid=SMA(arr,p),up=[],lo=[];
  for(let i=0;i<arr.length;i++){if(i<p-1){up.push(null);lo.push(null);continue;}
    let s=0;for(let j=i-p+1;j<=i;j++)s+=(arr[j]-mid[i])**2;const sd=Math.sqrt(s/p);
    up.push(mid[i]+k*sd);lo.push(mid[i]-k*sd);}
  return {mid,up,lo};
}

/* ---------- signal synthesis (the MAGI verdict) ---------- */
function buildSignal(closes){
  const n=closes.length,last=closes[n-1];
  const sma25=SMA(closes,25),sma75=SMA(closes,75);
  const rsi=RSI(closes,14);
  const {macd,signal,hist}=MACD(closes);
  const bb=Bollinger(closes,20,2);
  const factors=[];
  let score=0;

  // 1. trend (price vs SMA75) + cross of SMA25/75
  const tDev=(last-sma75[n-1])/sma75[n-1]*100;
  let tScore=clamp(tDev*4,-25,25);
  const crossNow=sma25[n-1]-sma75[n-1], crossPrev=sma25[n-2]-sma75[n-2];
  if(crossPrev<0&&crossNow>0)tScore=25; // golden cross
  if(crossPrev>0&&crossNow<0)tScore=-25; // dead cross
  factors.push({label:'トレンド（移動平均）',val:tScore,
    note: crossPrev<0&&crossNow>0?'ゴールデンクロス発生':crossPrev>0&&crossNow<0?'デッドクロス発生':
      tDev>0?'25日線が75日線の上で推移':'75日線を下回って推移'});
  score+=tScore;

  // 2. RSI momentum
  const r=rsi[n-1]??50;
  let rScore=0;
  if(r<30)rScore=22; else if(r<40)rScore=11; else if(r>70)rScore=-22; else if(r>60)rScore=-11; else rScore=(50-r)*0.4;
  factors.push({label:'モメンタム（RSI14）',val:rScore,raw:r,
    note:r<30?'売られ過ぎ（反発期待）':r>70?'買われ過ぎ（過熱）':'中立圏'});
  score+=rScore;

  // 3. MACD
  const h=hist[n-1],hp=hist[n-2];
  let mScore=clamp(h/last*900,-18,18);
  if(hp<0&&h>0)mScore=20; if(hp>0&&h<0)mScore=-20;
  factors.push({label:'MACD',val:mScore,
    note:hp<0&&h>0?'ヒストグラムが好転':hp>0&&h<0?'ヒストグラムが悪化':h>0?'プラス圏で推移':'マイナス圏で推移'});
  score+=mScore;

  // 4. Bollinger position
  const bw=bb.up[n-1]-bb.lo[n-1];
  const bpos=bw>0?(last-bb.lo[n-1])/bw:0.5; // 0..1
  let bScore=0;
  if(bpos<0.1)bScore=15; else if(bpos<0.25)bScore=8; else if(bpos>0.9)bScore=-15; else if(bpos>0.75)bScore=-8;
  factors.push({label:'ボリンジャー位置',val:bScore,raw:bpos,
    note:bpos<0.1?'下限バンド付近':bpos>0.9?'上限バンド付近':'バンド中央付近'});
  score+=bScore;

  // 5. short-term volatility / pullback (5d vs 20d)
  const ret5=(last-closes[n-6])/closes[n-6]*100;
  let vScore=clamp(-ret5*1.4,-12,12); // contrarian short-term
  factors.push({label:'短期需給（5日）',val:vScore,raw:ret5,
    note:ret5>3?'短期過熱の調整リスク':ret5<-3?'短期下落の反発余地':'落ち着いた値動き'});
  score+=vScore;

  score=clamp(score,-100,100);
  let verdict,vClass;
  if(score>=45){verdict='強い買い';vClass='up';}
  else if(score>=18){verdict='買い';vClass='up';}
  else if(score>-18){verdict='中立';vClass='flat';}
  else if(score>-45){verdict='売り';vClass='down';}
  else{verdict='強い売り';vClass='down';}
  const confidence=Math.round(40+Math.abs(score)*0.6);
  return {score:Math.round(score),verdict,vClass,confidence,factors,
    rsi:r, sma25:sma25[n-1], sma75:sma75[n-1], bb};
}

/* ---------- market simulation ---------- */
const SEED=20260617;
const DAYS=200;
const Market={ assets:{}, indices:{}, _t:0 };

function genSeries(base,vol,drift,seedKey){
  const rnd=mulberry32(SEED+seedKey*7919);
  const dt=1/252, candles=[];
  let price=base*(0.82+rnd()*0.12); // start below current so we trend toward "now"
  // regime: gentle multi-phase trend so charts look organic
  let regime=drift;
  for(let i=0;i<DAYS;i++){
    if(i%28===0)regime=drift + (rnd()-0.5)*0.55;
    const open=price;
    // intraday path -> OHLC
    let hi=open,lo=open,p=open;
    const steps=6;
    for(let s=0;s<steps;s++){
      const shock=(rnd()-0.5);
      p=p*Math.exp((regime-0.5*vol*vol)*(dt/steps)+vol*Math.sqrt(dt/steps)*shock*1.9);
      hi=Math.max(hi,p);lo=Math.min(lo,p);
    }
    const close=p;
    const volume=Math.round((0.6+rnd()*0.9)*base*1e4/Math.sqrt(base));
    candles.push({open,high:hi,low:lo,close,volume});
    price=close;
  }
  // normalize last close roughly to base (so "current price" is realistic)
  const ratio=base/candles[candles.length-1].close;
  const blend=i=>1+(ratio-1)*(i/(DAYS-1)); // gradual so history stays organic
  candles.forEach((c,i)=>{const b=blend(i);c.open*=b;c.high*=b;c.low*=b;c.close*=b;});
  return candles;
}

function buildAsset(def){
  const [ticker,name,market,currency,base,sector,vol,drift,shares]=def;
  return {ticker,name,market,currency,sector,shares,
    candles:[], price:null, prevClose:null, dayOpen:null, signal:null,
    live:false, state:'pending', err:null};
}

function marketCap(a){const cap=a.price*a.shares; if(a.currency==='USD')return cap; return cap;}
function searchUniverse(q){

  return UNIVERSE.filter(d=>d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q)||d[5].toLowerCase().includes(q))
    .map(d=>Market.assets[d[0]]);
}

/* ---------- news generation ---------- */
const NEWS_SRC=['日経速報','Bloomberg','Reuters','会社IR','東洋経済','MarketWire'];
const POS=[
  '__N__、通期業績予想を上方修正 営業益が市場予想を上回る',
  '__N__に新規「強気」レーティング 目標株価引き上げ',
  '__N__、自社株買いを発表 発行済み株式の上限__P__%',
  '__N__の主力事業が好調、__S__分野で受注拡大',
  '__N__、増配を発表 株主還元を強化',
  '機関投資家が__N__株を買い増し 大量保有報告',
];
const NEG=[
  '__N__、四半期決算が市場予想に届かず 株価下落',
  '__N__に弱気見通し アナリストが目標株価を下方修正',
  '__N__、__S__市場の競争激化で利益率に圧力',
  '__N__の生産計画に遅れ サプライチェーン懸念',
  '為替の逆風で__N__の海外収益に影響との見方',
];
const NEU=[
  '__N__、新製品ラインを発表 市場の反応は限定的',
  '__N__がCEO交代を発表 経営体制を刷新',
  '__N__、__S__分野で新たな提携を協議中との報道',
  '__N__の月次データ公表 前年並みで推移',
];
const MKT_NEWS=[
  ['日経平均、米金利動向にらみ__D__展開 半導体関連が__M__','市場全体','neutral'],
  ['FRB高官発言を受け米株__M__、ハイテク株に資金流入','米国市場','pos'],
  ['円相場が__W__に振れ、輸出関連株の重しに','為替','neg'],
  ['東証プライム、売買代金が__V__兆円 個人投資家の動き活発','市場全体','neutral'],
  ['世界的なリスク選好の__R__で新興国市場にも資金','グローバル','pos'],
];
function genNews(){
  const rnd=mulberry32(SEED+Market._t*13);
  const items=[];
  // per-asset news weighted by signal direction
  UNIVERSE.forEach((d,i)=>{
    if(rnd()>0.55)return;
    const a=Market.assets[d[0]];
    const dir=a.signal.score;
    let pool,senti;
    const roll=rnd();
    if(dir>15&&roll<0.7){pool=POS;senti='pos';}
    else if(dir<-15&&roll<0.7){pool=NEG;senti='neg';}
    else if(roll<0.4){pool=NEU;senti='neutral';}
    else if(dir>=0){pool=POS;senti='pos';}
    else {pool=NEG;senti='neg';}
    const tpl=pool[Math.floor(rnd()*pool.length)];
    const title=tpl.replace('__N__',a.name).replace('__S__',a.sector).replace('__P__',(3+Math.floor(rnd()*7)));
    items.push({title,senti,ticker:a.ticker,name:a.name,
      src:NEWS_SRC[Math.floor(rnd()*NEWS_SRC.length)],
      min:Math.floor(rnd()*640)+2,
      ex:newsExcerpt(a,senti)});
  });
  // market-wide
  MKT_NEWS.forEach(m=>{
    if(rnd()>0.6)return;
    const t=m[0].replace('__D__',rnd()>0.5?'底堅い':'もみ合い').replace('__M__',rnd()>0.5?'上昇':'軟調')
      .replace('__W__',rnd()>0.5?'円安':'円高').replace('__V__',(3+rnd()*2).toFixed(1))
      .replace('__R__',rnd()>0.5?'回復':'後退');
    items.push({title:t,senti:m[2],ticker:null,name:m[1],src:NEWS_SRC[Math.floor(rnd()*3)],
      min:Math.floor(rnd()*300)+1,ex:'市場関係者によると、当面は経済指標と要人発言を見極める展開が続くとみられる。投資家心理は引き続き慎重ながらも、押し目買い意欲は根強い。'});
  });
  return items.sort((a,b)=>a.min-b.min);
}
function newsExcerpt(a,senti){
  const ch=dayChange(a);
  if(senti==='pos')return `${a.name}は${a.sector}事業の堅調さが評価され、本日の株価は${pct(ch.pct)}と${ch.pct>=0?'続伸':'反発'}。アナリストはバリュエーション面の余地を指摘している。`;
  if(senti==='neg')return `${a.name}を巡っては短期的な需給悪化が意識され、株価は${pct(ch.pct)}。中長期の成長シナリオは維持との声もあり、押し目を探る動きも。`;
  return `${a.name}に関する材料が伝わったが、市場の反応は限定的。引き続き${a.sector}セクター全体の動向が注目される。`;
}


function gaugeSVG(s){
  const W=230,H=140,cx=W/2,cy=H-12,R=96;
  const ang=score=>(180-((score+100)/200*180))*Math.PI/180; // score -> radians (180°=left, 0°=right)
  // build an arc band as a polyline (robust, no SVG flag ambiguity)
  const band=(from,to,col,wd)=>{
    const steps=24,pts=[];
    for(let i=0;i<=steps;i++){const sc=from+(to-from)*i/steps;const a=ang(sc);
      pts.push(`${(cx+Math.cos(a)*R).toFixed(1)},${(cy-Math.sin(a)*R).toFixed(1)}`);}
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`;
  };
  const a=ang(s.score);
  const nx=cx+Math.cos(a)*(R-8), ny=cy-Math.sin(a)*(R-8);
  const col=s.vClass==='up'?'#2BD980':s.vClass==='down'?'#FF5C72':'#A7B0C2';
  return `<svg width="${W}" height="${H+34}" viewBox="0 0 ${W} ${H+34}">
    ${band(-100,-45,'#FF5C72',9)}${band(-44,-19,'rgba(255,92,114,.42)',9)}
    ${band(-18,18,'#3a4256',9)}
    ${band(19,44,'rgba(43,217,128,.42)',9)}${band(45,100,'#2BD980',9)}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#141925" stroke="${col}" stroke-width="2.5"/>
    <text x="14" y="${H-2}" fill="#FF5C72" font-size="9" font-family="JetBrains Mono,monospace">強い売り</text>
    <text x="${W-14}" y="${H-2}" fill="#2BD980" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="end">強い買い</text>
    <text x="${cx}" y="${H+16}" text-anchor="middle" fill="${col}" font-size="22" font-weight="700" font-family="Space Grotesk,sans-serif">${s.verdict}</text>
    <text x="${cx}" y="${H+32}" text-anchor="middle" fill="#6B7589" font-size="11" font-family="JetBrains Mono,monospace">確信度 ${s.confidence}%</text>
  </svg>`;
}

// 期間コントロール（PCはボタン、スマホはドロップダウンで枠内に収める）
function rangeControls(){
  const segs=RANGES.map(([k,lab])=>`<button class="rng ${UI.stockRange===k?'on':''}" data-range="${k}">${lab}</button>`).join('');
  const opts=RANGES.map(([k,lab])=>`<option value="${k}" ${UI.stockRange===k?'selected':''}>${lab}</option>`).join('');
  return `<div class="rng-seg" id="rangeSeg">${segs}</div><select class="rng-select" id="rangeSelect" aria-label="表示期間">${opts}</select>`;
}
function curCandles(a){ return (a._rc&&a._rc[UI.stockRange]) || a.candles || []; }
function fmtAxisTime(ts,key){
  if(!ts)return '';
  const d=new Date(ts*1000);
  if(key==='1d'||key==='5d') return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(key==='2y'||key==='5y'||key==='10y') return ("'"+(''+d.getFullYear()).slice(2))+'/'+(d.getMonth()+1);
  return (d.getMonth()+1)+'/'+d.getDate();
}
function drawChart(a){
  const cv=$('#mainChart');if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const cssW=cv.clientWidth||cv.parentElement.clientWidth;
  const cssH=340;
  cv.width=cssW*dpr;cv.height=cssH*dpr;cv.style.height=cssH+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const data=curCandles(a);
  if(!data.length){ ctx.fillStyle='#6B7589';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('データを取得できませんでした',cssW/2,cssH/2);return; }
  const closes=data.map(c=>c.close);
  const showMA=data.length>=30;
  const sma25=showMA?SMA(closes,25):[], sma75=showMA?SMA(closes,75):[];
  const bb=showMA?Bollinger(closes,20,2):{up:[],lo:[]};
  const bbu=bb.up,bbl=bb.lo;

  const padL=8,padR=66,padT=14,padB=46,volH=54;
  const plotW=cssW-padL-padR, plotTop=padT, plotBot=cssH-padB-volH, plotH=plotBot-plotTop;
  MagiChart={data,padL,plotW,currency:a.currency,rangeKey:UI.stockRange}; // クロスヘア用
  let mn=Infinity,mx=-Infinity;
  data.forEach(c=>{mn=Math.min(mn,c.low);mx=Math.max(mx,c.high);});
  bbl.forEach(v=>{if(v!=null)mn=Math.min(mn,v);});bbu.forEach(v=>{if(v!=null)mx=Math.max(mx,v);});
  const pad=(mx-mn)*0.06;mn-=pad;mx+=pad;const rg=mx-mn||1;
  const X=i=>padL+(i/Math.max(1,data.length-1))*plotW;
  const Y=v=>plotTop+(1-(v-mn)/rg)*plotH;

  // grid + price axis
  ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.textBaseline='middle';
  for(let g=0;g<=4;g++){
    const v=mn+rg*g/4, y=Y(v);
    ctx.strokeStyle='rgba(255,255,255,0.045)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
    ctx.fillStyle='#6B7589';ctx.textAlign='left';
    ctx.fillText(a.currency==='JPY'?fmtNum(v,v<10?2:0):fmtNum(v,2),padL+plotW+6,y);
  }
  // 日付/時刻 軸（実際のタイムスタンプを使用）
  ctx.textAlign='center';ctx.fillStyle='#6B7589';
  const ticks=5;
  for(let t=0;t<=ticks;t++){
    const i=Math.round(t/ticks*(data.length-1));const x=X(i);
    ctx.fillText(fmtAxisTime(data[i].t,UI.stockRange),x,cssH-volH-padB+30);
  }

  // bollinger band fill
  ctx.beginPath();let started=false;
  for(let i=0;i<data.length;i++){if(bbu[i]==null)continue;const x=X(i),y=Y(bbu[i]);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}
  for(let i=data.length-1;i>=0;i--){if(bbl[i]==null)continue;ctx.lineTo(X(i),Y(bbl[i]));}
  ctx.closePath();ctx.fillStyle='rgba(82,214,232,0.05)';ctx.fill();
  // bb edges
  [[bbu,'rgba(82,214,232,0.35)'],[bbl,'rgba(82,214,232,0.35)']].forEach(([arr,col])=>{
    ctx.beginPath();let st=false;arr.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  });

  // volume
  const vmax=Math.max(1,...data.map(c=>c.volume||0));
  data.forEach((c,i)=>{const x=X(i);const bw=Math.max(1.5,plotW/data.length*0.62);
    const h=((c.volume||0)/vmax)*volH;
    ctx.fillStyle=c.close>=c.open?'rgba(43,217,128,0.22)':'rgba(255,92,114,0.22)';
    ctx.fillRect(x-bw/2,cssH-padB-h+10,bw,h);
  });

  // candles
  data.forEach((c,i)=>{const x=X(i);const up=c.close>=c.open;
    const col=up?'#2BD980':'#FF5C72';ctx.strokeStyle=col;ctx.fillStyle=col;
    const bw=Math.max(1.6,plotW/data.length*0.62);
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y(c.high));ctx.lineTo(x,Y(c.low));ctx.stroke();
    const yo=Y(c.open),yc=Y(c.close);const top=Math.min(yo,yc),hgt=Math.max(1.5,Math.abs(yc-yo));
    if(bw>2.4){ctx.fillRect(x-bw/2,top,bw,hgt);}else{ctx.lineWidth=bw;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+hgt);ctx.stroke();}
  });

  // moving averages
  const line=(arr,col,wd)=>{ctx.beginPath();let st=false;arr.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.stroke();};
  line(sma25,'#F2B84B',1.6);
  line(sma75,'#9A8CFF',1.6);

  // last price marker
  const lastC=data[data.length-1], lastY=Y(lastC.close);
  const upTrend = lastC.close>=data[0].close;
  ctx.fillStyle = a.signal ? (a.signal.vClass==='down'?'#FF5C72':'#2BD980') : (upTrend?'#2BD980':'#FF5C72');
  ctx.fillRect(padL+plotW,lastY-9,padR-2,18);
  const lp = (a.price!=null?a.price:lastC.close);
  ctx.fillStyle='#0B0E14';ctx.textAlign='center';ctx.font='600 10px '+getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.fillText(a.currency==='JPY'?fmtNum(lp,lp<10?2:0):fmtNum(lp,2),padL+plotW+padR/2,lastY);
}

  Store.lists.forEach(l=>l.tickers.forEach(t=>s.add(t)));

  Object.keys(Store.targets).forEach(t=>{if(Store.targets[t]&&Store.targets[t].length)s.add(t);});

/* ユーザー追加銘柄の空シェルを用意（中身は実データ取得で埋まる） */
function ensureAsset(def){
  // def: [ticker,name,market,currency,base,sector,vol,drift,shares]
  const tk=def[0];
  if(Market.assets[tk])return Market.assets[tk];
  const a=buildAsset(def);
  Market.assets[tk]=a; return a;
}
function rebuildCustoms(){ Store.custom.forEach(def=>ensureAsset(def)); }

const TD_BASE='https://api.twelvedata.com';
const FH_BASE='https://finnhub.io/api/v1';
const LiveCache={news:{}, reco:{}, mktNews:null, mktNewsTs:0, quoteErr:null};

function isoDate(d){return d.toISOString().slice(0,10);}
function tdSymbol(a){
  // Tokyo listings: pass country=Japan to disambiguate numeric codes
  if(a.currency==='JPY')return {symbol:a.ticker, country:'Japan'};
  return {symbol:a.ticker};
}
function fhSymbol(a){ return a.currency==='JPY'? a.ticker+'.T' : a.ticker; }

async function tdTimeSeries(a){
  const key=Store.keys.td; if(!key)throw new Error('Twelve Data APIキー未設定');
  const m=tdSymbol(a);
  const u=new URL(TD_BASE+'/time_series');
  u.searchParams.set('symbol',m.symbol);
  if(m.country)u.searchParams.set('country',m.country);
  u.searchParams.set('interval','1day');
  u.searchParams.set('outputsize','200');
  u.searchParams.set('apikey',key);
  const r=await fetch(u.toString());
  const j=await r.json();
  if(j.status==='error'||!j.values)throw new Error(j.message||'時系列取得エラー');
  const vals=j.values.slice().reverse(); // oldest first
  return vals.map(v=>({open:+v.open,high:+v.high,low:+v.low,close:+v.close,vol:+(v.volume||0)}));
}
async function tdQuote(a){
  const key=Store.keys.td; if(!key)throw new Error('nokey');
  const m=tdSymbol(a);
  const u=new URL(TD_BASE+'/quote');
  u.searchParams.set('symbol',m.symbol);
  if(m.country)u.searchParams.set('country',m.country);
  u.searchParams.set('apikey',key);
  const r=await fetch(u.toString()); const j=await r.json();
  if(j.status==='error'||j.close===undefined)throw new Error(j.message||'quote error');
  return {price:+j.close, prevClose:+(j.previous_close||j.close), open:+(j.open||j.close),
          high:+(j.high||j.close), low:+(j.low||j.close)};
}
async function tdSearch(q){
  const key=Store.keys.td; if(!key)return null;
  const u=new URL(TD_BASE+'/symbol_search');
  u.searchParams.set('symbol',q); u.searchParams.set('outputsize','12'); u.searchParams.set('apikey',key);
  const r=await fetch(u.toString()); const j=await r.json();
  return (j&&j.data)?j.data:[];
}
async function fhCompanyNews(a){
  const key=Store.keys.fh; if(!key)throw new Error('nokey');
  const to=new Date(), from=new Date(Date.now()-21*864e5);
  const u=`${FH_BASE}/company-news?symbol=${encodeURIComponent(fhSymbol(a))}&from=${isoDate(from)}&to=${isoDate(to)}&token=${key}`;
  const r=await fetch(u); const j=await r.json();
  return Array.isArray(j)?j:[];
}
async function fhReco(a){
  const key=Store.keys.fh; if(!key)throw new Error('nokey');
  const u=`${FH_BASE}/stock/recommendation?symbol=${encodeURIComponent(fhSymbol(a))}&token=${key}`;
  const r=await fetch(u); const j=await r.json();

}
async function fhMarketNews(){

  const r=await fetch(`${FH_BASE}/news?category=general&token=${key}`);
  const j=await r.json(); return Array.isArray(j)?j.slice(0,40):[];
}

/* ---------- Yahoo Finance プロバイダ（APIキー不要・既定） ----------
   ブラウザから直接 Yahoo を叩くと CORS で弾かれるため、公開CORSプロキシを
   順に試す。すべて失敗した場合はシミュレーション系列のまま継続する。 */
const YH_PROXIES=[
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u
];
const YH_INDEX={N225:'^N225',TOPIX:'1306.T',SPX:'^GSPC',NDX:'^IXIC',DJI:'^DJI'}; // TOPIXは連動ETF(1306.T)で代替（指数値そのものは取得困難なため）
function yahooSymbol(a){ return a.yh || (a.currency==='JPY'? a.ticker+'.T' : a.ticker); }
async function fetchTO(url,ms){
  const ctrl=new AbortController(); const id=setTimeout(()=>ctrl.abort(),ms||9000);
  try{ return await fetch(url,{cache:'no-store',signal:ctrl.signal}); }
  finally{ clearTimeout(id); }
}
async function yhFetchJSON(url){
  let lastErr;
  for(const p of YH_PROXIES){
    try{
      const r=await fetchTO(p(url),9000);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('全プロキシで取得失敗');
}
/* ---------- ニュース（日本語対応・キー不要） ----------
   Google ニュース RSS（日本語）をCORSプロキシ経由で取得。中継サーバーがあれば
   サーバーの /api/news を優先（安定）。Finnhub は専門家評価(reco)のみ任意利用。 */
async function newsViaRSS(query){
  const url='https://news.google.com/rss/search?q='+encodeURIComponent(query)+'&hl=ja&gl=JP&ceid=JP:ja';
  let xml=null,lastErr;
  for(const p of YH_PROXIES){
    try{ const r=await fetchTO(p(url),9000); if(!r.ok)continue; const t=await r.text();
      if(t&&t.indexOf('<item')>=0){xml=t;break;} }catch(e){lastErr=e;}
  }
  if(!xml)throw lastErr||new Error('ニュース取得失敗');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  return [...doc.getElementsByTagName('item')].slice(0,12).map(it=>{
    const g=t=>{const e=it.getElementsByTagName(t)[0];return e?e.textContent:'';};
    const pub=g('pubDate');
    return {headline:g('title'), source:(g('source')||'Google ニュース'), url:g('link'),
      datetime:pub?Math.floor(Date.parse(pub)/1000):0};
  });
}

function yhParseChart(j){
  const res=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!res||!res.indicators||!res.indicators.quote)throw new Error('データ形式エラー');
  const q=res.indicators.quote[0], ts=res.timestamp||[], out=[];
  for(let i=0;i<ts.length;i++){
    const o=q.open[i],h=q.high[i],l=q.low[i],c=q.close[i];
    if(c==null||o==null)continue;
    out.push({t:ts[i],open:o,high:h,low:l,close:c,volume:(q.volume&&q.volume[i])||0});
  }
  if(out.length<5)throw new Error('データ不足');
  return {candles:out, meta:res.meta||{}};
}

}

/* ---------- 期間別チャート（1日〜10年） ---------- */
const RANGES=[['1d','1日'],['5d','1週'],['1mo','1月'],['3mo','3月'],['6mo','6月'],['1y','1年'],['2y','2年'],['5y','5年'],['10y','10年']];
const RANGE_INTERVAL={'1d':'5m','5d':'30m','1mo':'1d','3mo':'1d','6mo':'1d','1y':'1d','2y':'1d','5y':'1wk','10y':'1mo'};
async function yahooRange(sym,key){

// 銘柄/指数シンボルと期間キーから日足等の系列を取得（サーバー優先）
async function getRangeSeries(sym,key){
  if(serverBase()){
    try{ const j=await srvJSON('/api/history?symbol='+encodeURIComponent(sym)+'&range='+key+'&interval='+(RANGE_INTERVAL[key]||'1d'));
      if(j.candles&&j.candles.length)return j.candles; }catch(e){}

// 期間別データを確保（既存の日足を流用、無ければ取得してキャッシュ）。a は銘柄 or 指数。
function ensureRange(a,key,cb){
  if(!a)return; a._rc=a._rc||{};
  if(!a._rc[key] && a.candles && a.candles.length){
    if(a.code){ if(key==='6mo')a._rc['6mo']=a.candles; }            // 指数は6mo日足を保持
    else { // 銘柄は1y日足を保持 → 短期は流用
      if(key==='1y')a._rc['1y']=a.candles;
      else if(key==='6mo')a._rc['6mo']=a.candles.slice(-130);
      else if(key==='3mo')a._rc['3mo']=a.candles.slice(-66);
      else if(key==='1mo')a._rc['1mo']=a.candles.slice(-23);
    }
  }
  if(a._rc[key]){ if(cb)cb(); return; }
  const sym = a.code ? (YH_INDEX[a.code]||a.code) : yahooSymbol(a);
  a._rcLoading=key;
  getRangeSeries(sym,key).then(c=>{ a._rc[key]=c; a._rcLoading=null; if(UI.view==='stock')drawChart(a); if(cb)cb(); })
    .catch(()=>{ a._rcLoading=null; if(cb)cb(); });
}

/* 取得した実データ系列を資産に適用し、実データから指標(シグナル)を計算 */
function applySeries(a,candles){
  if(!candles||candles.length<30){ a.state='error'; a.err='データ不足'; return; }
  a.candles=candles.map(c=>({t:c.t||null,open:c.open,high:c.high,low:c.low,close:c.close,
    volume:(c.volume!=null?c.volume:(c.vol||0))}));
  a.price=a.candles[a.candles.length-1].close;
  a.prevClose=a.candles[a.candles.length-2].close;
  a.dayOpen=a.candles[a.candles.length-1].open;
  a.signal=buildSignal(a.candles.map(c=>c.close));
  a.live=true; a.state='ok'; a.err=null;
}
function applyQuote(a,q){
  if(a.state!=='ok')return;
  a.price=q.price; a.prevClose=q.prevClose;
  const c=a.candles[a.candles.length-1]; if(c){c.close=q.price;c.high=Math.max(c.high,q.price);c.low=Math.min(c.low,q.price);}
  a.live=true;
}

/* 実データの並行取得（限定同時実行・進捗付き）。シミュレーションは一切行わない。 */
async function fetchAllSeries(assets){
  const src=dataSource();
  let i=0; const total=assets.length;
  let lastRender=0;
  UI.loadProgress={done:0,total,ok:0,fail:0};
  const work=async()=>{
    while(i<assets.length){
      const a=assets[i++];
      try{ const c = await getSeries(a);
        applySeries(a,c); if(a.state==='ok')UI.loadProgress.ok++; else UI.loadProgress.fail++; }
      catch(e){ a.state='error'; a.err=e.message||'取得失敗'; UI.loadProgress.fail++; }
      UI.loadProgress.done=UI.loadProgress.ok+UI.loadProgress.fail;
      const now=Date.now();
      if((UI.loadProgress.done===total) || now-lastRender>700){ lastRender=now; updateDataStatus();
        if(['dashboard','watchlist','signals','sectors','screen'].includes(UI.view))renderCurrent(); }
      if(src==='twelvedata')await sleep(8000); // TD無料枠 ~8 req/min
    }
  };
  const N = src==='twelvedata' ? 1 : (src==='server' ? 10 : 8);
  await Promise.all(Array.from({length:N},()=>work()));
  return {ok:UI.loadProgress.ok, fail:UI.loadProgress.fail};
}
// 取得失敗した銘柄だけ再試行（実際に読めた数を増やす）
async function retryFailed(maxRounds){
  for(let round=0; round<(maxRounds||2); round++){
    const failed=allAssets().filter(a=>a.state==='error');
    if(!failed.length)break;
    failed.forEach(a=>{a.state='pending';});
    await fetchAllSeries(failed);
  }
}
// 中継サーバーの /api/screen から東証プライム“全銘柄”(価格+シグナル)を一括取り込み（最も確実）
async function loadUniverseFromServer(){
  UI.loadProgress={done:0,total:0,ok:0,fail:0};
  const j=await srvJSON('/api/screen?market=prime');
  const items=(j&&j.items)||[];
  if(!items.length)throw new Error('サーバーから銘柄を取得できませんでした');
  items.forEach(it=>{
    const code=it.code; let a=Market.assets[code];
    if(!a){ a=buildAsset([code,it.name,'東証P','JPY',0,it.sector||'—',0.3,0.05,1e9]); Market.assets[code]=a; }
    if(it.name)a.name=it.name; if(it.sector)a.sector=it.sector;
    a.price=it.price; a.prevClose=it.prevClose; a.dayOpen=it.prevClose;
    a.signal={score:it.score,verdict:it.verdict,vClass:it.vClass,confidence:it.confidence,rsi:it.rsi,
      sma25:null,sma75:null,factors:[{label:'総合シグナル',val:it.score,note:'中継サーバー(yfinance)による分析'}]};
    a.state='ok'; a.live=true; a._serverLoaded=true; if(!a.candles)a.candles=[];
  });
  UI.primeFull=true; UI.primeCount=items.length;
  UI.loadProgress={done:items.length,total:items.length,ok:items.length,fail:0};
}

// 実データ取得：①指数を即時表示 → ②プライム全銘柄をバックグラウンドで全読込
async function reloadData(){
  if(UI.liveBusy)return;
  const src=dataSource();
  if(src==='twelvedata' && !Store.keys.td){ UI.dataState='error'; updateDataStatus(); renderCurrent();
    modalKeys(); toast('Twelve Data を使うにはAPIキーが必要です'); return; }
  UI.liveBusy=true; UI.dataState='loading'; UI.assetsLoading=false; updateDataStatus(); renderCurrent();
  // ① 指数を先に取得して即表示
  Object.values(Market.indices).forEach(ix=>{ix.state=YH_INDEX[ix.code]?'pending':'error';});
  await liveIndices();
  if(Object.values(Market.indices).some(ix=>ix.state==='ok')){ UI.dataState='ok'; }
  UI.assetsLoading=true; updateDataStatus(); renderCurrent(); // 以降ローディング表示
  // ★ 中継サーバーがあれば、全プライム銘柄を1回の呼び出しで取得（最も確実・高速）
  if(src==='server'){
    try{
      await loadUniverseFromServer();
      UI.assetsLoading=false; UI.liveBusy=false; UI.dataState='ok';
      updateDataStatus(); renderCurrent();
      toast(`中継サーバーから東証プライム ${UI.primeCount} 銘柄を取得`);
      return;
    }catch(e){ /* 失敗時は従来のクライアント取得にフォールバック */ }
  }
  // ② プライムユニバース（全銘柄/主要）を構築（JPX一覧取得に時間がかかる場合あり）
  if(src!=='twelvedata'){ try{ await ensurePrimeUniverse(); }catch(e){} }
  // ③ 全銘柄をバックグラウンドで読み込み（指数は表示済み）
  Object.values(Market.assets).forEach(a=>{ if(a.state!=='ok'){a.state='pending';a.err=null;} });
  const targets = src==='twelvedata' ? trackedSymbols().map(getAsset).filter(Boolean) : allAssets();
  updateDataStatus(); renderCurrent();
  await fetchAllSeries(targets);
  // 取得できなかった銘柄を再試行して実際の読込数を増やす（done表示と実数の乖離を縮小）
  if(src!=='twelvedata') await retryFailed(2);
  UI.assetsLoading=false; UI.liveBusy=false;
  const okN=loadedAssets().length, totalN=allAssets().length;
  UI.dataState = (okN||Object.values(Market.indices).some(ix=>ix.state==='ok')) ? 'ok' : 'error';
  updateDataStatus(); renderCurrent();
  if(okN) toast(`実データ取得: ${okN}/${totalN}銘柄（${dataSourceLabel()}${UI.primeFull?'・プライム全'+UI.primeCount+'銘柄':''}）`+((totalN-okN)?` ／ ${totalN-okN}件は取得できませんでした`:''));
  else if(!Object.values(Market.indices).some(ix=>ix.state==='ok')) toast('データを取得できませんでした。時間をおいて「再取得」してください');
}

async function liveQuotePoll(){
  if(UI.liveBusy||UI.dataState!=='ok')return;
  const src=dataSource();
  if(src==='twelvedata' && !Store.keys.td)return;
  const syms=trackedSymbols().slice(0,8);
  for(const tk of syms){
    const a=getAsset(tk); if(!a||a.state!=='ok')continue;

    catch(e){ if(src==='twelvedata' && /run out|limit|credits/i.test(e.message||''))break; }

  for(const x of Object.values(Market.indices)){
    if(x.state!=='ok')continue;
    try{ const c=await getIndexSeries(x.code); x.price=c[c.length-1].close; x.closes[x.closes.length-1]=x.price; }catch(e){}
    await sleep(120);
  }
  if(UI.view==='stock'&&UI.current)updateStockLive(); else renderCurrent();
}

function pushAlert(ticker,msg,dir){

  Store.alerts.unshift(al); if(Store.alerts.length>80)Store.alerts.length=80;

// ブラウザ通知の許可をリクエスト（Promise/callback 両対応・未対応端末を案内）
function requestNotifPerm(){
  if(!('Notification' in window)){
    toast('この端末・ブラウザは Web 通知に未対応です（iPhone の Safari は非対応）。アプリ内の「通知センター」と画面下の通知で代わりにお知らせします。');
    return;
  }
  if(Notification.permission==='denied'){
    toast('通知がブロックされています。ブラウザのアドレスバーやサイト設定から「通知: 許可」に変更してください。');
    return;
  }
  let called=false;
  const done=(p)=>{
    if(called)return; called=true;
    if(p==='granted'){ toast('✅ 通知を許可しました'); try{new Notification('MagiFinance',{body:'通知をオンにしました。目標株価の到達などをお知らせします。'});}catch(e){} }
    else if(p==='denied'){ toast('通知は許可されませんでした。ブラウザのサイト設定から変更できます。'); }
    else { toast('通知の許可がキャンセルされました。'); }
    if(UI.view==='settings')renderSettings();
  };
  try{
    const r=Notification.requestPermission(done); // Safari等の callback 形式
    if(r&&typeof r.then==='function')r.then(done); // 標準の Promise 形式
  }catch(e){ toast('通知を有効にできませんでした: '+e.message); }
}
function checkTargets(a){
  const list=Store.targets[a.ticker]; if(!list)return;
  list.forEach(t=>{
    if(t.done)return;
    const hit=(t.dir==='up'&&a.price>=t.price)||(t.dir==='down'&&a.price<=t.price);
    if(hit){ t.done=true; pushAlert(a.ticker, `${a.name} が目標株価 ${fmtPrice(t.price,a.currency)} に到達（現在 ${fmtPrice(a.price,a.currency)}）`, t.dir); }
  });
  saveStore();
}
