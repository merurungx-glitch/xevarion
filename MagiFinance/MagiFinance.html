function dataNoticeHTML(){
  if(UI.assetsLoading){ const p=UI.loadProgress;
    return `<div class="banner info"><span class="spin"></span>東証プライム${UI.primeFull?'全'+UI.primeCount+'銘柄':'主要銘柄'}を読み込み中… 読込成功 <b>${p.ok||0}</b> ／ 処理 ${p.done}/${p.total}（${loadPct()}%）${p.fail?'・取得不可 '+p.fail:''}（指数は表示済み・ランキングは順次更新）</div>`; }
  if(UI.dataState==='loading')
    return `<div class="banner info"><span class="spin"></span>市場データを取得しています…（実データのみを表示します）</div>`;
  if(UI.dataState==='error')
    return `<div class="banner warn">⚠ 市場データを取得できませんでした。回線状況や公開プロキシの制限により取得できないことがあります。<b style="cursor:pointer;text-decoration:underline" data-open="live">再取得する</b>${Store.provider==='twelvedata'?'／<b style="cursor:pointer;text-decoration:underline" data-open="keys">APIキー設定</b>':''}</div>`;
  const total=allAssets().length, ok=loadedAssets().length;
  const srvTip = serverBase()?'' : ` 💡 <b style="cursor:pointer;text-decoration:underline" data-view-link="datasource">中継サーバー</b>を使うと<b>東証プライム全約1,600銘柄</b>を確実に表示できます。`;
  if(!serverBase() && total && ok<total)
    return `<div class="banner warn">${ok}/${total} 銘柄のみ取得できました（残り${total-ok}件は回線/プロキシ制限で取得不可）。${srvTip} <b style="cursor:pointer;text-decoration:underline" data-open="live">再取得</b></div>`;
  if(total && ok<total)
    return `<div class="banner info">${ok}/${total} 銘柄を実データ取得（${total-ok}件は取得できませんでした）。<b style="cursor:pointer;text-decoration:underline" data-open="live">再取得</b></div>`;
  if(!serverBase())
    return `<div class="banner info">実データ表示中（${ok}銘柄）。${srvTip}</div>`;
  return '';
}
// 進捗率
function loadPct(){ const p=UI.loadProgress; return (p&&p.total)?Math.round(p.done/p.total*100):0; }
// 気分が和らぐローディング演出（呼吸するオーブ＋数値進捗＋やさしいメッセージ）
const CALM_MSGS=['深呼吸して、相場を待ちましょう','データを丁寧に集めています','よい投資判断は、落ち着きから','市場は逃げません。ゆっくりどうぞ','チャートをそっと整えています','コーヒーを一口どうぞ ☕'];
function calmLoaderHTML(title){
  const p=UI.loadProgress||{done:0,total:0,ok:0,fail:0}; const pc=loadPct();
  const msg=CALM_MSGS[Math.floor(Date.now()/3000)%CALM_MSGS.length];
  return `<div class="calm-load">
    <div class="calm-orb"></div>
    <div class="calm-title">${title||'実データを読み込んでいます'}</div>
    <div class="calm-num">読込成功 <b>${p.ok||0}</b> 銘柄　<span class="muted" style="font-size:12px">処理 ${p.done}/${p.total||'—'}・${pc}%${p.fail?'・取得不可 '+p.fail:''}</span></div>
    <div class="calm-track"><i style="width:${pc}%"></i></div>
    <div class="calm-msg">${msg}</div>
    <div class="calm-hint">指数（日経平均・TOPIX・S&P500・NASDAQ・NYダウ）は先に表示されます。ランキングは読み込みながら順次更新されます。</div></div>`;
}
function updateLoadBar(){
  const b=document.getElementById('loadBar'); if(!b)return;
  if(UI.assetsLoading){ b.classList.add('on'); const i=b.querySelector('i'); if(i)i.style.width=loadPct()+'%'; }
  else b.classList.remove('on');
}
// データが1件も無いビュー向けの中央表示
function dataEmptyHTML(){
  if(UI.assetsLoading||UI.dataState==='loading') return calmLoaderHTML();
  return `<div class="empty-state"><div class="es-ico">⚠</div>
    <div class="es-t">データを取得できませんでした</div>
    <div class="es-d">実際の市場データを表示するアプリのため、取得できない場合は表示できません。回線状況や公開プロキシの混雑が原因のことがあります。時間をおいて再取得してください。</div>
    <button class="btn primary" data-open="live" style="margin-top:16px">再取得する</button></div>`;
}
function sparkSVG(closes,w=104,h=30){
  const n=Math.min(40,closes.length),arr=closes.slice(-n),mn=Math.min(...arr),mx=Math.max(...arr),rng=mx-mn||1;
  const up=arr[arr.length-1]>=arr[0];
  const pts=arr.map((v,i)=>`${(i/(n-1)*w).toFixed(1)},${(h-((v-mn)/rng)*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--down)'}" stroke-width="1.6"/></svg>`;
}
function assetRow(a,opts={}){
  const mk=isMarked(a.ticker), mc=markChange(a);
  const since=mc?`<span class="markchip"><span class="lbl">注目から</span><span class="${signCls(mc.pct)}">${pct(mc.pct)}</span></span>`:'';
  const del=opts.listId?`<button class="del-x" data-rm="${a.ticker}" data-list="${opts.listId}" title="削除">✕</button>`:'';
  return `<div class="asset-row" data-go="${a.ticker}">
    <div class="ar-id"><span class="ar-tk mono">${a.ticker}</span><span class="ar-nm">${a.name}</span></div>
    <div class="ar-spark">${sparkSVG(a.candles.map(c=>c.close))}</div>
    ${since?`<div class="ar-since">${since}</div>`:''}
    <div class="ar-sig">${verdictPill(a.signal)}</div>
    <div class="ar-px">${priceHTML(a)}<div class="ar-chg">${chgHTML(a)}</div></div>
    <div class="ar-act">${mk?'<span class="star on" title="注目中">★</span>':''}${del}</div>
  </div>`;
}

function renderDashboard(){
  const idx=Object.values(Market.indices).filter(ix=>{
    if(Store.region==='all')return true;
    const jp=['N225','TOPIX'].includes(ix.code); return Store.region==='jp'?jp:!jp;
  });
  const strip=idx.map(ix=>{
    if(ix.state!=='ok'){
      return `<div class="ix-card" data-index="${ix.code}" style="cursor:pointer"><div class="ix-name">${ix.name}</div>
        <div class="ix-val mono muted" style="font-size:14px">${ix.state==='loading'||UI.dataState==='loading'?'取得中…':'取得できません'}</div></div>`;
    }
    const d=(ix.price-ix.prevClose)/ix.prevClose*100;
    return `<div class="ix-card" data-index="${ix.code}" style="cursor:pointer" title="クリックでチャート表示"><div class="ix-name">${ix.name}</div>
      <div class="ix-val mono">${fmtNum(ix.price,2)}</div>
      <div class="ix-chg mono ${signCls(d)}">${pct(d)}</div>
      <div class="ix-spark">${sparkSVG(ix.closes,120,26)}</div></div>`;
  }).join('');

  // 指数は先に表示。銘柄がまだ無い場合も指数とローディングは表示する。
  if(!pool.length){
    $('#view-dashboard').innerHTML=`${dataNoticeHTML()}
      <div class="ix-strip">${strip||'<div class="muted">対象地域の指数はありません</div>'}</div>
      ${(UI.assetsLoading||UI.dataState==='loading')?
        `<div class="empty-state"><div class="es-ico"><span class="spin" style="width:30px;height:30px;border-width:3px"></span></div>

  const movers=pool.slice().sort((a,b)=>dayChange(b).pct-dayChange(a).pct);
  const gain=movers.slice(0,5), lose=movers.slice(-5).reverse();
  const wl=activeList().tickers.map(getAsset).filter(a=>a&&a.state==='ok').filter(inRegion);

  $('#view-dashboard').innerHTML=`

    <div class="ix-strip">${strip||'<div class="muted">対象地域の指数はありません</div>'}</div>
    <div class="dash-grid">
      <div class="card span2">
        <div class="card-head"><h2>ウォッチリスト<span class="sub">・${activeList().name}</span></h2>
          <button class="add-btn" data-open="addstock">＋ 銘柄を追加</button></div>
        <div class="asset-list">${wl.length?wl.map(a=>assetRow(a,{listId:Store.activeList})).join(''):'<div class="empty-mini">銘柄が登録されていません。「銘柄を追加」から登録してください。</div>'}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2>買い候補 <span class="sub">全${pool.length}銘柄から分析</span></h2><button class="link-btn" data-view-link="signals">すべて見る →</button></div>

      </div>
      <div class="card">
        <div class="card-head"><h2>売り・警戒</h2></div>
        <div class="mini-list">${sells.map(a=>miniSig(a)).join('')}</div>

        <div class="card-head"><h2>値上がり率</h2></div>
        <div class="mini-list">${gain.map(a=>miniMove(a)).join('')}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2>値下がり率</h2></div>
        <div class="mini-list">${lose.map(a=>miniMove(a)).join('')}</div>

}
function miniSig(a){return `<div class="mini-row" data-go="${a.ticker}">

function miniMove(a){const d=dayChange(a);return `<div class="mini-row" data-go="${a.ticker}">

function renderSignals(){
  const pool=loadedAssets().filter(inRegion).slice().sort((a,b)=>b.signal.score-a.signal.score);
  if(!pool.length){ $('#view-signals').innerHTML=`<div class="view-head"><h1>買い・売り候補</h1></div>`+dataEmptyHTML(); return; }
  const buy=pool.filter(a=>a.signal.score>=18);
  const hold=pool.filter(a=>a.signal.score>-18&&a.signal.score<18);
  const sell=pool.filter(a=>a.signal.score<=-18).sort((a,b)=>a.signal.score-b.signal.score);
  const CAP=120; // 多数銘柄でも軽快に描画（各列上位のみ表示）
  const col=(title,arr,cls)=>`<div class="sig-col">
    <div class="sig-col-head ${cls}">${title}<span class="ct mono">${arr.length}</span></div>
    ${arr.length?arr.slice(0,CAP).map(sigCard).join('')+(arr.length>CAP?`<div class="empty-mini">ほか ${arr.length-CAP} 銘柄</div>`:''):'<div class="empty-mini">該当なし</div>'}</div>`;
  $('#view-signals').innerHTML=`
    ${UI.assetsLoading?dataNoticeHTML():''}
    <div class="view-head"><h1>買い・売り候補</h1>
      <div class="vh-sub">${Store.region==='all'?'日本＋海外':Store.region==='jp'?'日本株':'海外株'}の全${pool.length}銘柄を5指標で分析し、スコア順にランク付けしています。${UI.assetsLoading?'（読み込み中・順次更新）':''}</div></div>
    <div class="sig-board">${col('買い',buy,'up')}${col('中立',hold,'flat')}${col('売り',sell,'down')}</div>`;
}
function sigCard(a){
  const top=a.signal.factors.slice().sort((x,y)=>Math.abs(y.val)-Math.abs(x.val))[0];
  return `<div class="sig-card" data-go="${a.ticker}">
    <div class="sc-top"><span class="sc-tk mono">${a.ticker}</span><span class="sc-nm">${a.name}</span>
      <span class="sc-score mono ${a.signal.score>=0?'up':'down'}">${a.signal.score>0?'+':''}${a.signal.score}</span></div>
    <div class="sc-mid">${verdictPill(a.signal)}<span class="sc-conf">確信度 ${a.signal.confidence}%</span>
      <span class="mono sc-px">${fmtPrice(a.price,a.currency)}</span></div>
    <div class="sc-note">主因: ${top.label}（${top.note}）</div></div>`;
}

/* ============================================================
   VIEW: 業界別ホット (HOT SECTORS) + 買い時リスト
   ============================================================ */
function sectorAggregate(){
  const pool=loadedAssets().filter(inRegion);
  const map={};
  pool.forEach(a=>{
    const s=a.sector||'その他';
    (map[s]=map[s]||{sector:s,assets:[]}).assets.push(a);
  });
  const arr=Object.values(map).map(g=>{
    const n=g.assets.length;
    const avgScore=g.assets.reduce((s,a)=>s+a.signal.score,0)/n;
    const avgChg=g.assets.reduce((s,a)=>s+dayChange(a).pct,0)/n;
    const buys=g.assets.filter(a=>a.signal.score>=18).length;
    // ヒート指標: シグナルスコアと当日騰落率を合成
    const heat=avgScore*0.7+clamp(avgChg*5,-30,30)*0.6;
    const leaders=g.assets.slice().sort((x,y)=>y.signal.score-x.signal.score).slice(0,3);
    return {...g,n,avgScore,avgChg,buys,heat,leaders};
  });
  return arr.sort((a,b)=>b.heat-a.heat);
}
function renderSectors(){
  const sectors=sectorAggregate();
  const pool=loadedAssets().filter(inRegion);
  if(!pool.length){ $('#view-sectors').innerHTML=`<div class="view-head"><h1>業界別ホット</h1></div>`+dataEmptyHTML(); return; }
  // 買い時の株リスト: スコア上位 + 過熱しすぎていない(RSI<72)銘柄
  const buyList=pool.slice()
    .filter(a=>a.signal.score>=18 && a.signal.rsi<72)
    .sort((a,b)=>b.signal.score-a.signal.score).slice(0,8);
  const flame=h=>h>=20?'🔥':h>=8?'🌶️':h>=-8?'➖':'🧊';
  const heatBadge=h=>h>=8?'<span class="heat-badge hot">過熱・買い優勢</span>':h<=-8?'<span class="heat-badge cold">軟調・売り優勢</span>':'<span class="heat-badge warm">中立</span>';
  const cards=sectors.map((g,i)=>{
    const w=clamp((g.heat+40)/80*100,4,100);
    const cold=g.heat<0;
    return `<div class="heat-card">
      <span class="rank">#${i+1}</span>
      <div class="heat-top"><span class="heat-flame">${flame(g.heat)}</span>
        <span class="heat-name">${g.sector}</span>
        <span class="heat-score ${g.heat>=0?'up':'down'}">${g.heat>0?'+':''}${g.heat.toFixed(0)}</span></div>
      <div class="heat-meter"><i class="${cold?'cold':''}" style="width:${w}%"></i></div>
      <div class="heat-stats">${heatBadge(g.heat)}
        <span>銘柄 <b>${g.n}</b></span>
        <span>平均騰落 <b class="${signCls(g.avgChg)}">${pct(g.avgChg)}</b></span>
        <span>買いシグナル <b>${g.buys}</b></span></div>
      <div class="heat-stocks">${g.leaders.map(a=>`<div class="heat-stock" data-go="${a.ticker}">
        <span class="ht-tk">${a.ticker}</span><span class="ht-nm">${a.name}</span>
        ${verdictPill(a.signal)}<span class="mono ${signCls(dayChange(a).pct)}">${pct(dayChange(a).pct)}</span></div>`).join('')}</div>
    </div>`;
  }).join('');
  $('#view-sectors').innerHTML=`
    <div class="view-head"><h1>業界別ホット</h1>
      <div class="vh-sub">${Store.region==='all'?'日本＋海外':Store.region==='jp'?'日本株':'海外株'}の全${pool.length}銘柄を業界(セクター)別に集計し、テクニカルスコアと当日騰落率を合成した「ヒート指標」が高い順に並べています。今いちばん勢いのある業界がひと目で分かります。</div></div>
    <div class="card buylist-card">
      <div class="card-head"><h2>🛒 今日の買い時リスト <span class="sub">スコア上位・過熱しすぎていない銘柄</span></h2>
        <button class="link-btn" data-view-link="signals">全候補を見る →</button></div>
      ${buyList.length?buyList.map((a,i)=>{
        const top=a.signal.factors.slice().sort((x,y)=>Math.abs(y.val)-Math.abs(x.val))[0];
        return `<div class="buy-row" data-go="${a.ticker}">
          <span class="buy-rank">${i+1}</span>
          <div><div class="ar-nm">${a.name} <span class="mono" style="color:var(--txt-3);font-size:11px">${a.ticker}</span></div>
            <div class="buy-reason">${a.sector}・${top.label}（${top.note}）／ RSI ${fmtNum(a.signal.rsi,0)}</div></div>
          ${verdictPill(a.signal)}
          <div class="ar-px">${priceHTML(a)}<div class="ar-chg">${chgHTML(a)}</div></div></div>`;
      }).join(''):'<div class="empty-mini">現在、強い買い候補はありません。中立〜売り優勢の地合いです。</div>'}
    </div>
    <div class="card" style="background:none;border:none;padding:0;margin-bottom:10px"><div class="card-head"><h2>業界ヒートマップ</h2></div></div>
    <div class="heat-grid">${cards}</div>`;
}

// 価格ベースの割安/割高（52週位置・移動平均乖離・ボリンジャー%B）
function valuation(a){
  const s=a.signal; const closes=(a.candles||[]).map(c=>c.close); if(!closes.length)return null;
  const hi=Math.max(...closes), lo=Math.min(...closes), last=a.price!=null?a.price:closes[closes.length-1];
  const pos=hi>lo?(last-lo)/(hi-lo):0.5; // 0=安値圏 1=高値圏
  const devMA = s&&s.sma75? (last-s.sma75)/s.sma75*100 : 0;
  let score=0; // 正=割高 負=割安
  score += (pos-0.5)*2*40;
  score += clamp(devMA*1.2,-30,30);
  if(s){ if(s.rsi>70)score+=15; else if(s.rsi<30)score-=15; }
  score=clamp(score,-100,100);
  let label,cls;
  if(score<=-40){label='かなり割安';cls='up';}
  else if(score<=-15){label='やや割安';cls='up';}
  else if(score<15){label='妥当';cls='flat';}
  else if(score<40){label='やや割高';cls='down';}
  else {label='かなり割高';cls='down';}
  return {score,label,cls,pos52:pos};
}
function fmtPct1(v){return (v==null||isNaN(v))?'—':(v>=0?'':'')+ (v*1).toFixed(2)+'%';}
function valuationCardHTML(a){
  const v=valuation(a); const f=a._fund;
  // 業種平均（読込済み同業種のMAGIスコア平均）と比較
  const peers=loadedAssets().filter(x=>x.sector&&x.sector===a.sector&&x.signal);
  const sectorAvg=peers.length?peers.reduce((s,x)=>s+x.signal.score,0)/peers.length:null;
  const num=(x,suf,mul)=>x==null?'—':( (mul?x*mul:x).toFixed( suf==='%'?2: (Math.abs(x)>=100?0:2) )+(suf||'') );
  const fundRows = f ? `
    <div class="metric"><span class="m-k">PER（株価収益率）</span><span class="m-v mono">${num(f.per,'倍')}</span></div>
    <div class="metric"><span class="m-k">PBR（株価純資産倍率）</span><span class="m-v mono">${num(f.pbr,'倍')}</span></div>
    <div class="metric"><span class="m-k">ROE（自己資本利益率）</span><span class="m-v mono">${f.roe==null?'—':(f.roe*100).toFixed(1)+'%'}</span></div>
    <div class="metric"><span class="m-k">配当利回り</span><span class="m-v mono">${f.dividendYield==null?'—':(f.dividendYield* (f.dividendYield<1?100:1)).toFixed(2)+'%'}</span></div>
    <div class="metric"><span class="m-k">EPS（1株利益）</span><span class="m-v mono">${num(f.eps)}</span></div>
    <div class="metric"><span class="m-k">業種</span><span class="m-v">${f.sector||a.sector||'—'}</span></div>`
    : `<div class="metric" style="grid-column:1/-1"><span class="m-k">PER / PBR / ROE / 配当利回り / 業績</span><span class="m-v" style="color:var(--txt-3)">${serverBase()?'<span class=\"spin\"></span> 取得中…':'中継サーバー設定時に表示'}</span></div>`;
  const earn = (f&&f.earnings&&f.earnings.length)? `
    <div style="margin-top:12px"><div class="m-k" style="margin-bottom:6px">業績推移（売上・純利益）</div>
      ${earningsBarsHTML(f.earnings,a.currency)}</div>` : '';
  return `
    <div class="verdict-pill ${v?v.cls:'flat'}" style="font-size:14px;padding:6px 14px">${v?v.label:'—'}</div>

let MagiChart=null;
function setupCrosshair(){
  const cv=$('#mainChart'); if(!cv)return;
  const line=$('#crossLine'), tip=$('#crossTip');
  const move=e=>{
    const geo=MagiChart; if(!geo||!geo.data.length){return;}
    const rect=cv.getBoundingClientRect();
    const x=(e.clientX!=null?e.clientX:0)-rect.left;
    if(x<geo.padL||x>geo.padL+geo.plotW){line.style.display='none';tip.style.display='none';return;}
    const i=clamp(Math.round((x-geo.padL)/geo.plotW*(geo.data.length-1)),0,geo.data.length-1);
    const c=geo.data[i]; if(!c)return;
    const cx=geo.padL+(i/(geo.data.length-1))*geo.plotW;
    line.style.display='block'; line.style.left=cx+'px'; line.style.height=rect.height+'px';
    const dt=c.t?new Date(c.t*1000):new Date();
    const intraday=(geo.rangeKey==='1d'||geo.rangeKey==='5d');
    const dstr=`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}（${'日月火水木金土'[dt.getDay()]}）`+
      (intraday?` ${('0'+dt.getHours()).slice(-2)}:${('0'+dt.getMinutes()).slice(-2)}`:'');
    const f=v=>geo.currency==='JPY'?'¥'+fmtNum(v,v<10?2:0):geo.currency==='USD'?'$'+fmtNum(v,2):fmtNum(v,2);
    const up=c.close>=c.open;
    tip.innerHTML=`<div class="d">${dstr}</div>
      <div>始 ${f(c.open)}　高 ${f(c.high)}</div>
      <div>安 ${f(c.low)}　終 <span class="c ${up?'up':'down'}">${f(c.close)}</span></div>`;
    tip.style.display='block';
    let tx=cx+14; if(tx+170>rect.width)tx=cx-176; tip.style.left=Math.max(4,tx)+'px'; tip.style.top='10px';
  };
  cv.onpointermove=move;
  cv.onpointerdown=move;
  cv.onpointerleave=()=>{line.style.display='none';tip.style.display='none';};
}
function verdictNote(a){

function factorsHTML(s){

}
function metricsHTML(a){
  const s=a.signal;
  const rows=[['時価総額',fmtCap(a.price*a.shares,a.currency)],['RSI(14)',fmtNum(s.rsi,1)],

      <div id="mAddResults" class="modal-results"></div>

/* ============================================================
   SEARCH (header)
   ============================================================ */
function wireSearch(){
  const inp=$('#searchInput'),res=$('#searchResults');let act=-1,rows=[];
  const close=()=>{res.classList.remove('open');act=-1;};
  inp.addEventListener('input',()=>{
    const q=inp.value.trim(); if(!q){close();return;}
    rows=searchUniverse(q).filter(inRegion).slice(0,8);
    if(!rows.length)rows=searchUniverse(q).slice(0,8);
    res.innerHTML=rows.length?rows.map((a,i)=>`<div class="sr-row" data-idx="${i}">
      <span class="tk">${a.ticker}</span><span class="nm">${a.name}</span><span class="px mono">${fmtPrice(a.price,a.currency)}</span></div>`).join('')
      :'<div class="sr-empty">一致する銘柄がありません</div>';
    res.classList.add('open');act=-1;
    $$('.sr-row',res).forEach(r=>r.onclick=()=>{go('stock',rows[+r.dataset.idx].ticker);inp.value='';close();});
  });
  inp.addEventListener('keydown',e=>{
    const items=$$('.sr-row',res); if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%items.length;}
    else if(e.key==='ArrowUp'){e.preventDefault();act=(act-1+items.length)%items.length;}
    else if(e.key==='Enter'&&act>=0){go('stock',rows[act].ticker);inp.value='';close();return;}
    else if(e.key==='Escape'){close();return;}
    items.forEach((it,i)=>it.classList.toggle('active',i===act));
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))close();});
}

function updateDataStatus(){
  updateLoadBar();
  const b=$('#dataStatus'),l=$('#dataLabel'); if(!b)return;
  b.classList.remove('on','sim');
  if(UI.assetsLoading){ const p=UI.loadProgress; l.textContent='読込 '+(p.ok||0)+'件 ('+loadPct()+'%)'; b.classList.add('sim'); }
  else if(UI.liveBusy||UI.dataState==='loading'){ l.textContent='取得中…'; b.classList.add('sim'); }
  else if(UI.dataState==='ok'){ l.textContent='実データ ('+dataSourceLabel()+')'; b.classList.add('on'); }
  else { l.textContent='取得失敗・再取得'; }
}
function setRegion(r){
  Store.region=r; saveStore();
  $$('#regionSeg button').forEach(b=>b.classList.toggle('on',b.dataset.region===r));
  renderCurrent();
}

/* ============================================================
   WIRING
   ============================================================ */
function escapeHTML(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function wire(){
  $$('.nav-item').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view)));
  $$('#mobnav button').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view)));
  $('#regionSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRegion(b.dataset.region);});
  $('#dataStatus').addEventListener('click',reloadData);
  $('#notifBtn').addEventListener('click',()=>go('notifications'));
  $('#settingsBtn').addEventListener('click',()=>go('settings'));
  wireSearch();

  // delegated clicks across views + modals
  document.body.addEventListener('click',e=>{
    const t=e.target;
    const go_=t.closest('[data-go]'); if(go_&&!t.closest('[data-rm],[data-mark],.del-x,[data-rmtarget]')){go('stock',go_.dataset.go);return;}
    const vl=t.closest('[data-view-link]'); if(vl){go(vl.dataset.viewLink);return;}
    const sl=t.closest('[data-view-link="signals"],[data-view-link]'); // handled above
    const open=t.closest('[data-open]'); if(open){const k=open.dataset.open;
      if(k==='addstock')modalAddStock(); else if(k==='newlist')modalNewList();
      else if(k==='settarget')modalSetTarget(); else if(k==='keys')modalKeys();
      else if(k==='live')reloadData();
      else if(k==='managelist')go('settings'); return;}
    if(t.closest('[data-close]')){closeModal();return;}
    const tab=t.closest('[data-list-tab]'); if(tab){Store.activeList=tab.dataset.listTab;saveStore();renderWatchlist();return;}
    const rm=t.closest('[data-rm]'); if(rm){removeFromList(rm.dataset.rm,rm.dataset.list);return;}
    const mark=t.closest('[data-mark]'); if(mark){toggleMark(mark.dataset.mark);return;}
    const aw=t.closest('[data-addwatch]'); if(aw){addToList(aw.dataset.addwatch);renderStock();return;}
    const add=t.closest('[data-add]'); if(add){addToList(add.dataset.add);closeModal();renderCurrent();return;}
    const rmt=t.closest('[data-rmtarget]'); if(rmt){const tk=rmt.dataset.tk;Store.targets[tk]=(Store.targets[tk]||[]).filter(x=>x.id!==rmt.dataset.rmtarget);saveStore();renderStock();return;}
    const rnl=t.closest('[data-renamelist]'); if(rnl){modalRenameList(rnl.dataset.renamelist);return;}
    const rns=t.closest('[data-renamesave]'); if(rns){const l=listById(rns.dataset.renamesave);const v=$('#mListName').value.trim();if(l&&v){l.name=v;saveStore();}closeModal();renderCurrent();return;}
    const dll=t.closest('[data-dellist]'); if(dll){if(Store.lists.length>1){Store.lists=Store.lists.filter(l=>l.id!==dll.dataset.dellist);if(Store.activeList===dll.dataset.dellist)Store.activeList=Store.lists[0].id;saveStore();renderCurrent();}return;}
    const rng=t.closest('[data-range]'); if(rng){UI.stockRange=rng.dataset.range;$$('#rangeSeg .rng').forEach(x=>x.classList.toggle('on',x===rng));
      const a=UI.indexView?Market.indices[UI.indexView]:getAsset(UI.current);
      if(a){ ensureRange(a,UI.stockRange,()=>drawChart(a)); drawChart(a); } return;}
    // modal action buttons
    if(t.id==='mCustomAdd'){addCustom();return;}
    if(t.id==='mListCreate'){const v=$('#mListName').value.trim();if(v){const id=uid('l');Store.lists.push({id,name:v,tickers:[]});Store.activeList=id;saveStore();}closeModal();go('watchlist');return;}
    if(t.id==='mTgtSave'){saveTarget();return;}
    if(t.id==='mKeySave'){saveKeys();return;}
    if(t.id==='newsRefresh'){renderNews();return;}
    if(t.id==='clearAlerts'){Store.alerts=[];saveStore();renderNotifications();updateNotifBadge();return;}
    if(t.id==='resetAll'){if(confirm('すべての設定を初期化しますか？')){try{localStorage.removeItem(PKEY);}catch(e){}location.reload();}return;}
    if(t.id==='reloadDataBtn'){reloadData();return;}
    if(t.id==='notifPermBtn'){requestNotifPerm();return;}
    const ssort=t.closest('#screenSortSeg button'); if(ssort){UI.screenSort=ssort.dataset.sort;renderScreen();
      if(ssort.dataset.sort==='dividend')loadScreenDividends(); return;}
    const ixc=t.closest('[data-index]'); if(ixc){UI.indexView=ixc.dataset.index;UI.current=null;UI.view='stock';
      $$('.view').forEach(v=>v.classList.remove('active'));$('#view-stock').classList.add('active');
      $$('.nav-item,#mobnav button').forEach(n=>n.classList.remove('active','on'));
      renderStock();$('#main').scrollTop=0;return;}
    const nseg=t.closest('#newsSeg button'); if(nseg){UI.newsTab=nseg.dataset.news;renderNews();return;}
    const setReg=t.closest('#setRegionSeg button'); if(setReg){setRegion(setReg.dataset.region);renderSettings();return;}
    const setScope=t.closest('#setScopeSeg button'); if(setScope){Store.primeScope=setScope.dataset.scope;saveStore();renderSettings();
      toast(Store.primeScope==='all'?'東証プライム全銘柄を読み込みます（時間がかかります）':'主要銘柄のみに切替');reloadData();return;}
    const setProv=t.closest('#setProviderSeg button'); if(setProv){Store.provider=setProv.dataset.provider;saveStore();updateDataStatus();
      renderSettings(); toast(Store.provider==='yahoo'?'取得元を Yahoo Finance（キー不要）に設定':'取得元を Twelve Data に設定');
      reloadData(); return;}
    const mr=t.closest('[data-add]'); // results in modal handled above
  });
  $('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal();});
  // チャート期間ドロップダウン（スマホ）
  document.body.addEventListener('change',e=>{
    if(e.target&&e.target.id==='rangeSelect'){
      UI.stockRange=e.target.value;
      $$('#rangeSeg .rng').forEach(x=>x.classList.toggle('on',x.dataset.range===UI.stockRange));
      const a=UI.indexView?Market.indices[UI.indexView]:getAsset(UI.current);
      if(a){ ensureRange(a,UI.stockRange,()=>drawChart(a)); drawChart(a); }
    }
  });

  // clock + market status
  function clock(){
    const now=new Date();
    const ct=$('#clockTime'),cd=$('#clockDate');
    if(ct)ct.textContent=now.toLocaleTimeString('ja-JP');
    if(cd)cd.textContent=now.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'});
    const day=now.getDay(),h=now.getHours(),m=now.getMinutes(),hm=h*60+m;
    const open=day>=1&&day<=5&&((hm>=540&&hm<690)||(hm>=750&&hm<900));
    const p=$('#mktPulse'),s=$('#mktStatus');
    if(p)p.classList.toggle('closed',!open);
    if(s)s.textContent=open?'東証 取引時間中':'東証 時間外';
  }
  clock(); setInterval(clock,1000);

  // 実データの定期更新（約60秒ごとに最新値をポーリング）
  let qTick=0;
  setInterval(()=>{
    if(document.hidden)return;
    qTick++; if(qTick%30===0)liveQuotePoll();
  },2000);

  window.addEventListener('resize',()=>{if(UI.view==='stock'){const a=UI.indexView?Market.indices[UI.indexView]:getAsset(UI.current);if(a)drawChart(a);}});
}

function addCustom(){
  const tk=($('#mCustomTk').value||'').trim().toUpperCase(); if(!tk)return;
  const mkt=$('#mCustomMkt').value;
  if(!getAsset(tk)){
    const cur=mkt==='jp'?'JPY':'USD', market=mkt==='jp'?'東証':'US';
    const def=[tk,tk,market,cur,0,'—',0.3,0.05,1e9];
    Store.custom.push(def); saveStore(); ensureAsset(def);
  }
  addToList(tk); closeModal(); go('stock',tk);
  scheduleSeries(tk); // 実データを取得
}
function saveTarget(){
  const a=getAsset(UI.current); if(!a)return;
  const price=parseFloat($('#mTgtPrice').value); if(!price){toast('価格を入力してください');return;}
  const dir=$('#mTgtDir').value, note=$('#mTgtNote').value.trim();
  Store.targets[a.ticker]=Store.targets[a.ticker]||[];
  Store.targets[a.ticker].push({id:uid('t'),price,dir,note,done:false});
  saveStore(); closeModal(); renderStock(); toast('目標株価アラートを設定しました');
}
function saveKeys(){
  const prevSrc=dataSource();
  const su=$('#mServerUrl'); if(su)Store.serverUrl=(su.value||'').trim();
  Store.keys.td=($('#mKeyTd').value||'').trim();
  Store.keys.fh=($('#mKeyFh').value||'').trim();
  saveStore(); closeModal(); updateDataStatus();
  toast('データ接続設定を保存しました');
  // ソースが変わった or サーバー/TDが使えるようになったら再取得
  if(dataSource()!==prevSrc || (dataSource()==='server') || (Store.provider==='twelvedata'&&Store.keys.td)) reloadData();
  else renderCurrent();
}

/* ============================================================
   SPLASH (NGX → Magical Future → MagiFinance ロゴ + ロードバー)
   ============================================================ */
function showSplashMF(onDone){
  const css=`
  #mf-splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(1200px 600px at 80% -10%,rgba(82,214,232,.07),transparent 60%),radial-gradient(900px 500px at -5% 110%,rgba(242,184,75,.06),transparent 55%),#0B0E14;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease}
  #mf-splash.out{opacity:0;pointer-events:none}
  #mf-splash .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  #mf-splash .intro{justify-content:space-between;gap:18px;padding:9vh 24px}
  #mf-splash .intro.in{opacity:1}
  #mf-splash .intro.out{opacity:0;transition:opacity .5s ease}
  #mf-splash .logo{width:min(620px,90vw);border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:26px 34px}
  #mf-splash .logo img{max-width:100%;max-height:22vh;object-fit:contain;display:block}
  #mf-splash .ngx{background:#000}
  #mf-splash .mf{background:#fff}
  #mf-splash .intro.in .ngx{animation:mfUp .8s cubic-bezier(.2,.7,.3,1) both}
  #mf-splash .intro.in .mf{animation:mfDown .8s cubic-bezier(.2,.7,.3,1) .12s both}
  #mf-splash .amp{color:#586079;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;opacity:.55}
  #mf-splash .main{gap:28px}
  #mf-splash .main.in{opacity:1;animation:mfIn .6s ease}
  #mf-splash .applogo img{width:min(340px,72vw);max-height:30vh;object-fit:contain;border-radius:26px;filter:drop-shadow(0 14px 50px rgba(242,184,75,.4))}
  #mf-splash .wm{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:.5px;color:#E7EBF3}
  #mf-splash .wm span{color:#F2B84B}
  #mf-splash .bar{width:min(340px,72vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #mf-splash .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F2B84B,#52D6E8)}
  #mf-splash .cap{color:#6B7589;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.28em}
  #mf-splash .tx{font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:.12em}
  #mf-splash .tx.gold{color:#e9b13c;font-size:46px}
  #mf-splash .tx.mfx{font-size:34px;background:linear-gradient(90deg,#3a5bff,#e83e8c);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes mfUp{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:none}}
  @keyframes mfDown{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  @keyframes mfIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){#mf-splash *{animation:none!important}}`;
  const s=document.createElement('style'); s.textContent=css; document.head.appendChild(s);
  const el=document.createElement('div'); el.id='mf-splash';
  el.innerHTML=`
    <div class="ph intro" id="mfIntro">
      <div class="logo ngx"><img src="../brand/NGX.png" alt="NGX" onerror="this.outerHTML='<span class=&quot;tx gold&quot;>NGX</span>'"></div>
      <div class="amp">×</div>
      <div class="logo mf"><img src="../brand/MagicalFuture.png" alt="Magical Future" onerror="this.outerHTML='<span class=&quot;tx mfx&quot;>Magical Future</span>'"></div>
    </div>
    <div class="ph main" id="mfMain">
      <div class="applogo"><img src="../thumbs/MagiFinance.jpg" alt="MagiFinance" onerror="this.remove()"></div>
      <div class="wm">Magi<span>Finance</span></div>
      <div class="bar"><i id="mfFill"></i></div>
      <div class="cap">Loading market data ...</div>
    </div>`;
  document.body.appendChild(el);
  const intro=el.querySelector('#mfIntro'), main=el.querySelector('#mfMain'), fill=el.querySelector('#mfFill');
  const P1_IN=120,P1_HOLD=1500,P1_OUT=550,P2_BAR=1900,P2_END=250;
  const p2=P1_IN+P1_HOLD+P1_OUT;
  setTimeout(()=>intro.classList.add('in'),P1_IN);
  setTimeout(()=>intro.classList.add('out'),P1_IN+P1_HOLD);
  setTimeout(()=>{ main.classList.add('in'); fill.style.transition='width '+P2_BAR+'ms ease'; setTimeout(()=>fill.style.width='100%',60); },p2);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); if(onDone)onDone(); },600); },p2+P2_BAR+P2_END);
}
