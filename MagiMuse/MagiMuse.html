<title>MagiMuse — 物語 × 勉強部</title>
<meta name="description" content="本気の勉強で物語が進む。海辺の学園を舞台にした、美少女ゲーム×学習管理アプリ。">
<link rel="icon" href="../thumbs/MagiMuse.jpg">
<link rel="apple-touch-icon" href="../thumbs/MagiMuse.jpg">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ════════ MagiMuse — 夏の学園ノベル×スタディ（オリジナルテーマ） ════════ */
:root{
  --bg:#f8f6ff; --card:#ffffff; --ink:#2c2a4a; --ink2:#6b6890; --faint:#a8a5c8;
  --navy:#20306b; --pink:#ff6b8f; --gold:#ffab17; --sky:#5b8bff; --mint:#3ad6a5;
  --grad:linear-gradient(120deg,#5b8bff,#9b5bff 55%,#ff6b8f);
  --line:rgba(91,107,255,.16); --shadow:0 10px 28px rgba(60,60,140,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.75;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}

/* ── 特殊ロゴ演出（粒子がロゴに集まる） ── */
#intro{position:fixed;inset:0;z-index:99999;background:#070a1c;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .in-cap{position:absolute;bottom:12vh;left:0;right:0;text-align:center;color:#8fa0d8;font-size:12px;letter-spacing:.3em;opacity:0;transition:opacity 1s}
#intro .in-cap.show{opacity:1}

/* ── タップしてスタート（MagiLex と同一デザインに統一） ── */
#mmHome{position:fixed;inset:0;z-index:8500;display:none;overflow:hidden;cursor:pointer;color:#eef6ff;
  background:linear-gradient(180deg,#20306b 0%,#4a5fae 55%,#ff9d6b 100%)}
#mmHome.open{display:block}
#mmHome .mm-kv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#mmHome .mm-kv img{width:min(340px,70vw);border-radius:32px;box-shadow:0 24px 80px rgba(10,16,53,.6);animation:mmFloat 5s ease-in-out infinite}
@keyframes mmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#mmHome .mm-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:mmTw 2.4s ease-in-out infinite}
#mmHome .mm-center{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:6px}
#mmHome .ml-tap{font-size:19px;font-weight:900;letter-spacing:.14em;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:mlTap 1.6s ease-in-out infinite}
@keyframes mlTap{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes mmTw{0%,100%{opacity:.15}50%{opacity:.85}}
#mmHome .ml-line{width:170px;height:2px;background:linear-gradient(90deg,transparent,#9ecbff,transparent)}
#mmHome .ml-sub{font-size:10px;font-weight:700;letter-spacing:.4em;opacity:.85}

/* ── レイアウト ── */
#top{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1.5px solid var(--line)}
#top .logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#top .logo img{width:30px;height:30px;border-radius:9px}
#top .logo b{font-size:15px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pill{display:flex;align-items:center;gap:5px;border-radius:99px;padding:5px 11px;font-weight:900;font-size:12px}
.pill.mp{background:#eef2ff;border:1.5px solid rgba(91,139,255,.4);color:#2c4ab8}
.pill.xv{background:#fff7e8;border:1.5px solid rgba(255,171,23,.4);color:#7a5300}
.pill img{width:14px;height:14px}
main.view{display:none;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 70px) 14px calc(92px + env(safe-area-inset-bottom,0px))}
main.view.on{display:block}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;background:none;border:none;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:800;color:#b0aecb}
#nav button .em{font-size:20px;opacity:.65}
#nav button.on{color:#5b6bff}
#nav button.on .em{opacity:1}

.h1{font-size:17px;font-weight:900;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.h1::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--grad)}
.hint{font-size:11px;color:var(--ink2);line-height:1.7}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:15px;margin-bottom:13px}
.card-t{font-size:13.5px;font-weight:900;margin-bottom:10px}
.card-t small{font-weight:700;color:var(--faint);font-size:10px;margin-left:6px}

/* ── ホーム ── */
.hero-card{border-radius:22px;background:linear-gradient(120deg,#20306b,#4a5fae 60%,#7546a0);color:#fff;padding:18px;margin-bottom:13px;position:relative;overflow:hidden}
.hero-card::after{content:'🌙';position:absolute;right:14px;top:10px;font-size:30px;opacity:.5}
.hc-hi{font-size:11px;opacity:.85;font-weight:700}
.hc-nm{font-size:19px;font-weight:900;margin:1px 0 8px}
.hc-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:800}
.map-card{background:linear-gradient(180deg,#0e1637,#1c2647);border-color:rgba(124,196,255,.25)}
.map-card .card-t{color:#dfe8ff}
.map-card .hint{color:#8fa0d8}
.starmap{width:100%;display:block}
.starmap .edge{stroke:rgba(124,196,255,.18);stroke-width:.5}
.starmap .edge.lit{stroke:rgba(255,220,130,.7);stroke-width:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.big-act{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;border-radius:20px;padding:16px 8px;color:#fff;font-weight:900;font-size:14.5px;box-shadow:var(--shadow)}
.big-act span{font-size:26px}
.big-act small{font-size:10px;font-weight:800;opacity:.85}
.big-act.study{background:linear-gradient(130deg,#3ad6a5,#12b5a5)}
.big-act.story{background:linear-gradient(130deg,#9b5bff,#ff6b8f)}
.prologue-bn{width:100%;border:none;border-radius:18px;padding:14px;background:var(--grad);color:#fff;font-weight:900;font-size:14px;margin-bottom:13px;animation:mlTap 2s ease-in-out infinite}
.note-card b{font-size:12.5px}
.note-card p{font-size:11px;color:var(--ink2);margin-top:5px}

/* ── ストーリー ── */
.route-card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:13px;overflow:hidden}
.rc-head{display:flex;gap:12px;padding:13px;align-items:center;border-bottom:1.5px dashed var(--line);position:relative}
.rc-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.rc-head img{width:64px;height:64px;border-radius:16px;object-fit:cover;border:2.5px solid var(--c)}
.rc-info{flex:1;min-width:0}
.rc-info b{font-size:15px}
.rc-role{display:block;font-size:10.5px;color:var(--ink2);font-weight:700}
.rc-aff{display:block;font-size:10.5px;color:var(--pink);font-weight:800}
.rc-star{font-size:10.5px;font-weight:800;color:#8a6a10}
.own{flex:none;font-size:10px;font-weight:900;color:#0b6b48;background:rgba(58,214,165,.15);border-radius:99px;padding:3px 10px}
.own.no{color:var(--faint);background:rgba(168,165,200,.15)}
.rc-chs{display:flex;flex-direction:column}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 14px;border:none;background:#fff;font-size:12.5px;font-weight:800;border-bottom:1px solid var(--line);text-align:left}
.ch:last-child{border-bottom:none}
.ch .cb{flex:none;font-size:11px;font-weight:900;border-radius:99px;padding:3px 10px}
.ch.ready .cb{background:var(--grad);color:#fff}
.ch.done{color:var(--ink2)}
.ch.done .cb{background:#e8f8f0;color:#0b6b48}
.ch.locked{color:var(--faint);background:#fafafd}
.ch.locked .cb{background:#eeeef6;color:var(--faint)}

/* ── VNプレイヤー ── */
#vn{position:fixed;inset:0;z-index:9000;display:none;background:linear-gradient(180deg,#ff9d6b,#ff6b8f,#5b3fa0);transition:background 1.2s}
#vn.on{display:block}
#vn-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.vn-chara{max-height:74svh;max-width:88vw;object-fit:contain;filter:drop-shadow(0 14px 40px rgba(0,0,0,.4));animation:vnIn .5s ease both;margin-bottom:16svh}
@keyframes vnIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#vn-box{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);cursor:pointer}
#vn-name{display:none;position:relative;z-index:2;margin-left:14px;margin-bottom:-11px;background:#5b6bff;color:#fff;font-weight:900;font-size:13px;border-radius:12px 12px 12px 0;padding:4px 16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#vn-text{position:relative;background:rgba(16,14,40,.86);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.2);color:#fff;
  border-radius:18px;padding:20px 18px 26px;min-height:108px;font-size:15px;line-height:2;font-family:'Kiwi Maru','Noto Sans JP',serif}
#vn-text.narr{color:#cdd8ff;font-style:normal}
#vn-text::after{content:'▼';position:absolute;right:14px;bottom:8px;font-size:11px;color:#9ecbff;animation:mlTap 1.4s infinite}
#vn-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}
#vn-prog{background:rgba(16,14,40,.6);color:#cdd8ff;font-size:11px;font-weight:800;border-radius:99px;padding:5px 13px}
#vn-skip{background:rgba(16,14,40,.6);border:none;color:#cdd8ff;font-size:11px;font-weight:800;border-radius:99px;padding:5px 13px}

/* ── 勉強 ── */
.subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.subj{display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid var(--line);border-radius:15px;padding:10px 4px;background:#fff;font-size:12px}
.subj small{font-size:9.5px;color:var(--faint);font-weight:800}
.subj .se{font-size:19px}
.subj.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.dur-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dur{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;padding:10px 4px;background:#fff;font-size:14px;font-weight:900}
.dur small{font-size:9.5px;color:var(--faint);font-weight:800}
.dur.on{border-color:#5b8bff;background:#eef2ff;color:#2c4ab8}
.start-btn{width:100%;border:none;border-radius:18px;padding:16px;background:linear-gradient(130deg,#3ad6a5,#12b5a5);color:#fff;font-weight:900;font-size:15.5px;box-shadow:0 10px 26px rgba(18,181,165,.3);margin-bottom:10px}
.ses-card{background:var(--card);border:2px solid var(--c);border-radius:24px;box-shadow:var(--shadow);padding:22px 16px;text-align:center}
.ses-hero{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--c);margin-bottom:8px}
.ses-subj{font-size:12.5px;font-weight:900;color:var(--ink2)}
.ses-time{font-size:54px;font-weight:900;letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.ses-bar{height:10px;border-radius:99px;background:#eeeef6;overflow:hidden;margin:8px 0 12px}
.ses-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width 1s linear}
.ses-cheer{font-size:13px;font-weight:800;color:var(--pink);margin-bottom:12px;font-family:'Kiwi Maru',serif}
.ses-btns{display:flex;gap:10px;justify-content:center}
.ghost{border:2px solid var(--line);background:#fff;border-radius:13px;padding:11px 18px;font-weight:800;font-size:13px;color:var(--ink2)}
.primary{border:none;background:var(--grad);color:#fff;border-radius:13px;padding:12px 28px;font-weight:900;font-size:14px}
.ses-done-t{font-size:19px;font-weight:900;margin-bottom:4px}
.rw-box{background:#f6f7ff;border:1.5px solid var(--line);border-radius:15px;padding:12px;margin:10px 0 14px;text-align:left}
.rw-row{font-size:13px;font-weight:800;padding:3px 0}
.rw-row b{color:#2c4ab8}

/* ── キャラ ── */
.prof-card{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:18px;box-shadow:var(--shadow);padding:13px;margin-bottom:12px}
.prof-card img{width:78px;height:78px;border-radius:16px;object-fit:cover;flex:none;border:2.5px solid var(--c)}
.prof-card img.gray{filter:grayscale(.9) brightness(.8)}
.prof-nm{font-size:15px;font-weight:900}
.prof-ssr{font-size:9px;font-weight:900;color:#c98a10;border:1.5px solid rgba(255,171,23,.5);border-radius:6px;padding:1px 6px;vertical-align:2px}
.prof-lock{font-size:10px;color:var(--faint);font-weight:800}
.prof-role{font-size:10.5px;color:var(--ink2);font-weight:800}
.prof-like{font-size:10.5px;color:var(--faint);font-weight:700}
.prof-bio{font-size:11.5px;color:var(--ink2);margin-top:5px}
.prof-aff{font-size:11px;font-weight:900;color:var(--pink);margin-top:5px}
.cameo{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.cameo:last-child{border-bottom:none}
.cameo img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.cameo b{font-size:12.5px}
.cameo small{margin-left:6px;color:var(--faint);font-weight:800;font-size:10px}
.cameo p{font-size:10.5px;color:var(--ink2)}

/* ── 記録 ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:11px 4px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px}
.stat span{font-size:9.5px;color:var(--faint);font-weight:800}
.week{display:flex;gap:7px;align-items:flex-end;height:120px}
.wbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.wbar i{width:70%;border-radius:6px 6px 0 0;background:var(--grad);min-height:2px}
.wbar .wv{font-size:8.5px;color:var(--ink2);font-weight:800;position:absolute;top:0}
.wbar .wd{font-size:9px;color:var(--faint);font-weight:800;margin-top:3px}
.subj-row{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;padding:5px 0}
.subj-row span{flex:none;width:74px}
.subj-row .sbar{flex:1;height:9px;border-radius:99px;background:#eeeef6;overflow:hidden}
.subj-row .sbar i{display:block;height:100%;border-radius:99px}
.subj-row b{flex:none;font-size:11px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:#20306b;color:#fff;font-size:12.5px;font-weight:800;border-radius:99px;padding:10px 20px;opacity:0;pointer-events:none;transition:.3s;z-index:9500;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:900px){main.view{max-width:720px}}
</style>
</head>
<body>

<!-- ═══ 特殊ロゴ演出: 星屑がロゴに集まる ═══ -->
<div id="intro">
  <canvas id="in-cv"></canvas>
  <div class="in-cap" id="in-cap">MAGIMUSE — A SUMMER OF STARS AND STUDY</div>
</div>

<!-- ═══ タップしてスタート（MagiLex式） ═══ -->
<div id="mmHome" onclick="mmHomeTap()">
  <div class="mm-stars" id="mm-stars"></div>
  <div class="mm-kv"><img src="../thumbs/MagiMuse.jpg" alt="MagiMuse"></div>
  <div class="mm-center">
    <div class="ml-tap">タップしてスタート</div>
    <div class="ml-line"></div>
    <div class="ml-sub">TAP TO START</div>
  </div>
</div>

<!-- ═══ 本体 ═══ -->
<header id="top">
  <div class="logo"><img src="../thumbs/MagiMuse.jpg" alt=""><b>MagiMuse</b></div>
  <div class="pill mp">🌟 <span id="topMp">0</span> MP</div>
  <div class="pill xv"><img src="../XEVA.png" alt="">​<span id="topXeva">0</span></div>
</header>

<main class="view on" id="v-home"></main>
<main class="view" id="v-story"></main>
<main class="view" id="v-study"></main>
<main class="view" id="v-chars"></main>
<main class="view" id="v-log"></main>

<nav id="nav">
  <button data-v="home" class="on" onclick="go('home')"><span class="em">🏠</span>ホーム</button>
  <button data-v="story" onclick="go('story')"><span class="em">📖</span>ストーリー</button>
  <button data-v="study" onclick="go('study')"><span class="em">✏️</span>べんきょう</button>
  <button data-v="chars" onclick="go('chars')"><span class="em">💗</span>キャラ</button>
  <button data-v="log" onclick="go('log')"><span class="em">📊</span>記録</button>
</nav>

<!-- ═══ VNプレイヤー ═══ -->
<div id="vn">
  <div id="vn-stage"></div>
  <div id="vn-top"><span id="vn-prog"></span><button id="vn-skip" onclick="vnSkip()">スキップ ≫</button></div>
  <div id="vn-box" onclick="vnNext()">
    <span id="vn-name"></span>
    <div id="vn-text"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../xeva.js?v=34"></script>
<script src="../xeva-loading.js?v=1" defer></script>
<script>
/* ═══ 特殊ロゴ演出: MagiMuse.png のピクセルへ星屑パーティクルが集結する ═══ */
(function () {
  var cv = document.getElementById("in-cv"), ctx = cv.getContext("2d");
  var W = cv.width = innerWidth, H = cv.height = innerHeight;
  var parts = [], img = new Image(), started = performance.now();
  var DUR = 2600, HOLD = 1400;

  function fallback() { finish(); }
  function finish() {
    var el = document.getElementById("intro");
    el.classList.add("out");
    setTimeout(function () { el.remove(); }, 750);
    /* タップしてスタート（セッションにつき1回） */
    var accessed = false;
    try { accessed = sessionStorage.getItem("mm_accessed_v1") === "1"; } catch (e) {}
    if (!accessed) document.getElementById("mmHome").classList.add("open");
  }
  img.onload = function () {
    /* ロゴを縮小サンプリングして粒子の目標座標をつくる */
    var ow = Math.min(300, W * 0.7), oh = ow * (img.height / img.width);
    var off = document.createElement("canvas");
    var sc = 0.25;   // サンプリング解像度
    off.width = Math.round(ow * sc); off.height = Math.round(oh * sc);
    var og = off.getContext("2d");
    og.drawImage(img, 0, 0, off.width, off.height);
    var data = og.getImageData(0, 0, off.width, off.height).data;
    var x0 = (W - ow) / 2, y0 = (H - oh) / 2 - H * 0.04;
    for (var y = 0; y < off.height; y += 2) {
      for (var x = 0; x < off.width; x += 2) {
        var i = (y * off.width + x) * 4;
        if (data[i + 3] > 120) {
          parts.push({
            sx: Math.random() * W, sy: Math.random() * H,
            tx: x0 + x / sc, ty: y0 + y / sc,
            c: "rgb(" + data[i] + "," + data[i + 1] + "," + data[i + 2] + ")",
            d: Math.random() * 0.35,
          });
        }
      }
    }
    if (!parts.length) return fallback();
    requestAnimationFrame(tick);
    setTimeout(function () { document.getElementById("in-cap").classList.add("show"); }, DUR * 0.7);
    setTimeout(finish, DUR + HOLD);
  };
  img.onerror = fallback;
  img.src = "../thumbs/MagiMuse.jpg";

  function ease(t) { return 1 - Math.pow(1 - t, 3); }
  function tick(now) {
    var t = (now - started) / DUR;
    ctx.fillStyle = "rgba(7,10,28,.35)"; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var q = Math.max(0, Math.min(1, (t - p.d) / (1 - p.d)));
      var e = ease(q);
      var x = p.sx + (p.tx - p.sx) * e, y = p.sy + (p.ty - p.sy) * e;
      ctx.fillStyle = p.c;
      ctx.fillRect(x, y, 2.4, 2.4);
    }
    if (t < 1.4) requestAnimationFrame(tick);
    else { /* 完成後は静止画のまま輝きを足す */
      ctx.fillStyle = "rgba(255,255,255,.03)"; ctx.fillRect(0, 0, W, H);
    }
  }
})();

/* ═══ タップしてスタート ═══ */

  var host = document.getElementById("mm-stars");
  for (var i = 0; i < 26; i++) {

    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 60 + "%";
    s.style.animationDelay = (Math.random() * 2.4) + "s";
    host.appendChild(s);
  }
  window.mmHomeTap = function () {
    try { sessionStorage.setItem("mm_accessed_v1", "1"); } catch (e) {}
    var h = document.getElementById("mmHome");
    h.style.transition = "opacity .55s"; h.style.opacity = "0";
    setTimeout(function () { h.classList.remove("open"); h.style.opacity = ""; h.style.transition = ""; }, 560);
  };
})();
