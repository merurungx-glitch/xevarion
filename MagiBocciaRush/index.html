<div id="boot">

  <div class="kvbg"></div>
  <div class="kv"></div>
  <div class="scrim"></div>
  <div class="tap" hidden>TAP TO START</div>
  <div class="ld"><i></i></div>
</div>

<!-- ═══════════════ 上のバー ═══════════════ -->
<header id="top">
  <a class="tb" href="../index.html" aria-label="XEVARION" title="XEVARION">←</a>
  <div class="lg"><div><div class="mk">Magi</div><div class="sb">BOCCIA RUSH</div></div></div>
  <span class="rk" id="topRank"></span>
  <button class="tb" data-a="rule" title="RULE BOOK">?</button>
  <button class="tb" data-a="settings" title="SETTINGS">⚙</button>
</header>

<!-- ═══════════════ 画面 ═══════════════ -->
<main>
  <section class="scr on" id="s-home"></section>
  <section class="scr" id="s-play"></section>
  <section class="scr" id="s-team"></section>

<div id="recon" hidden></div>

<!-- ★ アカウント同期（戦績・編成・熟練度は mbr_v1。xeva-keys.js に登録ずみ） -->
<script type="module" src="../xeva-cloud.js?v=33"></script>

<script src="../xeva.js?v=67"></script>
