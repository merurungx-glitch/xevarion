<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../maintenance-gate.js?v=7"></script>
<meta charset="UTF-8" />
<script>(function(){try{var a=JSON.parse(localStorage.getItem('xeva_account_v1'));if(!a||!a.setupDone)location.replace('../index.html');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>MagiDiamond — 版をえらぶ</title>
<meta name="description" content="集めたキャラクターで、野球を極めろ。MagiOne シリーズ / XEVARION。" />
<link rel="icon" href="../thumbs/MagiDiamond.jpg" type="image/png" />
<link rel="apple-touch-icon" href="../thumbs/MagiDiamond.jpg" />
<meta name="theme-color" content="#0b1226" />
<style>
/* ══════════════════════════════════════════════════════════════
   ★★ 2026-08-30 MagiDiamond の入口（ご指定）
   ------------------------------------------------------------
   アプリを開いたら、まず<b>最新版</b>と<b>過去版</b>のどちらで遊ぶかをえらぶ。
   ・最新版 … latest.html（キャラクター野球ゲームとして作り直したもの）
   ・過去版 … classic.html（これまでの「読み合い野球盤」。<b>そのまま残す</b>）
   ★ えらんだ版は覚えておき、次からは「前回の続き」を大きく出す。
     ただし<b>いつでももう一方へ移れる</b>ようにしておくこと（片道にしない）。
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(120% 90% at 50% -10%, #24407e 0%, rgba(36,64,126,0) 60%),
    radial-gradient(90% 70% at 120% 110%, #6d3fa8 0%, rgba(109,63,168,0) 55%),
    linear-gradient(180deg,#0b1226 0%,#080d1c 100%);
  color:#eaf0ff;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px);
  overflow-x:hidden;
}
/* 背景のダイヤモンド（うっすら） */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background:
    linear-gradient(45deg,transparent 48%, #7fd0ff 49%, #7fd0ff 51%, transparent 52%) 0 0/220px 220px,
    linear-gradient(-45deg,transparent 48%, #ffd257 49%, #ffd257 51%, transparent 52%) 0 0/220px 220px;
}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.back{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#eaf0ff;text-decoration:none;font-size:18px}
.back:active{transform:scale(.94)}
.top .ttl{font-size:12px;letter-spacing:.22em;color:#8fa4d8;font-weight:800}

.hero{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 4px;position:relative;z-index:1}
.hero img{width:min(320px,72vw);border-radius:26px;box-shadow:0 22px 60px rgba(10,20,60,.65), 0 0 0 1px rgba(255,255,255,.08)}
.hero .cap{font-size:12.5px;font-weight:800;letter-spacing:.12em;color:#9fb4e6;text-align:center;line-height:1.7;margin-top:10px}
.hero .cap b{color:#ffd257}

.cards{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:560px;width:100%;margin:14px auto 0;position:relative;z-index:1}
.card{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 16px 15px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  color:inherit;font-family:inherit;text-decoration:none;position:relative;overflow:hidden;
  box-shadow:0 14px 34px rgba(6,12,30,.5);
}
.card:active{transform:scale(.985)}
.card::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.10) 50%,transparent 60%)}
.card.new{border-color:rgba(255,210,87,.55);background:linear-gradient(160deg,rgba(255,210,87,.16),rgba(255,210,87,.03))}
.card .ic{flex:none;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}
.card.new .ic{background:linear-gradient(140deg,#ffd257,#ff9d2e);color:#2a1a00;border-color:rgba(255,210,87,.6)}
.card .bd{flex:1;min-width:0}
.card .nm{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:.02em}
.card .tag{font-size:9.5px;font-weight:900;letter-spacing:.1em;border-radius:99px;padding:3px 8px;
  background:linear-gradient(135deg,#ffd257,#ff9d2e);color:#2a1a00}
.card .tag.old{background:rgba(255,255,255,.16);color:#cfdcff}
.card .sub{margin-top:6px;font-size:12px;font-weight:700;line-height:1.75;color:#b9c8ee}
.card .sub b{color:#ffe9a8}
.card .go{flex:none;align-self:center;font-size:20px;color:#8fa4d8}
.card .last{position:absolute;top:10px;right:12px;font-size:9.5px;font-weight:900;color:#9fb4e6;letter-spacing:.08em}

.note{max-width:560px;width:100%;margin:16px auto 0;font-size:11px;line-height:1.85;color:#8fa4d8;position:relative;z-index:1}
.note b{color:#cfdcff}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="../index.html" aria-label="XEVARION へ戻る">←</a>
  <div class="ttl">MAGIDIAMOND</div>
</div>

<div class="hero">
  <img src="img/logo.webp" alt="MagiDiamond" onerror="this.src='../thumbs/MagiDiamond.jpg'">
  <div class="cap">集めたキャラクターで、野球を極めろ。<br>
    遊ぶ<b>版</b>をえらんでください</div>
</div>

<div class="cards" id="cards">
  <a class="card new" href="latest.html" id="cLatest">
    <span class="ic">⚾</span>
    <span class="bd">
      <span class="nm">最新版 <i class="tag">NEW</i></span>
      <span class="sub">XEVARION の <b>SR・SSR 全キャラクター</b>が野球選手として使えます。<br>
        育成・チーム編成・チームスキル・野球盤の打球処理・オンライン対戦まで。</span>
    </span>
    <span class="go">›</span>
    <span class="last" id="lastLatest"></span>
  </a>
  <a class="card" href="classic.html" id="cClassic">
    <span class="ic">🎲</span>
    <span class="bd">
      <span class="nm">過去版 <i class="tag old">CLASSIC</i></span>
      <span class="sub">これまでの<b>読み合い野球盤</b>。配球と狙いを同時に公開して勝負します。<br>
        1台で2〜6人・オンライン2台・CPU対戦。<b>そのまま遊べます</b>。</span>
    </span>
    <span class="go">›</span>
    <span class="last" id="lastClassic"></span>
  </a>
</div>

<div class="note">
  ※ 版はいつでも切りかえられます。この画面は<b>アプリを開くたび</b>に出ます。<br>
  ※ 最新版と過去版の記録は<b>別々</b>に保存されます（片方で遊んでも、もう片方の続きは消えません）。
</div>

<script>
/* 前回えらんだ版に「前回」の印を付ける（片道にはしない） */
(function () {
  var K = "magidiamond_ver_v1";
  var last = "";
  try { last = localStorage.getItem(K) || ""; } catch (e) {}
  if (last === "latest") document.getElementById("lastLatest").textContent = "前回あそんだ版";
  if (last === "classic") document.getElementById("lastClassic").textContent = "前回あそんだ版";
  function mark(v) { try { localStorage.setItem(K, v); } catch (e) {} }
  document.getElementById("cLatest").addEventListener("click", function () { mark("latest"); });
  document.getElementById("cClassic").addEventListener("click", function () { mark("classic"); });
})();
</script>
<script src="../xeva.js?v=54"></script>
<script src="../game-link.js?v=6"></script>
</body>
</html>
