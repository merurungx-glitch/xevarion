<!-- アクセス画面（タップしてスタート・MagiBurstと同じ流れ。スプラッシュの下に待機） -->
<div id="mlHome" onclick="mlHomeTap()">
  <div class="ml-bg"></div>
  <div class="ml-kv"></div>
  <div class="ml-scrim"></div>
  <div class="ml-center">
    <div class="ml-tap">タップしてスタート</div>
    <div class="ml-line"></div>
    <div class="ml-sub">TAP TO START</div>
  </div>
</div>
<script>
/* アクセス画面: タブ（セッション）につき1回だけ表示。タップでフェードアウトして本体へ */
(function () {
  var KEY = "ml_accessed_v1";
  var accessed = false;
  try { accessed = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
  if (!accessed) document.getElementById("mlHome").classList.add("open");
  window.mlHomeTap = function () {
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    var h = document.getElementById("mlHome");
    h.style.transition = "opacity .55s"; h.style.opacity = "0";
    setTimeout(function () { h.classList.remove("open"); h.style.opacity = ""; h.style.transition = ""; }, 560);
    /* タップしてスタートの後に、AI作成の注意書き→音モード→ガイドを表示する */
    var fire = function () {
      if (window._lexNotices) { var f = window._lexNotices; window._lexNotices = null; f(); }
      else setTimeout(fire, 300);
    };
    setTimeout(fire, 620);
  };
})();
</script>
