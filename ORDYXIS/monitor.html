<style>
  :root{
    --blue:#49a8ff; --orange:#f0a73d; --ink:#1d2533;
    --grad:linear-gradient(90deg,#49a8ff,#a07ae0,#f0a73d);
    --ui-scale:1;   /* TV表示用の文字サイズ倍率 (ヘッダーのA−/A＋で変更) */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    background:#0b0b12;color:#fff;display:flex;flex-direction:column;overflow:hidden;}
  header{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;
    padding:14px;border-bottom:1px solid rgba(255,255,255,.08);}
  header img{height:40px;background:#fff;border-radius:10px;padding:4px 10px;}
  header .ttl{font-size:20px;font-weight:800;letter-spacing:.3em;}
  .voice-ctrl{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:8px;}
  .voice-toggle,.voice-pill{border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    color:#cfd7e6;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;}
  .voice-toggle.on{border-color:rgba(73,168,255,.6);color:#9fc7ff;background:rgba(73,168,255,.12);}
  .voice-pill.zunda{border-color:rgba(126,200,120,.6);color:#bfe8b3;background:rgba(126,200,120,.14);}
  /* 文字サイズ調整 (TV表示用) */
  .size-ctrl{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:8px;}
  .size-ctrl button{border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    color:#cfd7e6;border-radius:99px;width:42px;height:42px;font-size:17px;font-weight:800;
    cursor:pointer;line-height:1;}
  .size-ctrl button:active{background:rgba(255,255,255,.16);}
  .size-ctrl .size-val{font-size:13px;font-weight:800;color:#9aa3b5;min-width:48px;text-align:center;}
  main{flex:1;display:grid;grid-template-columns:1.2fr 1fr;min-height:0;}
  @media(max-aspect-ratio:1/1){main{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr;}}
  section{display:flex;flex-direction:column;padding:22px;min-height:0;}
  section.calling{border-right:1px solid rgba(255,255,255,.08);}
  @media(max-aspect-ratio:1/1){section.calling{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);}}
  section .head{text-align:center;margin-bottom:14px;}
  /* フォントサイズは JS で実ピクセルを算出して CSS 変数に渡す (clamp/vw 非対応の
     TVブラウザでも確実に拡大できるよう、var() のみに依存。古い環境向けに静的px併記)。 */
  section .head .en{font-size:18px;font-size:var(--hd-en);letter-spacing:.4em;color:#8a93a8;}
  section .head .ja{font-size:38px;font-size:var(--hd-ja);font-weight:800;margin-top:4px;}
  section.calling .head .ja{color:#ffc46b;}
  section.waiting .head .ja{color:#7db8ff;}
  .nums{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
    gap:18px;overflow-y:auto;padding:8px;}
  .num{font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;
    border-radius:18px;}
  .calling .num{font-size:150px;font-size:var(--num-calling);padding:18px 30px;color:#ffce7a;
    background:rgba(240,167,61,.1);border:2px solid rgba(240,167,61,.55);
    text-shadow:0 0 28px rgba(240,167,61,.45);animation:glow 1.6s infinite;}
  .calling .num.justcalled{animation:pop .7s ease, glow 1.6s infinite 0.7s;}
  @keyframes glow{50%{box-shadow:0 0 34px rgba(240,167,61,.35);}}
  @keyframes pop{0%{transform:scale(.7);opacity:.2;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .waiting .num{font-size:90px;font-size:var(--num-waiting);padding:12px 22px;color:#9fc7ff;
    background:rgba(73,168,255,.08);border:2px solid rgba(73,168,255,.4);}
  /* 準備中に新しく追加された番号は一瞬強調して、確実に気づけるようにする */
  .waiting .num.justadded{animation:pop .7s ease;border-color:rgba(73,168,255,.95);
    box-shadow:0 0 26px rgba(73,168,255,.55);}
  .none{align-self:center;color:#5a6378;font-size:20px;font-size:var(--none-size);font-weight:700;margin:auto;}
  footer{padding:10px;text-align:center;font-size:13px;color:#8a93a8;
    border-top:1px solid rgba(255,255,255,.08);letter-spacing:.1em;}
  /* 音声を有効化するためのオーバーレイ (ブラウザは初回ユーザー操作後でないと音声を再生できない) */
  .voice-gate{position:fixed;inset:0;z-index:9000;background:rgba(8,9,15,.92);
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px;overflow-y:auto;}
  .voice-gate.hidden{display:none;}
  /* 中身は中央のカードにまとめ、確実に画面中央へ寄せる */
  .voice-gate .vg-card{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;width:100%;max-width:560px;margin:auto;}
  .voice-gate .vg-ic{font-size:64px;line-height:1;}
  .voice-gate h2{font-size:clamp(24px,3vw,40px);font-weight:800;}
  .voice-gate p{color:#9aa3b5;font-size:clamp(14px,1.5vw,20px);line-height:1.8;max-width:460px;}
  .voice-gate button{border:none;border-radius:14px;padding:18px 40px;font-size:clamp(16px,1.8vw,24px);
    font-weight:800;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 10px 30px rgba(73,168,255,.35);}
  .voice-gate .skip{background:none;border:none;color:#7d8aa3;font-size:14px;font-weight:700;
    text-decoration:underline;box-shadow:none;padding:6px;}
</style>

<!-- 音声を有効化するゲート -->
<div class="voice-gate" id="voiceGate">
  <div class="vg-card">
    <div class="vg-ic">🔊</div>
    <h2>音声案内を有効にしますか？</h2>
    <p>お呼び出し中の番号を <b>ずんだもん（VOICEVOX）</b> の声でアナウンスします。ブラウザの仕様上、最初に一度このボタンを押す必要があります。（後からヘッダーのボタンでON/OFFや声の切替ができます）</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=3"></script>
<script src="app-common.js?v=12"></script>
<script>
"use strict";
showSplash(() => demoBannerIfNeeded());
// 同時接続カウントに加える(モニター端末はブロックしない。お客様側の混雑判定を正確にするため)
try { DB.joinPresence("monitor"); } catch (e) {}

const $ = (id) => document.getElementById(id);

// ---------- 文字サイズ調整 (TV表示用) ----------
// ヘッダーの A−/A＋ で全体の文字を拡大・縮小。設定は端末に保存して次回も維持する。
const SCALE_MIN = 0.7, SCALE_MAX = 2.6, SCALE_STEP = 0.1;
let uiScale = parseFloat(localStorage.getItem("ordyxis-monitor-scale"));
if (isNaN(uiScale)) uiScale = 1;
// 文字サイズを実ピクセルで算出して CSS 変数に渡す。
//   clamp()/vw を font-size の calc に使うと、clamp 非対応の一部TVブラウザでは
//   font-size 宣言ごと無効になり「文字を大きくしても番号が大きくならない」不具合が出る。
//   そこで clamp 相当(min/vw/max)を JS で計算し、var() に px で渡して回避する。
function computeSizes() {
  const w = window.innerWidth || document.documentElement.clientWidth || 1280;
  const cl = (min, vw, max) => Math.min(max, Math.max(min, vw / 100 * w));
  const s = uiScale, root = document.documentElement.style;
  root.setProperty("--ui-scale", s);   // 後方互換 (他で参照される場合に備えて維持)
  root.setProperty("--num-calling", (cl(72, 10, 210) * s).toFixed(1) + "px");
  root.setProperty("--num-waiting", (cl(44, 6, 130) * s).toFixed(1) + "px");
  root.setProperty("--hd-en", (cl(13, 1.4, 20) * s).toFixed(1) + "px");
  root.setProperty("--hd-ja", (cl(26, 3, 46) * s).toFixed(1) + "px");
  root.setProperty("--none-size", (20 * s).toFixed(1) + "px");
}
function applyScale() {
  uiScale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(uiScale * 10) / 10));
  computeSizes();
  $("sizeVal").textContent = Math.round(uiScale * 100) + "%";
  $("sizeDown").disabled = uiScale <= SCALE_MIN;
  $("sizeUp").disabled = uiScale >= SCALE_MAX;
  try { localStorage.setItem("ordyxis-monitor-scale", uiScale); } catch (e) {}
}
$("sizeUp").onclick = () => { uiScale += SCALE_STEP; applyScale(); };
$("sizeDown").onclick = () => { uiScale -= SCALE_STEP; applyScale(); };
applyScale();
// 画面サイズが変わったら vw 相当を再計算 (TVの解像度切替・回転対応)
window.addEventListener("resize", computeSizes);

// ---------- 音声案内 ----------
let voiceOn = true;
let voiceUnlocked = false;
const justCalled = new Set();   // 直近で新しく呼ばれた番号 (アニメ用)
let prevCallingNums = null;     // 前回の呼出中番号セット (初回は null)

// 呼び出し音声のプロバイダ: "zundamon"(外部API: VOICEVOX) | "browser"(ブラウザ標準TTS)
let voiceProvider = localStorage.getItem("ordyxis-monitor-voice") || "zundamon";
const ZUNDAMON_SPEAKER = 3;   // VOICEVOX ずんだもん(ノーマル)
const VOICEVOX_API = "https://api.tts.quest/v3/voicevox/synthesis";
let callAudio = null;         // 呼び出し音声の再生用 (ユーザー操作時に解錠)

function callText(number) {
  return "番号、" + number + "番のお客様、カウンターまでお越しください。";
}
// 標準ブラウザ音声 (ずんだもんが使えない時のフォールバック)
function speakBrowser(number) {
  if (!("speechSynthesis" in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(callText(number));
    u.lang = "ja-JP"; u.rate = 0.95; u.pitch = 1; u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
// ずんだもん音声 (VOICEVOX 外部API)。複数同時でも順番に再生し、失敗時は標準音声へ。
//
// ★ラグ対策: 呼び出しの瞬間に合成APIを叩くと、サーバ側の音声生成待ちで数秒遅れる。
//   そこで「準備中(まだ呼ばれていない)番号」の音声を先に生成・先読みしておき(prefetch)、
//   呼び出し時にはキャッシュ済みのURLを即再生する。これで体感のラグをほぼ無くす。
const zundaCache = new Map();          // number -> { streamUrl, ready, failed, pre, resolvers[] }
const zundaPrefetchQ = [];             // これから生成する番号
let zundaInflight = 0;                 // 同時生成数
const ZUNDA_CONCURRENCY = 2;           // 無料APIに配慮し同時生成数を抑える
const ZUNDA_CACHE_MAX = 80;            // キャッシュ保持上限 (古いものから破棄)

function zundaSynthUrl(number) {
  return VOICEVOX_API + "?speaker=" + ZUNDAMON_SPEAKER + "&text=" + encodeURIComponent(callText(number));
}
// 合成APIが応答しないときに行列が止まらないよう、タイムアウト付きで取得する。
function fetchZunda(url) {
  if (typeof AbortController === "undefined") return fetch(url);
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 8000);
  return fetch(url, { signal: ac.signal }).then(
    (r) => { clearTimeout(timer); return r; },
    (e) => { clearTimeout(timer); throw e; }
  );
}
function evictZundaCache() {
  while (zundaCache.size > ZUNDA_CACHE_MAX) {
    const k = zundaCache.keys().next().value;
    zundaCache.delete(k);
  }
}
// 番号の音声をキャッシュに用意する (既にあれば再利用)。返り値は entry。
function ensureZunda(number) {
  let entry = zundaCache.get(number);
  if (entry) return entry;
  entry = { streamUrl: null, ready: false, failed: false, pre: null, resolvers: [] };
  zundaCache.set(number, entry);
  evictZundaCache();
  zundaPrefetchQ.push(number);
  pumpZundaPrefetch();
  return entry;
}
// 準備中などの番号をまとめて先読み (呼び出し前に合成を済ませておく)。
function prefetchZunda(numbers) {
  if (!voiceOn || voiceProvider !== "zundamon") return;
  numbers.forEach((n) => ensureZunda(n));
}
// 合成APIを叩いて mp3StreamingUrl を解決する。失敗(success=false/URL無/通信失敗)は reject。
function synthZunda(number) {
  return fetchZunda(zundaSynthUrl(number)).then((r) => r.json()).then((d) => {
    if (!d || !d.success || !d.mp3StreamingUrl) throw new Error("zunda-synth-failed");
    return d.mp3StreamingUrl;
  });
}
// ★標準音声に落ちにくくする: 一時的な失敗(レート制限・瞬断)では少し待って数回まで再合成する。
//   先読みでも呼び出し時でも、これで失敗してから初めて標準音声へフォールバックする。
const ZUNDA_RETRY = 2;            // 合成の再試行回数 (これでもダメなら標準音声)
function synthZundaRetry(number, tries) {
  return synthZunda(number).catch((e) => {
    if (tries > 0) return new Promise((res) => setTimeout(res, 700)).then(() => synthZundaRetry(number, tries - 1));
    throw e;
  });
}
function pumpZundaPrefetch() {
  while (zundaInflight < ZUNDA_CONCURRENCY && zundaPrefetchQ.length) {
    const number = zundaPrefetchQ.shift();
    const entry = zundaCache.get(number);
    if (!entry || entry.ready || entry.failed) continue;
    zundaInflight++;
    synthZundaRetry(number, ZUNDA_RETRY).then((url) => {
      entry.streamUrl = url;
      entry.ready = true;
      // 先読みバッファ: Audio要素に取り込ませておくと再生開始が更に速い (CORS不要)。
      try { const pre = new Audio(); pre.preload = "auto"; pre.src = url; pre.load(); entry.pre = pre; } catch (e) {}
    }).catch(() => { entry.failed = true; }).then(() => {
      zundaInflight--;
      const rs = entry.resolvers; entry.resolvers = [];
      rs.forEach((fn) => { try { fn(); } catch (e) {} });
      pumpZundaPrefetch();
    });
  }
}
// entry が確定 (ready / failed) するまで待つ
function whenZundaSettled(entry) {
  if (entry.ready || entry.failed) return Promise.resolve();
  return new Promise((res) => entry.resolvers.push(res));
}

const zundaQueue = [];
let zundaPlaying = false;
function enqueueZundamon(number) {
  ensureZunda(number);            // まだ無ければ生成を開始
  zundaQueue.push(number);
  if (!zundaPlaying) playNextZundamon();
}
function playNextZundamon() {
  if (!zundaQueue.length) { zundaPlaying = false; return; }
  zundaPlaying = true;
  const number = zundaQueue.shift();
  const next = () => { setTimeout(playNextZundamon, 150); };
  const toBrowser = () => { speakBrowser(number); setTimeout(next, 1800); };
  // 再生に失敗 or 先読みが失敗していた場合、呼び出し時にもう一度だけ合成し直して
  // ずんだもんで鳴らすのを試みる。それでもダメなときだけ標準音声へ落とす。
  let recovering = false;
  const recoverOrBrowser = () => {
    if (recovering) { toBrowser(); return; }
    recovering = true;
    synthZundaRetry(number, ZUNDA_RETRY).then((url) => {
      const e = ensureZunda(number); e.streamUrl = url; e.ready = true; e.failed = false;
      playUrl(url);
    }).catch(toBrowser);
  };
  const playUrl = (src) => {
    try {
      const a = callAudio || (callAudio = new Audio());
      a.onended = next;
      a.onerror = recoverOrBrowser;   // 再生エラー時はまず再合成を試す
      a.src = src;
      const p = a.play();
      if (p && p.catch) p.catch(recoverOrBrowser);
    } catch (e) { recoverOrBrowser(); }
  };
  const entry = ensureZunda(number);
  // 呼び出された番号は最優先: 生成待ち行列の先頭へ繰り上げる
  const qi = zundaPrefetchQ.indexOf(number);
  if (qi > 0) { zundaPrefetchQ.splice(qi, 1); zundaPrefetchQ.unshift(number); pumpZundaPrefetch(); }
  if (entry.ready && entry.streamUrl) { playUrl(entry.streamUrl); return; }
  if (entry.failed) { recoverOrBrowser(); return; }   // 先読み失敗でも呼び出し時に再合成を試す
  whenZundaSettled(entry).then(() => {
    if (entry.ready && entry.streamUrl) playUrl(entry.streamUrl);
    else recoverOrBrowser();
  });
}
function speakCall(number) {
  if (!voiceOn || !voiceUnlocked) return;
  if (voiceProvider === "zundamon") enqueueZundamon(number);
  else speakBrowser(number);
}
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [880, 1175, 1568];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; g.gain.value = 0.0001;
      const t = ctx.currentTime + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.start(t); o.stop(t + 0.34);
    });
  } catch (e) {}
}
// 新しく呼ばれた番号をまとめてアナウンス
function announce(numbers) {
  if (!numbers.length || !voiceOn || !voiceUnlocked) return;
  chime();
  // チャイムと少し重ねて発話を早める (従来700ms→400ms)。連続呼び出しは順番待ちで
  // 再生されるため、開始間隔も詰める (200ms→120ms)。音声自体は先読み済みで即再生される。
  numbers.forEach((n, i) => setTimeout(() => speakCall(n), 400 + i * 120));
}

// 音声有効化ゲート
// 無音WAVを生成 (HTMLAudio をユーザー操作中に一度再生して、後の自動再生を許可させる用)
function silentWavUrl() {
  const sr = 8000, n = Math.floor(sr * 0.12);
  const buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); dv.setUint32(4, 36 + n, true); put(8, "WAVE"); put(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  put(36, "data"); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128);   // 8bit 無音 (中央値)
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function unlockVoice() {
  voiceUnlocked = true;
  // 無音の発話で音声エンジンを起動 (初回ユーザー操作時)
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; window.speechSynthesis.speak(u); } catch (e) {}
  // ずんだもん用の HTMLAudio も、操作中に一度 無音を再生して解錠しておく
  try {
    callAudio = callAudio || new Audio();
    callAudio.src = silentWavUrl();
    const p = callAudio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
  $("voiceGate").classList.add("hidden");
  updateVoiceToggle();
}
function updateVoiceToggle() {
  const b = $("voiceToggle");
  b.classList.toggle("on", voiceOn && voiceUnlocked);
  b.textContent = (voiceOn && voiceUnlocked) ? "🔊 ON" : "🔇 OFF";
}
// 呼び出しの声の切替 (ずんだもん ⇄ 標準音声)
function updateVoiceProviderBtn() {
  const b = $("voiceVoice");
  const zunda = voiceProvider === "zundamon";
  b.classList.toggle("zunda", zunda);
  b.textContent = zunda ? "🟢 ずんだもん" : "🗣 標準音声";
}
$("voiceVoice").onclick = () => {
  voiceProvider = voiceProvider === "zundamon" ? "browser" : "zundamon";
  try { localStorage.setItem("ordyxis-monitor-voice", voiceProvider); } catch (e) {}
  updateVoiceProviderBtn();
};
updateVoiceProviderBtn();
$("voiceEnable").onclick = () => { voiceOn = true; unlockVoice(); };
$("voiceSkip").onclick = () => { voiceOn = false; $("voiceGate").classList.add("hidden"); updateVoiceToggle(); };
$("voiceToggle").onclick = () => {
  if (!voiceUnlocked) { unlockVoice(); voiceOn = true; }
  else { voiceOn = !voiceOn; }
  updateVoiceToggle();
};

function renderNums(elId, orders, emptyMsg, highlight, addedSet) {
  const el = $(elId);
  el.innerHTML = orders.length
    ? orders.map((o) => {
        const cls = "num"
          + (highlight && justCalled.has(o.number) ? " justcalled" : "")
          + (addedSet && addedSet.has(o.number) ? " justadded" : "");
        return `<div class="${cls}" data-no="${o.number}">${fmtNo(o.number)}</div>`;
      }).join("")
    : `<div class="none">${emptyMsg}</div>`;
}

let latestToday = [];           // 本日の注文 (時刻ベースの再描画用)
let prevWaitingNums = null;     // 前回の準備中番号セット (新着検出用、初回は null)

// 準備中に出すもの:
//   ・今すぐ注文
//   ・時間指定予約のうち「来店確認済み」かつ「受取時刻が到来した」もの
// (来店未確認、または受取時刻にまだ達していない予約は出さない)
function renderWaiting() {
  const now = new Date();
  // 紙オーダーも番号(401〜)を持つので、QR注文と同様に準備中モニターへ出す。
  const waitingOrders = latestToday.filter((o) => inPrep(o, now));
  const nums = waitingOrders.map((o) => o.number);
  // 準備中の番号は次に呼ばれる候補。音声を先読みしておき、呼び出し時のラグを無くす。
  prefetchZunda(nums);
  const set = new Set(nums);
  // 前回には無く今回現れた番号 = 準備中に新しく追加されたもの
  let newly = [];
  if (prevWaitingNums !== null) newly = nums.filter((n) => !prevWaitingNums.has(n));
  prevWaitingNums = set;
  renderNums("numsWaiting", waitingOrders, "準備中の番号はありません", false, new Set(newly));
  // 新着があれば、その番号が必ず画面に映るようスクロールして数秒保持する
  if (newly.length) focusWaiting(newly[newly.length - 1]);
}

DB.watchOrders((orders) => {
  const today = orders.filter((o) => o.day === ordyxisDayKey());
  latestToday = today;
  const callingOrders = today.filter((o) => o.status === "calling");
  const callingNums = callingOrders.map((o) => o.number);
  const callingSet = new Set(callingNums);

  // 新しく「呼出中」になった番号を検出してアナウンス
  justCalled.clear();
  if (prevCallingNums !== null) {
    const newly = callingNums.filter((n) => !prevCallingNums.has(n));
    newly.forEach((n) => justCalled.add(n));
    if (newly.length) announce(newly);
  }
  prevCallingNums = callingSet;

  renderNums("numsCalling", callingOrders, "現在お呼び出し中の番号はありません", true);
  renderWaiting();
});

// ---------- もう一度呼び出す (再アナウンス) ----------
// 店舗側の「もう一度呼び出す」で DB2(ordyxis2) に書かれる再呼び出しシグナルを購読し、
// 新しいシグナル(ts が前回より新しい)を検知したら、その番号を音声で再アナウンスする。
// 注文の状態(呼出中)は変わらないため、通常の watchOrders では再生されない分を補う。
let recallSeen = null;   // { orderId: ts } 既読のタイムスタンプ (初回 null = 起動前の分は鳴らさない)
DB2.watchRecall((map) => {
  map = map || {};
  if (recallSeen === null) {
    // 起動時点の既存シグナルは「既読」として扱い、過去分を再生しない。
    recallSeen = {};
    Object.keys(map).forEach((id) => { recallSeen[id] = (map[id] && map[id].ts) || 0; });
    return;
  }
  const nums = [];
  Object.keys(map).forEach((id) => {
    const ts = (map[id] && map[id].ts) || 0;
    if (ts > (recallSeen[id] || 0)) { nums.push(map[id].number); recallSeen[id] = ts; }
  });
  if (nums.length) announce(nums);
});

// 受取時刻の到来を反映するため定期的に再評価 (予約 → 準備中への自動移動)
setInterval(renderWaiting, 30000);

// ---------- 自動スクロール ----------
// 番号が増えて画面に収まらなくなった列は、ゆっくり下までスクロール → 上へ戻る、を繰り返す。
// (収まっているときは何もしない。店頭ディスプレイでスクロール操作不要にするため。)
const scrollState = new Map();   // 列要素 -> {dir, pause, holdUntil}
(function autoScroll() {
  const cols = [$("numsCalling"), $("numsWaiting")];
  const SPEED = 0.7;     // 1フレームあたりのスクロール量(px)
  const PAUSE = 80;      // 端での停止フレーム数 (約1.3秒)
  cols.forEach((el) => scrollState.set(el, { dir: 1, pause: PAUSE, holdUntil: 0 }));
  function step() {
    const now = performance.now();
    cols.forEach((el) => {
      const max = el.scrollHeight - el.clientHeight;
      const s = scrollState.get(el);
      if (max <= 4) { if (el.scrollTop) el.scrollTop = 0; s.dir = 1; s.pause = PAUSE; return; }
      if (now < s.holdUntil) return;   // 新着表示などで一時停止中はスクロールしない
      if (s.pause > 0) { s.pause--; return; }
      el.scrollTop += SPEED * s.dir;
      if (el.scrollTop >= max - 0.5) { el.scrollTop = max; s.dir = -1; s.pause = PAUSE; }
      else if (el.scrollTop <= 0.5) { el.scrollTop = 0; s.dir = 1; s.pause = PAUSE; }
    });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

// 準備中に新しく追加された番号を画面内へスクロールし、数秒間そこで保持する。
// (自動スクロールの最中でも、追加された番号がその場で必ず見えるようにする。)
function focusWaiting(number) {
  const el = $("numsWaiting");
  const target = el.querySelector('.num[data-no="' + number + '"]');
  if (!target) return;
  const max = el.scrollHeight - el.clientHeight;
  if (max > 4) {
    // 対象を列の中央あたりに収める位置までスクロール
    const cr = el.getBoundingClientRect(), tr = target.getBoundingClientRect();
    let top = el.scrollTop + (tr.top - cr.top) - (el.clientHeight - target.clientHeight) / 2;
    el.scrollTop = Math.max(0, Math.min(max, top));
  }
  const s = scrollState.get(el);
  if (s) { s.holdUntil = performance.now() + 5000; s.dir = 1; s.pause = 0; }
}
</script>
