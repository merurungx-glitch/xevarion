     ★★ 2026-10-30 MagiBattle 3.0 — 1から作り直し（ご指定）
     ・内容は部隊シューティングとアリーナ。スキルのカット演出はキャラの画像（MagiBurst/img/ss/）、戦闘はドット絵（後ろ姿）。
     ・使えるのは超極華祭・超極煌祭・超極彩祭の UR 12体だけ（持っているキャラ）。性能は ../magibattle-stats.js（MBStats v3）が持ち主。

       mb3-bgm（オリジナル BGM）・mb3-save（セーブ・育成）・mb3-net（アリーナ・迎撃戦の記録＝Firebase）・mb3-ui／mb3-ui2（画面）・
       mb3-guide（使い方のアニメ）・mb3-main（はじまり）。オフラインは sw.js。
     ★★ 2026-10-31 明るくカラフルな見た目に作り直し（ご指定「暗く分かりづらい」）・下のナビは 部隊・編成・ロビー・アリーナ・ショップ。
