<!-- ══════════ スコアアタックの月間ランキング（Firebase xevarion-online・前と同じ） ══════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAivkOwjWlmqJSNmnSjOs4-PUAcVFOfbiY",
  authDomain: "xevarion-online.firebaseapp.com",
  databaseURL: "https://xevarion-online-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xevarion-online",
  storageBucket: "xevarion-online.firebasestorage.app",
  messagingSenderId: "513584168485",
  appId: "1:513584168485:web:d2a009325df677b746c9cc",
  measurementId: "G-28C5G2BFR5"
};
/* xevarion-fb.js が既定アプリを初期化済みのため、名前付きアプリとして共存させる */
const app = initializeApp(firebaseConfig, "magibattle");
const db = getDatabase(app);

function monthKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function prevMonthKey() { const d = new Date(); return monthKey(new Date(d.getFullYear(), d.getMonth() - 1, 1)); }

/* ベストスコアのみ保持（毎月のノード scoreattack/{YYYY-MM}/{uid} ＝ 月替わりで自動リセット） */
async function submitScore(uid, name, charFile, score) {
  score = Math.round(score || 0);
  if (!uid || score <= 0) return { error: "arg" };
  try {
    await runTransaction(ref(db, "scoreattack/" + monthKey() + "/" + uid), (cur) => {
      if (cur && (cur.score || 0) >= score) return cur;
      return { name: String(name || "?").slice(0, 24), charFile: charFile || "", score, ts: Date.now() };
    });
    return { ok: true };
  } catch (e) { return { error: "net" }; }
}
async function getRanking(ym) {
  ym = ym || monthKey();
  try {
    const snap = await get(ref(db, "scoreattack/" + ym));
    const rows = [];
    snap.forEach((c) => { const v = c.val() || {}; rows.push({ uid: c.key, name: v.name || "?", charFile: v.charFile || "", score: v.score || 0 }); });
    rows.sort((a, b) => b.score - a.score);
    return rows;
  } catch (e) { return []; }
}
/* 前月報酬：1位1000 / 2位500 / 3位300 / 4〜10位150（XEVARIONFB.awardXeva で配布・claims で二重受取を防ぐ） */
const SA_REWARDS = [1000, 500, 300, 150, 150, 150, 150, 150, 150, 150];
async function claimPrevReward(uid) {
  if (!uid) return { ok: false };
  if (!(window.XEVARIONFB && window.XEVARIONFB.awardXeva)) return { ok: false, notReady: true };
  const pym = prevMonthKey();
  try {
    const flagRef = ref(db, "scoreattack-claims/" + pym + "/" + uid);
    const s = await get(flagRef);
    if (s.exists()) return { ok: false, already: true };
    const rows = await getRanking(pym);
    const idx = rows.findIndex((r) => r.uid === uid);
    if (idx < 0 || idx >= SA_REWARDS.length || !(rows[idx].score > 0)) return { ok: false };
    const amount = SA_REWARDS[idx];
    const r = await window.XEVARIONFB.awardXeva(uid, amount, "MagiBattle スコアアタック " + pym + " " + (idx + 1) + "位");
    if (!(r && r.ok)) return { ok: false };
    await set(flagRef, { amount, rank: idx + 1, ts: Date.now() });
    return { ok: true, amount, rank: idx + 1 };
  } catch (e) { return { ok: false }; }
}
window.MBFB = { submitScore, getRanking, claimPrevReward, monthKey, prevMonthKey, SA_REWARDS, ready: true };
try { window.dispatchEvent(new Event("mbfb:ready")); } catch (e) {}
</script>
